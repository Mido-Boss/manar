const GRAMMAR=[
{ta:"الضمائر المنفصلة",tav:"الضَّمَائِرُ الْمُنْفَصِلَةُ",t:"Les pronoms personnels (singulier, duel, pluriel)",h:`
<p>Les pronoms personnels isolés (<span class="ar">الضَّمَائِرُ الْمُنْفَصِلَةُ</span>) servent à désigner une personne : « je, tu, il… ». En arabe, ils sont plus nombreux qu'en français pour trois raisons. D'abord, l'arabe distingue le <strong>masculin et le féminin à la deuxième personne</strong> : on ne dit pas « tu » de la même façon à un homme (<span class="ar">أَنْتَ</span> anta) et à une femme (<span class="ar">أَنْتِ</span> anti). Ensuite, il distingue « ils » (<span class="ar">هُمْ</span>) de « elles » (<span class="ar">هُنَّ</span>). Enfin — et c'est une spécificité de l'arabe — il existe un <strong>troisième nombre</strong> entre le singulier et le pluriel : le <strong>duel</strong> (<span class="ar">الْمُثَنَّى</span>), utilisé quand on parle d'<em>exactement deux</em> personnes.</p>
<table class="gtable keepv"><tr><th>Arabe</th><th>Prononciation</th><th>Français</th></tr>
<tr><th colspan="3">Singulier (une personne)</th></tr>
<tr><td class="ar">أَنَا</td><td>anā</td><td>je / moi</td></tr>
<tr><td class="ar">أَنْتَ</td><td>anta</td><td>tu (à un homme)</td></tr>
<tr><td class="ar">أَنْتِ</td><td>anti</td><td>tu (à une femme)</td></tr>
<tr><td class="ar">هُوَ</td><td>huwa</td><td>il</td></tr>
<tr><td class="ar">هِيَ</td><td>hiya</td><td>elle</td></tr>
<tr><th colspan="3">Duel (exactement deux personnes)</th></tr>
<tr><td class="ar">أَنْتُمَا</td><td>antumā</td><td>vous deux (homme ou femme)</td></tr>
<tr><td class="ar">هُمَا</td><td>humā</td><td>eux deux / elles deux</td></tr>
<tr><th colspan="3">Pluriel (trois personnes ou plus)</th></tr>
<tr><td class="ar">نَحْنُ</td><td>naḥnu</td><td>nous</td></tr>
<tr><td class="ar">أَنْتُمْ</td><td>antum</td><td>vous (plusieurs hommes / groupe mixte)</td></tr>
<tr><td class="ar">أَنْتُنَّ</td><td>antunna</td><td>vous (plusieurs femmes)</td></tr>
<tr><td class="ar">هُمْ</td><td>hum</td><td>ils</td></tr>
<tr><td class="ar">هُنَّ</td><td>hunna</td><td>elles</td></tr></table>
<p>Remarquez que le duel est plus simple que le reste : <span class="ar">أَنْتُمَا</span> et <span class="ar">هُمَا</span> servent au masculin <em>et</em> au féminin. Autre différence avec le français : il n'y a pas de « vous » de politesse. On s'adresse à un professeur ou un inconnu avec la même forme qu'à un ami — le respect passe par le ton et les formules, pas par le pronom.</p>
<div class="gnote">Détail utile pour la lecture : sans les petites voyelles, <span class="ar keepv">أنت</span> peut être « tu » masculin (<span class="ar keepv">أَنْتَ</span>) ou féminin (<span class="ar keepv">أَنْتِ</span>). Seul le contexte (ou la vocalisation — le bouton ـَـّ en haut) permet de trancher. C'est un premier exemple d'une règle générale de l'arabe écrit : beaucoup d'ambiguïtés se résolvent par le contexte.</div>
<div class="gex"><span class="ar">هِيَ طَبِيبَةٌ وَهُوَ مُعَلِّمٌ.</span> — Elle est médecin et il est enseignant.<br><span class="ar">نَحْنُ فِي الْبَيْتِ وَهُمْ فِي الْمَدْرَسَةِ.</span> — Nous sommes à la maison et ils sont à l'école.<br><span class="ar">أَنْتُمَا صَدِيقَانِ.</span> — Vous deux, vous êtes amis.</div>
<p>Un point qui surprend au début : dans une phrase comme <span class="ar">أَنَا طَالِبٌ</span> (« je suis étudiant »), il n'y a aucun verbe. Le pronom et l'attribut se suffisent. C'est la « phrase nominale », que nous verrons en détail dans la leçon 7.</p>`},

{ta:"المذكر والمؤنث",tav:"الْمُذَكَّرُ وَالْمُؤَنَّثُ",t:"Le masculin et le féminin",h:`
<p>Tout nom arabe est soit masculin, soit féminin — il n'y a pas de neutre. La bonne nouvelle : le féminin se reconnaît presque toujours à sa terminaison <span class="ar">ة</span> (tā' marbūṭa, le « t attaché »). Pour former le féminin d'un adjectif ou d'un nom de métier, il suffit en général d'ajouter ce <span class="ar">ة</span> :</p>
<table class="gtable"><tr><th>Masculin</th><th>Féminin</th><th>Sens</th></tr>
<tr><td class="ar">كَبِير</td><td class="ar">كَبِيرَة</td><td>grand / grande</td></tr>
<tr><td class="ar">جَمِيل</td><td class="ar">جَمِيلَة</td><td>beau / belle</td></tr>
<tr><td class="ar">طَالِب</td><td class="ar">طَالِبَة</td><td>étudiant / étudiante</td></tr>
<tr><td class="ar">طَبِيب</td><td class="ar">طَبِيبَة</td><td>médecin (h. / f.)</td></tr>
<tr><td class="ar">مُعَلِّم</td><td class="ar">مُعَلِّمَة</td><td>enseignant / enseignante</td></tr></table>
<p>L'adjectif <strong>suit</strong> le nom (jamais devant !) et s'accorde avec lui sur trois plans : le <strong>genre</strong>, le <strong>nombre</strong>, et — c'est la partie inhabituelle — la <strong>définition</strong>. Si le nom porte <span class="ar">ال</span>, l'adjectif doit le porter aussi :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">بِنْتٌ صَغِيرَة</td><td>une petite fille</td></tr>
<tr><td class="ar">الْبِنْتُ الصَّغِيرَة</td><td>la petite fille (les deux mots portent ال)</td></tr>
<tr><td class="ar">الْبِنْتُ صَغِيرَة</td><td>⚠ la fille est petite — c'est devenu une phrase !</td></tr></table>
<div class="gnote">Ce dernier contraste est fondamental : <span class="ar">ال + ال</span> = groupe nominal, <span class="ar">ال</span> + adjectif nu = phrase nominale. En lisant, vérifiez toujours si l'adjectif porte l'article : cela change complètement le sens de ce que vous lisez.</div>
<p>Quelques féminins ne portent pas de <span class="ar">ة</span> (par exemple <span class="ar">أُمّ</span> — mère, <span class="ar">شَمْس</span> — soleil, <span class="ar">عَيْن</span> — œil) et certains adjectifs ont un féminin irrégulier : les couleurs notamment (<span class="ar">أَبْيَض / بَيْضَاء</span> — blanc / blanche, <span class="ar">أَحْمَر / حَمْرَاء</span> — rouge / rouge f., <span class="ar">أَخْضَر / خَضْرَاء</span> — vert / verte). Vous les rencontrerez dans les textes : le dictionnaire de l'app vous donnera la forme de base.</p>
<div class="gex"><span class="ar">أَخِي طَوِيلٌ وَأُخْتِي طَوِيلَةٌ.</span> — Mon frère est grand et ma sœur est grande.<br><span class="ar">السَّمَاءُ زَرْقَاءُ وَالْحُقُولُ خَضْرَاءُ.</span> — Le ciel est bleu et les champs sont verts.</div>`},

{ta:"أل التعريف",tav:"أَلْ التَّعْرِيفِ",t:"L'article défini ال et les lettres solaires",h:`
<p>L'arabe n'a <strong>pas d'article indéfini</strong> : « un livre » se dit simplement <span class="ar">كِتَاب</span>. L'absence d'article suffit à marquer l'indéfini. Pour dire « le / la / les », on colle le préfixe <span class="ar">ال</span> (al-) au début du mot : <span class="ar">الْكِتَاب</span> — le livre. Un seul article pour tous les genres et tous les nombres : <span class="ar">الْبَيْت، الْمَدْرَسَة، الْكُتُب</span>.</p>
<p>À l'oral (et dans les textes vocalisés), le <span class="ar">ل</span> de l'article se comporte de deux façons selon la première lettre du mot :</p>
<table class="gtable keepv"><tr><th>Type</th><th>Lettres</th><th>Exemple</th><th>Prononciation</th></tr>
<tr><td>Lettres lunaires</td><td class="ar">ا ب ج ح خ ع غ ف ق ك م ه و ي</td><td class="ar">الْقَمَر</td><td>al-qamar (le ل s'entend)</td></tr>
<tr><td>Lettres solaires</td><td class="ar">ت ث د ذ ر ز س ش ص ض ط ظ ل ن</td><td class="ar">الشَّمْس</td><td>ash-shams (le ل disparaît, la lettre suivante est doublée)</td></tr></table>
<div class="gnote">D'où les noms : <span class="ar">قَمَر</span> (lune) commence par une lettre « lunaire », <span class="ar">شَمْس</span> (soleil) par une lettre « solaire ». Dans l'écriture, le <span class="ar">ل</span> reste toujours écrit — activez le bouton des voyelles (ـَـّ) et vous verrez la shadda (ـّ) sur la lettre solaire, par exemple dans <span class="ar">السُّوق</span> ou <span class="ar">النَّافِذَة</span>.</div>
<p>L'article fusionne avec certaines prépositions collées :</p>
<table class="gtable"><tr><th>Combinaison</th><th>Résultat</th><th>Exemple</th></tr>
<tr><td class="ar">بـ + ال</td><td class="ar">بال</td><td class="ar">بِالسَّيَّارَة — en voiture</td></tr>
<tr><td class="ar">لـ + ال</td><td class="ar">لل (le ا disparaît !)</td><td class="ar">لِلْجَمِيع — pour tous ; لِلْمَدْرَسَة — pour l'école</td></tr>
<tr><td class="ar">كـ + ال</td><td class="ar">كال</td><td class="ar">كَالْبَحْر — comme la mer</td></tr></table>
<div class="gex"><span class="ar">أَذْهَبُ إِلَى الْمَدْرَسَةِ بِالْحَافِلَةِ.</span> — Je vais à l'école en bus.<br><span class="ar">اِشْتَرَيْنَا خُبْزًا مِنَ السُّوقِ.</span> — Nous avons acheté du pain au marché (خبزا sans article = « du pain »).</div>`},

{ta:"المفرد والمثنى والجمع",tav:"الْمُفْرَدُ وَالْمُثَنَّى وَالْجَمْعُ",t:"Le nombre : singulier, duel et pluriel",h:`
<p>Le français connaît deux nombres : le singulier et le pluriel. L'arabe en connaît <strong>trois</strong> : le <strong>singulier</strong> (<span class="ar">الْمُفْرَد</span>, une seule chose), le <strong>duel</strong> (<span class="ar">الْمُثَنَّى</span>, <em>exactement deux</em>) et le <strong>pluriel</strong> (<span class="ar">الْجَمْع</span>, trois ou plus). C'est une des grandes originalités de la langue, et elle traverse toute la grammaire : noms, adjectifs, pronoms (leçon 1) et verbes (leçons 9 et 10).</p>
<p><strong>1. Le duel</strong> est parfaitement régulier : on ajoute au nom la terminaison <span class="ar">ـَانِ</span> (quand le mot est sujet) ou <span class="ar">ـَيْنِ</span> (après un verbe ou une préposition — voir la leçon 13 sur l'iʿrāb). Pour un nom féminin, le <span class="ar">ة</span> s'ouvre en <span class="ar">ت</span> avant la terminaison. Le duel se suffit à lui-même : inutile d'ajouter le chiffre « deux ».</p>
<table class="gtable"><tr><th>Singulier</th><th>Duel (sujet)</th><th>Duel (autres cas)</th><th>Sens</th></tr>
<tr><td class="ar">كِتَاب</td><td class="ar">كِتَابَانِ</td><td class="ar">كِتَابَيْنِ</td><td>livre → deux livres</td></tr>
<tr><td class="ar">وَلَد</td><td class="ar">وَلَدَانِ</td><td class="ar">وَلَدَيْنِ</td><td>garçon → deux garçons</td></tr>
<tr><td class="ar">طَالِبَة</td><td class="ar">طَالِبَتَانِ</td><td class="ar">طَالِبَتَيْنِ</td><td>étudiante → deux étudiantes</td></tr>
<tr><td class="ar">سَاعَة</td><td class="ar">سَاعَتَانِ</td><td class="ar">سَاعَتَيْنِ</td><td>heure → deux heures</td></tr></table>
<p><strong>2. Le pluriel</strong> (trois ou plus) a deux grandes formes. La première est régulière (le « pluriel sain ») : on ajoute un suffixe. <span class="ar">ـُونَ</span> (ou <span class="ar">ـِينَ</span> selon la place dans la phrase) pour les personnes masculines, <span class="ar">ـَات</span> pour le féminin. La seconde, très répandue, est le <strong>pluriel brisé</strong> (<span class="ar">جَمْعُ التَّكْسِيرِ</span>) : on ne colle rien, on <em>casse</em> le mot de l'intérieur en changeant ses voyelles, un peu comme l'anglais <em>man → men</em>. Il faut l'apprendre avec chaque mot.</p>
<p>Voici les trois nombres côte à côte — c'est le tableau à retenir de cette leçon :</p>
<table class="gtable"><tr><th>Singulier (1)</th><th>Duel (2)</th><th>Pluriel (3+)</th><th>Sens</th></tr>
<tr><td class="ar">مُعَلِّم</td><td class="ar">مُعَلِّمَانِ</td><td class="ar">مُعَلِّمُونَ / مُعَلِّمِينَ</td><td>enseignant(s) — pluriel sain masculin</td></tr>
<tr><td class="ar">مُعَلِّمَة</td><td class="ar">مُعَلِّمَتَانِ</td><td class="ar">مُعَلِّمَات</td><td>enseignante(s) — pluriel sain féminin</td></tr>
<tr><td class="ar">سَيَّارَة</td><td class="ar">سَيَّارَتَانِ</td><td class="ar">سَيَّارَات</td><td>voiture(s)</td></tr>
<tr><td class="ar">كِتَاب</td><td class="ar">كِتَابَانِ</td><td class="ar">كُتُب</td><td>livre(s) — pluriel brisé</td></tr>
<tr><td class="ar">بَيْت</td><td class="ar">بَيْتَانِ</td><td class="ar">بُيُوت</td><td>maison(s) — brisé</td></tr>
<tr><td class="ar">رَجُل</td><td class="ar">رَجُلَانِ</td><td class="ar">رِجَال</td><td>homme(s) — brisé</td></tr>
<tr><td class="ar">طِفْل</td><td class="ar">طِفْلَانِ</td><td class="ar">أَطْفَال</td><td>enfant(s) — brisé</td></tr>
<tr><td class="ar">صَدِيق</td><td class="ar">صَدِيقَانِ</td><td class="ar">أَصْدِقَاء</td><td>ami(s) — brisé</td></tr></table>
<p>L'adjectif suit le nombre du nom : au duel, il prend lui aussi <span class="ar">ـَانِ</span> : <span class="ar">وَلَدَانِ صَغِيرَانِ</span> — deux petits garçons.</p>
<div class="gnote">Règle d'accord étonnante mais essentielle : un pluriel qui ne désigne <strong>pas des personnes</strong> s'accorde comme un <strong>féminin singulier</strong>. On dit <span class="ar">كُتُبٌ كَثِيرَة</span> (littéralement « des livres nombreuse » !), <span class="ar">الْبُيُوتُ كَبِيرَة</span> — les maisons sont grandes, et <span class="ar">هِيَ</span> pour « ils » en parlant d'objets. C'est pour cela que dans les textes, les adjectifs après des pluriels d'objets se terminent en <span class="ar">ة</span>. Le duel, lui, s'accorde normalement.</div>
<div class="gnote">Réflexe de lecture : une terminaison <span class="ar">ـان / ـين</span> sur un nom ? Pensez « deux » avant de penser « pluriel ». <span class="ar">ـون</span> ? Pluriel de personnes. <span class="ar">ـات</span> ? Pluriel féminin ou d'objets. Le choix entre ان/ين et ون/ين dépend du rôle du mot dans la phrase — c'est l'iʿrāb, expliqué dans la leçon 13.</div>
<div class="gex"><span class="ar">عِنْدِي أَخَوَانِ وَأُخْتٌ وَاحِدَةٌ.</span> — J'ai deux frères et une seule sœur.<br><span class="ar">فِي الْمَكْتَبَةِ كُتُبٌ كَثِيرَةٌ بِلُغَاتٍ مُخْتَلِفَةٍ.</span> — À la bibliothèque, il y a beaucoup de livres en différentes langues.<br><span class="ar">الْجِيرَانُ طَيِّبُونَ.</span> — Les voisins sont gentils (personnes → pluriel sain).</div>`},

{ta:"ضمائر الملكية",tav:"ضَمَائِرُ الْمِلْكِيَّةِ",t:"Les suffixes possessifs",h:`
<p>Pour dire « mon livre », le français utilise deux mots : un possessif + un nom. L'arabe n'en utilise qu'un seul : le possessif est un <strong>suffixe collé à la fin du nom</strong>. <span class="ar">كِتَاب</span> (livre) + <span class="ar">ـِي</span> (mon) = <span class="ar">كِتَابِي</span> (mon livre). C'est l'un des mécanismes les plus fréquents de la langue : dès qu'un mot vous semble « trop long », demandez-vous s'il ne se termine pas par un suffixe possessif.</p>
<table class="gtable keepv"><tr><th>Suffixe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">ـِي</td><td>mon / ma</td><td class="ar">بَيْتِي — ma maison</td></tr>
<tr><td class="ar">ـكَ</td><td>ton / ta (à un homme)</td><td class="ar">كِتَابُكَ — ton livre</td></tr>
<tr><td class="ar">ـكِ</td><td>ton / ta (à une femme)</td><td class="ar">كِتَابُكِ — ton livre</td></tr>
<tr><td class="ar">ـهُ</td><td>son / sa (à lui)</td><td class="ar">أَخُوهُ — son frère</td></tr>
<tr><td class="ar">ـهَا</td><td>son / sa (à elle)</td><td class="ar">أُمُّهَا — sa mère</td></tr>
<tr><td class="ar">ـكُمَا</td><td>votre (à vous deux — duel)</td><td class="ar">بَيْتُكُمَا — votre maison à vous deux</td></tr>
<tr><td class="ar">ـهُمَا</td><td>leur (à eux deux / elles deux — duel)</td><td class="ar">بَيْتُهُمَا — leur maison à eux deux</td></tr>
<tr><td class="ar">ـنَا</td><td>notre / nos</td><td class="ar">بَيْتُنَا — notre maison</td></tr>
<tr><td class="ar">ـكُمْ</td><td>votre / vos (pluriel)</td><td class="ar">مَدْرَسَتُكُمْ — votre école</td></tr>
<tr><td class="ar">ـكُنَّ</td><td>votre (à plusieurs femmes)</td><td class="ar">مَدْرَسَتُكُنَّ — votre école (f.)</td></tr>
<tr><td class="ar">ـهُمْ</td><td>leur / leurs</td><td class="ar">جَدُّهُمْ — leur grand-père</td></tr>
<tr><td class="ar">ـهُنَّ</td><td>leur (à elles)</td><td class="ar">جَدُّهُنَّ — leur grand-père (f.)</td></tr></table>
<p>Vous reconnaissez la logique de la leçon 1 : les suffixes suivent exactement les mêmes distinctions que les pronoms — masculin / féminin, et les trois nombres singulier / duel / pluriel. Le duel <span class="ar">ـكُمَا / ـهُمَا</span> sert, comme toujours, aux deux genres.</p>
<p>Règle d'orthographe essentielle : quand un nom féminin terminé par <span class="ar">ة</span> (tā' marbūṭa) reçoit un suffixe, ce <span class="ar">ة</span> <strong>s'ouvre et devient</strong> <span class="ar">ت</span>. Ainsi <span class="ar">مَدْرَسَة</span> (école) donne <span class="ar">مَدْرَسَتِي</span> (mon école), <span class="ar">مَدْرَسَتُهَا</span> (son école à elle), <span class="ar">مَدْرَسَتُنَا</span> (notre école). Si vous croisez un <span class="ar">ت</span> inattendu vers la fin d'un mot, c'est souvent un ancien <span class="ar">ة</span>.</p>
<div class="gnote">Ces mêmes suffixes se collent aussi aux <strong>verbes</strong> (où ils signifient « me, te, le, la… » : <span class="ar">فَحَصَنِي</span> — il m'a examiné, <span class="ar">أَعْطَيْتُهَا</span> — je lui ai donné à elle) et aux <strong>prépositions</strong> (<span class="ar">مَعَهُ</span> — avec lui, <span class="ar">لَكَ</span> — pour toi, <span class="ar">عِنْدَنَا</span> — chez nous). Un seul système à apprendre, trois usages.</div>
<div class="gex"><span class="ar">هَذَا كِتَابِي وَهَذَا كِتَابُكَ.</span> — Ceci est mon livre et ceci est ton livre.<br><span class="ar">بَيْتُهَا قَرِيبٌ مِنْ بَيْتِنَا.</span> — Sa maison (à elle) est proche de notre maison.</div>`},

{ta:"أسماء الإشارة",tav:"أَسْمَاءُ الْإِشَارَةِ",t:"Les démonstratifs : ceci, cela",h:`
<p>Pour montrer quelque chose, l'arabe accorde le démonstratif en genre, en nombre (y compris le duel !) et en distance, comme le français « ceci / cela » :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">هَذَا</td><td>ce, ceci (masculin, proche)</td><td class="ar">هَذَا كِتَابِي — c'est mon livre</td></tr>
<tr><td class="ar">هَذِهِ</td><td>cette, ceci (féminin, proche)</td><td class="ar">هَذِهِ مَدْرَسَتُنَا — c'est notre école</td></tr>
<tr><td class="ar">هَذَانِ</td><td>ces deux… (masculin, duel)</td><td class="ar">هَذَانِ وَلَدَانِ — voici deux garçons</td></tr>
<tr><td class="ar">هَاتَانِ</td><td>ces deux… (féminin, duel)</td><td class="ar">هَاتَانِ بِنْتَانِ — voici deux filles</td></tr>
<tr><td class="ar">هَؤُلَاءِ</td><td>ceux-ci, ces gens (pluriel)</td><td class="ar">هَؤُلَاءِ أَصْدِقَائِي — voici mes amis</td></tr>
<tr><td class="ar">ذَلِكَ</td><td>cela (masculin, éloigné)</td><td class="ar">ذَلِكَ الْبَيْت — cette maison-là</td></tr>
<tr><td class="ar">تِلْكَ</td><td>cela (féminin, éloigné)</td><td class="ar">تِلْكَ الْمَدِينَة — cette ville-là</td></tr>
<tr><td class="ar">هُنَا / هُنَاكَ</td><td>ici / là-bas</td><td class="ar">جَدِّي يَسْكُنُ هُنَاكَ — mon grand-père habite là-bas</td></tr></table>
<p>Le duel des démonstratifs suit la même logique que celui des noms (leçon 4) : <span class="ar">هَذَانِ / هَاتَانِ</span> deviennent <span class="ar">هَذَيْنِ / هَاتَيْنِ</span> quand le groupe n'est pas sujet.</p>
<p>Attention à une distinction que le français ne fait pas apparaître : le démonstratif + nom <strong>défini</strong> forme un groupe (« cette maison » = <span class="ar">هَذَا الْبَيْت</span>), tandis que le démonstratif + nom <strong>indéfini</strong> forme une phrase complète (« ceci est une maison » = <span class="ar">هَذَا بَيْت</span>).</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">هَذَا الْكِتَاب</td><td>ce livre (groupe nominal)</td></tr>
<tr><td class="ar">هَذَا كِتَاب</td><td>ceci est un livre (phrase !)</td></tr>
<tr><td class="ar">هَذَا الْكِتَابُ جَدِيد</td><td>ce livre est nouveau (phrase complète)</td></tr></table>
<div class="gnote">Rappel de la leçon 3 en action : c'est encore la présence ou l'absence de <span class="ar">ال</span> qui fait basculer le sens. Ce petit article est le vrai chef d'orchestre de la phrase arabe.</div>
<div class="gex"><span class="ar">هَذِهِ الرِّسَالَةُ مِنْ خَالِي.</span> — Cette lettre vient de mon oncle maternel.<br><span class="ar">يَذْهَبُ جَدِّي إِلَى هَذَا الْمَقْهَى كُلَّ مَسَاءٍ.</span> — Mon grand-père va à ce café chaque soir.</div>`},

{ta:"الجملة الاسمية",tav:"الْجُمْلَةُ الِاسْمِيَّةُ",t:"La phrase nominale (pas de « être » au présent)",h:`
<p>C'est la règle la plus déroutante pour un francophone : au présent, l'arabe <strong>n'utilise aucun verbe « être »</strong>. Une phrase complète peut être composée de deux mots seulement : un sujet (appelé <span class="ar">الْمُبْتَدَأ</span>, « le point de départ ») et un attribut (<span class="ar">الْخَبَر</span>, « l'information »). On appelle cela la <strong>phrase nominale</strong> (<span class="ar">الْجُمْلَةُ الِاسْمِيَّةُ</span>), car elle commence par un nom. Retenez bien ces deux noms techniques — mubtada' et khabar — ils reviendront dans la leçon 13 : tous deux sont au cas <span class="ar">مَرْفُوع</span>.</p>
<div class="gex"><span class="ar">الْبَيْتُ كَبِيرٌ.</span> — La maison [est] grande.<br><span class="ar">الطَّقْسُ جَمِيلٌ.</span> — Le temps [est] beau.<br><span class="ar">أَبِي طَبِيبٌ.</span> — Mon père [est] médecin.</div>
<p>Remarquez le schéma typique : le sujet est <strong>défini</strong> (avec <span class="ar">ال</span> ou un possessif) et l'attribut est <strong>indéfini</strong>. C'est ce contraste qui permet de savoir où la phrase « se coupe » : <span class="ar">الْبَيْتُ كَبِير</span> = « la maison est grande », alors que <span class="ar">الْبَيْتُ الْكَبِير</span> (tout défini) n'est pas une phrase, c'est un groupe nominal : « la grande maison ».</p>
<p>Pour situer la phrase dans le <strong>passé</strong>, on introduit le verbe <span class="ar">كَانَ</span> (« était ») :</p>
<table class="gtable keepv"><tr><th>Arabe</th><th>Français</th></tr>
<tr><td class="ar">كَانَ</td><td>il était</td></tr>
<tr><td class="ar">كَانَتْ</td><td>elle était</td></tr>
<tr><td class="ar">كُنْتُ</td><td>j'étais</td></tr>
<tr><td class="ar">كُنْتَ / كُنْتِ</td><td>tu étais (m. / f.)</td></tr>
<tr><td class="ar">كَانَا / كَانَتَا</td><td>ils étaient / elles étaient (tous les deux — duel)</td></tr>
<tr><td class="ar">كُنَّا</td><td>nous étions</td></tr>
<tr><td class="ar">كَانُوا</td><td>ils étaient</td></tr></table>
<div class="gnote">Détail que vous verrez constamment dans les textes : après <span class="ar">كَانَ</span>, l'attribut prend la terminaison <em>-an</em> (écrite avec un alif) : <span class="ar">كَانَ الطَّقْسُ بَارِدًا</span> — le temps était froid ; <span class="ar">كُنْتُ مَرِيضًا</span> — j'étais malade. C'est pour cela que tant de mots des récits au passé se terminent par <span class="ar">ـا</span>. En termes techniques : le khabar de كان devient <span class="ar">مَنْصُوب</span> (leçon 13).</div>
<p>Pour <strong>nier</strong> une phrase nominale au présent, on utilise <span class="ar">لَيْسَ</span> (masculin) / <span class="ar">لَيْسَتْ</span> (féminin), qui se comportent comme un verbe : <span class="ar">الْبَيْتُ لَيْسَ بَعِيدًا</span> — la maison n'est pas loin ; <span class="ar">الْمَدِينَةُ لَيْسَتْ كَبِيرَةً</span> — la ville n'est pas grande.</p>`},

{ta:"الجملة الفعلية",tav:"الْجُمْلَةُ الْفِعْلِيَّةُ",t:"La phrase verbale : l'ordre verbe – sujet",h:`
<p>À côté de la phrase nominale, l'arabe possède un deuxième modèle de phrase : la <strong>phrase verbale</strong> (<span class="ar">الْجُمْلَةُ الْفِعْلِيَّةُ</span>), qui commence par un verbe. Et là, surprise : l'ordre de base n'est pas « sujet – verbe » comme en français, mais <strong>verbe – sujet – complément</strong>.</p>
<p>Chaque élément a un nom technique qu'il faut connaître : le verbe est le <span class="ar">فِعْل</span>, le sujet du verbe est le <span class="ar">فَاعِل</span> (« celui qui fait ») et le complément d'objet direct (COD) est le <span class="ar">مَفْعُول بِه</span> (« ce qui subit l'action »). La leçon 13 montrera que le فاعل est toujours <span class="ar">مَرْفُوع</span> et le مفعول به toujours <span class="ar">مَنْصُوب</span>.</p>
<div class="gex"><span class="ar">ذَهَبَ أَحْمَدُ إِلَى السُّوقِ.</span> — litt. « est-allé Ahmed au marché » = Ahmed est allé au marché.<br><span class="ar">كَتَبَتِ الْبِنْتُ رِسَالَةً.</span> — litt. « a-écrit la fille une lettre » = la fille a écrit une lettre.<br><span class="ar">وَصَلَ الْقِطَارُ فِي الظُّهْرِ.</span> — litt. « est-arrivé le train à midi ».</div>
<p>C'est extrêmement fréquent dans les récits : dès qu'une phrase commence par un verbe au passé (<span class="ar">ذَهَبَ، جَاءَ، قَالَ، وَصَلَ، جَلَسَ…</span>), attendez-vous à trouver le sujet <em>juste après</em>. Prenez l'habitude de lire ainsi : verbe → qui ? → quoi / où ?</p>
<p>Règle d'accord importante et contre-intuitive : quand le verbe est <strong>devant</strong> le sujet, il reste au <strong>singulier</strong>, même si le sujet est au duel ou au pluriel. Il s'accorde seulement en genre :</p>
<table class="gtable"><tr><th>Arabe</th><th>Analyse</th></tr>
<tr><td class="ar">ذَهَبَ الْأَوْلَادُ إِلَى الْمَدْرَسَةِ</td><td>verbe au singulier + sujet pluriel : « les enfants sont allés »</td></tr>
<tr><td class="ar">ذَهَبَ الْوَلَدَانِ إِلَى الْمَدْرَسَةِ</td><td>même règle avec un sujet au duel : « les deux garçons sont allés »</td></tr>
<tr><td class="ar">قَالَتْ أُمِّي</td><td>verbe au féminin car le sujet (أُمِّي) est féminin : « ma mère a dit »</td></tr>
<tr><td class="ar">جَاءَ الضُّيُوفُ وَأَكَلُوا مَعَنَا</td><td>1er verbe au singulier (avant le sujet), 2e verbe au pluriel (le sujet est déjà connu) : « les invités sont venus et ont mangé avec nous »</td></tr></table>
<div class="gnote">Les deux types de phrase coexistent partout, souvent avec une nuance : la phrase nominale (<span class="ar">أَحْمَدُ ذَهَبَ إِلَى السُّوقِ</span>) met l'accent sur <em>Ahmed</em> ; la phrase verbale (<span class="ar">ذَهَبَ أَحْمَدُ إِلَى السُّوقِ</span>) raconte simplement l'action. Les récits enchaînent les phrases verbales ; les descriptions préfèrent les phrases nominales. Repérez cette alternance dans les textes de l'app.</div>`},

{ta:"الفعل المضارع",tav:"الْفِعْلُ الْمُضَارِعُ",t:"Le présent : préfixes et terminaisons",h:`
<p>Le verbe arabe au présent (<span class="ar">الْمُضَارِع</span>) se conjugue surtout <strong>par l'avant</strong> : c'est un préfixe qui indique la personne. C'est l'inverse du français, qui conjugue par la fin. Le duel et certains pluriels ajoutent en plus une terminaison. Une fois ce tableau connu, vous identifiez la personne de n'importe quel verbe au premier coup d'œil :</p>
<table class="gtable"><tr><th>Personne</th><th>Forme</th><th>Exemple (écrire)</th><th>Sens</th></tr>
<tr><th colspan="4">Singulier</th></tr>
<tr><td>je</td><td class="ar">أ + ـــ</td><td class="ar">أَكْتُبُ</td><td>j'écris</td></tr>
<tr><td>tu (m.)</td><td class="ar">ت + ـــ</td><td class="ar">تَكْتُبُ</td><td>tu écris</td></tr>
<tr><td>tu (f.)</td><td class="ar">ت + ـِينَ</td><td class="ar">تَكْتُبِينَ</td><td>tu écris</td></tr>
<tr><td>il</td><td class="ar">ي + ـــ</td><td class="ar">يَكْتُبُ</td><td>il écrit</td></tr>
<tr><td>elle</td><td class="ar">ت + ـــ</td><td class="ar">تَكْتُبُ</td><td>elle écrit</td></tr>
<tr><th colspan="4">Duel (deux personnes)</th></tr>
<tr><td>vous deux</td><td class="ar">ت + ـَانِ</td><td class="ar">تَكْتُبَانِ</td><td>vous écrivez (à deux)</td></tr>
<tr><td>ils deux</td><td class="ar">ي + ـَانِ</td><td class="ar">يَكْتُبَانِ</td><td>ils écrivent (tous les deux)</td></tr>
<tr><td>elles deux</td><td class="ar">ت + ـَانِ</td><td class="ar">تَكْتُبَانِ</td><td>elles écrivent (toutes les deux)</td></tr>
<tr><th colspan="4">Pluriel (trois ou plus)</th></tr>
<tr><td>nous</td><td class="ar">ن + ـــ</td><td class="ar">نَكْتُبُ</td><td>nous écrivons</td></tr>
<tr><td>vous (m. pl.)</td><td class="ar">ت + ـُونَ</td><td class="ar">تَكْتُبُونَ</td><td>vous écrivez</td></tr>
<tr><td>vous (f. pl.)</td><td class="ar">ت + ـْنَ</td><td class="ar">تَكْتُبْنَ</td><td>vous écrivez (f.)</td></tr>
<tr><td>ils</td><td class="ar">ي + ـُونَ</td><td class="ar">يَكْتُبُونَ</td><td>ils écrivent</td></tr>
<tr><td>elles</td><td class="ar">ي + ـْنَ</td><td class="ar">يَكْتُبْنَ</td><td>elles écrivent</td></tr></table>
<div class="gnote">Deux pièges classiques. 1) <span class="ar">تَكْتُبُ</span> = « tu écris » (masculin) <em>ou</em> « elle écrit ». Même forme ! Seul le contexte tranche. 2) Au duel, <span class="ar">تَكْتُبَانِ</span> = « vous deux » <em>ou</em> « elles deux » : là encore, contexte. Retenez : <span class="ar">ـِينَ</span> = tu (f.), <span class="ar">ـَانِ</span> = duel, <span class="ar">ـُونَ</span> = pluriel masculin.</div>
<p>Le présent arabe couvre à la fois le présent simple et le présent progressif français : <span class="ar">أَدْرُسُ</span> = « j'étudie » ou « je suis en train d'étudier ». Il exprime aussi l'habitude : <span class="ar">أَسْتَيْقِظُ كُلَّ يَوْمٍ فِي السَّابِعَةِ</span> — je me réveille chaque jour à sept heures.</p>
<div class="gex"><span class="ar">أَبِي يَعْمَلُ فِي الْمُسْتَشْفَى وَأُمِّي تَعْمَلُ فِي الْمَدْرَسَةِ.</span> — Mon père travaille à l'hôpital et ma mère travaille à l'école.<br><span class="ar">الْأَطْفَالُ يَلْعَبُونَ فِي الْحَدِيقَةِ.</span> — Les enfants jouent dans le jardin.<br><span class="ar">الْوَلَدَانِ يَلْعَبَانِ فِي الْحَدِيقَةِ.</span> — Les deux garçons jouent dans le jardin.</div>`},

{ta:"الفعل الماضي",tav:"الْفِعْلُ الْمَاضِي",t:"Le passé : les suffixes",h:`
<p>Au passé (<span class="ar">الْمَاضِي</span>), c'est l'inverse du présent : la personne est indiquée par un <strong>suffixe</strong>. La forme « il a fait » est la plus simple — c'est le verbe nu, et c'est sous cette forme que les dictionnaires citent les verbes :</p>
<table class="gtable keepv"><tr><th>Personne</th><th>Suffixe</th><th>Exemple (aller)</th><th>Sens</th></tr>
<tr><th colspan="4">Singulier</th></tr>
<tr><td>il</td><td>—</td><td class="ar">ذَهَبَ</td><td>il est allé</td></tr>
<tr><td>elle</td><td class="ar">ـَتْ</td><td class="ar">ذَهَبَتْ</td><td>elle est allée</td></tr>
<tr><td>je</td><td class="ar">ـتُ</td><td class="ar">ذَهَبْتُ</td><td>je suis allé(e)</td></tr>
<tr><td>tu (m.)</td><td class="ar">ـتَ</td><td class="ar">ذَهَبْتَ</td><td>tu es allé</td></tr>
<tr><td>tu (f.)</td><td class="ar">ـتِ</td><td class="ar">ذَهَبْتِ</td><td>tu es allée</td></tr>
<tr><th colspan="4">Duel (deux personnes)</th></tr>
<tr><td>vous deux</td><td class="ar">ـتُمَا</td><td class="ar">ذَهَبْتُمَا</td><td>vous êtes allés (à deux)</td></tr>
<tr><td>ils deux</td><td class="ar">ـَا</td><td class="ar">ذَهَبَا</td><td>ils sont allés (tous les deux)</td></tr>
<tr><td>elles deux</td><td class="ar">ـَتَا</td><td class="ar">ذَهَبَتَا</td><td>elles sont allées (toutes les deux)</td></tr>
<tr><th colspan="4">Pluriel (trois ou plus)</th></tr>
<tr><td>nous</td><td class="ar">ـنَا</td><td class="ar">ذَهَبْنَا</td><td>nous sommes allés</td></tr>
<tr><td>vous (m. pl.)</td><td class="ar">ـتُمْ</td><td class="ar">ذَهَبْتُمْ</td><td>vous êtes allés</td></tr>
<tr><td>vous (f. pl.)</td><td class="ar">ـتُنَّ</td><td class="ar">ذَهَبْتُنَّ</td><td>vous êtes allées</td></tr>
<tr><td>ils</td><td class="ar">ـُوا</td><td class="ar">ذَهَبُوا</td><td>ils sont allés</td></tr>
<tr><td>elles</td><td class="ar">ـْنَ</td><td class="ar">ذَهَبْنَ</td><td>elles sont allées</td></tr></table>
<div class="gnote">Trois pièges de lecture. 1) Sans vocalisation, <span class="ar keepv">ذهبت</span> peut signifier « elle est allée » (<span class="ar keepv">ذَهَبَتْ</span>), « je suis allé » (<span class="ar keepv">ذَهَبْتُ</span>) ou « tu es allé(e) » (<span class="ar keepv">ذَهَبْتَ / ذَهَبْتِ</span>) — quatre lectures ! Le contexte décide ; le bouton ـَـّ de l'app vous montre la bonne voyelle. 2) Le <span class="ar">ـوا</span> de « ils » se termine par un alif muet qui ne se prononce pas : <span class="ar keepv">ذَهَبُوا</span> se lit <em>dhahabū</em>. 3) <span class="ar keepv">ذَهَبْنَا</span> (nous) et <span class="ar keepv">ذَهَبْنَ</span> (elles) ne diffèrent que par l'alif final : nous = <span class="ar">ـنا</span>, elles = <span class="ar">ـن</span>.</div>
<p>Le passé arabe correspond au passé composé français dans les récits : <span class="ar">أَكَلْنَا ثُمَّ خَرَجْنَا</span> — nous avons mangé puis nous sommes sortis. Combiné avec <span class="ar">كَانَ</span> + présent, il donne l'imparfait d'habitude : <span class="ar">كُنَّا نَذْهَبُ إِلَى الشَّاطِئِ كُلَّ صَبَاحٍ</span> — nous allions à la plage chaque matin.</p>
<div class="gex"><span class="ar">وَصَلْنَا إِلَى الْمَحَطَّةِ وَانْتَظَرْنَا الْقِطَارَ.</span> — Nous sommes arrivés à la gare et nous avons attendu le train.<br><span class="ar">دَخَلَ الطَّبِيبُ وَفَحَصَ الْمَرِيضَ.</span> — Le médecin est entré et a examiné le malade.<br><span class="ar">ذَهَبَا مَعًا إِلَى السُّوقِ.</span> — Ils sont allés (tous les deux) ensemble au marché.</div>`},

{ta:"المستقبل",tav:"الْمُسْتَقْبَلُ",t:"Le futur : سـ et سوف",h:`
<p>Le futur arabe est d'une simplicité remarquable : on prend le présent et on colle devant le préfixe <span class="ar">سَـ</span> (pour un futur proche ou neutre) ou le mot séparé <span class="ar">سَوْفَ</span> (plus formel, futur plus lointain). Aucune nouvelle conjugaison à apprendre — le duel et le pluriel de la leçon 9 restent valables tels quels : <span class="ar">سَيَكْتُبَانِ</span> — ils écriront (tous les deux).</p>
<table class="gtable"><tr><th>Présent</th><th>Futur</th><th>Sens</th></tr>
<tr><td class="ar">أَزُورُكَ</td><td class="ar">سَأَزُورُكَ</td><td>je te rendrai visite</td></tr>
<tr><td class="ar">نُسَافِرُ</td><td class="ar">سَنُسَافِرُ</td><td>nous voyagerons</td></tr>
<tr><td class="ar">تَصِلُ الرِّسَالَةُ</td><td class="ar">سَتَصِلُ الرِّسَالَةُ</td><td>la lettre arrivera</td></tr>
<tr><td class="ar">يَتَّصِلُ بِكُمْ</td><td class="ar">سَوْفَ يَتَّصِلُ بِكُمْ</td><td>il vous appellera</td></tr></table>
<div class="gnote">Réflexe de lecture : un verbe qui commence par <span class="ar">سأ، سن، ست، سي</span> est presque toujours un futur. Décollez mentalement le <span class="ar">سـ</span> et vous retrouvez le présent que vous connaissez. Le dictionnaire de l'app fait cette analyse pour vous quand vous touchez le mot.</div>
<div class="gex"><span class="ar">سَأَزُورُكَ فِي الْعُطْلَةِ الصَّيْفِيَّةِ.</span> — Je te rendrai visite pendant les vacances d'été.<br><span class="ar">قَالَتِ الْمُوَظَّفَةُ: الطَّائِرَةُ سَتُقْلِعُ بَعْدَ سَاعَتَيْنِ.</span> — L'employée a dit : l'avion décollera dans deux heures.</div>`},

{ta:"النفي",tav:"النَّفْيُ",t:"La négation : لا، ما، لم، لن، ليس",h:`
<p>Le français a un seul « ne… pas » ; l'arabe choisit son mot de négation <strong>selon le temps</strong> de la phrase. C'est un point d'examen classique, mais le système est logique :</p>
<table class="gtable keepv"><tr><th>Mot</th><th>S'emploie avec</th><th>Exemple</th><th>Sens</th></tr>
<tr><td class="ar">لَا</td><td>le présent</td><td class="ar">لَا أَذْهَبُ</td><td>je ne vais pas</td></tr>
<tr><td class="ar">مَا</td><td>le passé</td><td class="ar">مَا ذَهَبْتُ</td><td>je ne suis pas allé</td></tr>
<tr><td class="ar">لَمْ</td><td>le présent (sens passé !)</td><td class="ar">لَمْ أَذْهَبْ</td><td>je ne suis pas allé</td></tr>
<tr><td class="ar">لَنْ</td><td>le présent (sens futur)</td><td class="ar">لَنْ أَذْهَبَ</td><td>je n'irai pas</td></tr>
<tr><td class="ar">لَيْسَ / لَيْسَتْ</td><td>la phrase nominale</td><td class="ar">الْبَيْتُ لَيْسَ كَبِيرًا</td><td>la maison n'est pas grande</td></tr></table>
<div class="gnote">Le piège favori des examens : <span class="ar">لَمْ</span> + verbe au présent a un sens <strong>passé</strong>. <span class="ar">لَمْ تَأْتِ الْحَافِلَةُ</span> = « le bus n'est pas venu » (et non « ne vient pas »). De même <span class="ar">لَنْ</span> + présent = futur négatif. Regardez le mot de négation, pas la forme du verbe.</div>
<div class="gnote">Observez la fin des trois verbes du tableau (voyelles affichées en permanence ici) : <span class="ar keepv">لَا أَذْهَبُ</span> (ḍamma), <span class="ar keepv">لَمْ أَذْهَبْ</span> (sukūn), <span class="ar keepv">لَنْ أَذْهَبَ</span> (fatḥa). Ce n'est pas un hasard : <span class="ar">لَمْ</span> rend le verbe <span class="ar">مَجْزُوم</span> et <span class="ar">لَنْ</span> le rend <span class="ar">مَنْصُوب</span>. C'est exactement le système de l'iʿrāb, expliqué dans la leçon suivante (leçon 13).</div>
<p><span class="ar">لَا</span> sert aussi à l'<strong>interdiction</strong> quand il est suivi d'un verbe à la 2e personne : <span class="ar">لَا تَلْعَبْ فِي الشَّارِعِ!</span> — ne joue pas dans la rue ! Et il nie un nom de façon absolue : <span class="ar">لَا مُشْكِلَةَ</span> — pas de problème.</p>
<div class="gex"><span class="ar">فِي نِهَايَةِ الْأُسْبُوعِ لَا أَذْهَبُ إِلَى الْمَدْرَسَةِ.</span> — Le week-end, je ne vais pas à l'école.<br><span class="ar">فِي الْبِدَايَةِ لَمْ نَعْرِفْهُ.</span> — Au début, nous ne le connaissions pas.</div>`},

{ta:"الإعراب",tav:"الْإِعْرَابُ",t:"L'iʿrāb : les cas et les modes (مرفوع، منصوب، مجرور، مجزوم)",h:`
<p>Voici la leçon qui explique un mystère que vous avez peut-être remarqué : pourquoi la fin des mots arabes change-t-elle sans arrêt ? <span class="ar keepv">الْبَيْتُ، الْبَيْتَ، الْبَيْتِ</span> — même mot, trois petites voyelles finales différentes. Ce système s'appelle l'<strong>iʿrāb</strong> (<span class="ar">الْإِعْرَاب</span>) : la terminaison d'un mot indique sa <strong>fonction dans la phrase</strong>, exactement comme les cas du latin, de l'allemand ou du polonais. Il existe quatre statuts :</p>
<table class="gtable keepv"><tr><th>Statut</th><th>Terminaison</th><th>Nom international</th><th>Exemple</th></tr>
<tr><td class="ar">مَرْفُوع</td><td>ḍamma <span class="ar">ـُ</span> (son « ou »)</td><td>nominatif (nom) / indicatif (verbe)</td><td class="ar">الْبَيْتُ · يَكْتُبُ</td></tr>
<tr><td class="ar">مَنْصُوب</td><td>fatḥa <span class="ar">ـَ</span> (son « a »)</td><td>accusatif (nom) / subjonctif (verbe)</td><td class="ar">الْبَيْتَ · لَنْ يَكْتُبَ</td></tr>
<tr><td class="ar">مَجْرُور</td><td>kasra <span class="ar">ـِ</span> (son « i »)</td><td>génitif — noms seulement</td><td class="ar">فِي الْبَيْتِ</td></tr>
<tr><td class="ar">مَجْزُوم</td><td>sukūn <span class="ar">ـْ</span> (pas de voyelle)</td><td>jussif (apocopé) — verbes seulement</td><td class="ar">لَمْ يَكْتُبْ</td></tr></table>
<p>La question à se poser n'est donc jamais « quelle voyelle mettre ? » mais « <strong>quel rôle joue ce mot ?</strong> ». Chaque fonction grammaticale a son statut attitré :</p>
<table class="gtable keepv"><tr><th>Fonction</th><th>C'est-à-dire</th><th>Statut</th><th>Exemple</th></tr>
<tr><td class="ar">مُبْتَدَأ</td><td>sujet de la phrase nominale (leçon 7)</td><td class="ar">مَرْفُوع</td><td class="ar">الْبَيْتُ كَبِيرٌ</td></tr>
<tr><td class="ar">خَبَر</td><td>attribut de la phrase nominale</td><td class="ar">مَرْفُوع</td><td class="ar">الْبَيْتُ كَبِيرٌ</td></tr>
<tr><td class="ar">فَاعِل</td><td>sujet du verbe (leçon 8)</td><td class="ar">مَرْفُوع</td><td class="ar">ذَهَبَ أَحْمَدُ</td></tr>
<tr><td class="ar">مَفْعُول بِه</td><td>complément d'objet direct (COD)</td><td class="ar">مَنْصُوب</td><td class="ar">قَرَأْتُ الْكِتَابَ</td></tr>
<tr><td class="ar">اِسْم مَجْرُور</td><td>nom après une préposition (COI, leçon 15)</td><td class="ar">مَجْرُور</td><td class="ar">فِي الْبَيْتِ</td></tr>
<tr><td class="ar">فِعْل مُضَارِع</td><td>verbe au présent</td><td class="ar">مَرْفُوع (par défaut)</td><td class="ar">يَكْتُبُ</td></tr></table>
<p>Le verbe au <strong>présent</strong> est le seul à changer de statut : <span class="ar">مَرْفُوع</span> par défaut (<span class="ar keepv">يَكْتُبُ</span>), il devient <span class="ar">مَنْصُوب</span> après <span class="ar">أَنْ</span> ou <span class="ar">لَنْ</span> (<span class="ar keepv">لَنْ يَكْتُبَ</span>) et <span class="ar">مَجْزُوم</span> après <span class="ar">لَمْ</span> ou le <span class="ar">لَا</span> d'interdiction (<span class="ar keepv">لَمْ يَكْتُبْ</span>) — vous l'avez déjà vu dans la leçon 12 sur la négation.</p>
<p>Le <strong>passé</strong> (<span class="ar">الْفِعْل الْمَاضِي</span>) et l'<strong>impératif</strong> (<span class="ar">فِعْل الْأَمْر</span>), eux, ne changent jamais : on dit qu'ils sont <span class="ar">مَبْنِيّ</span> (invariables, « construits »). Leur terminaison est fixe : le passé se termine par une fatḥa (<span class="ar keepv">كَتَبَ</span> — comme un manṣūb) et l'impératif par un sukūn (<span class="ar keepv">اُكْتُبْ</span> — comme un majzūm). C'est sous cette forme simplifiée que beaucoup de cours les rangent dans le tableau : passé → fatḥa, impératif → sukūn.</p>
<p>Analysons une phrase complète, mot par mot :</p>
<div class="gex keepv"><span class="ar">يَكْتُبُ الطَّالِبُ الدَّرْسَ فِي الْبَيْتِ.</span> — L'étudiant écrit la leçon à la maison.</div>
<table class="gtable keepv"><tr><th>Mot</th><th>Fonction</th><th>Statut</th><th>Marque</th></tr>
<tr><td class="ar">يَكْتُبُ</td><td>verbe au présent (فعل مضارع)</td><td class="ar">مَرْفُوع</td><td>ḍamma finale</td></tr>
<tr><td class="ar">الطَّالِبُ</td><td>sujet (فَاعِل)</td><td class="ar">مَرْفُوع</td><td>ḍamma finale</td></tr>
<tr><td class="ar">الدَّرْسَ</td><td>COD (مَفْعُول بِه)</td><td class="ar">مَنْصُوب</td><td>fatḥa finale</td></tr>
<tr><td class="ar">الْبَيْتِ</td><td>nom après في (اِسْم مَجْرُور)</td><td class="ar">مَجْرُور</td><td>kasra finale</td></tr></table>
<div class="gnote">Sur un nom <strong>indéfini</strong>, la voyelle finale se double : c'est le <strong>tanwīn</strong>, prononcé avec un « n » : <span class="ar keepv">كِتَابٌ</span> (kitābun, marfūʿ), <span class="ar keepv">كِتَابًا</span> (kitāban, manṣūb — écrit avec un alif), <span class="ar keepv">كِتَابٍ</span> (kitābin, majrūr). Vous comprenez maintenant le <span class="ar keepv">ـًا</span> de <span class="ar keepv">كَانَ الطَّقْسُ بَارِدًا</span> (leçon 7) : le khabar de كان est manṣūb !</div>
<div class="gnote">Et le duel et le pluriel sain ? Ils marquent l'iʿrāb avec des <strong>lettres</strong> au lieu de voyelles (leçon 4) : duel <span class="ar">ـَانِ</span> (marfūʿ) / <span class="ar">ـَيْنِ</span> (manṣūb et majrūr) ; pluriel masculin <span class="ar">ـُونَ</span> (marfūʿ) / <span class="ar">ـِينَ</span> (manṣūb et majrūr). D'où <span class="ar keepv">جَاءَ الْمُعَلِّمُونَ</span> mais <span class="ar keepv">رَأَيْتُ الْمُعَلِّمِينَ</span>.</div>
<div class="gnote">À l'oral courant, ces voyelles finales sont le plus souvent passées sous silence (on s'arrête sur un sukūn). Mais elles sont indispensables pour lire l'arabe vocalisé, comprendre le Coran et la littérature, et réussir les examens de grammaire. Dans cette leçon, les voyelles restent affichées en permanence : elles sont le sujet même du cours.</div>`},

{ta:"الإضافة",tav:"الْإِضَافَةُ",t:"L'iḍāfa : dire « de » sans préposition",h:`
<p>Comment dire « la maison de mon grand-père » ? Le français utilise « de ». L'arabe, lui, colle simplement les deux noms l'un derrière l'autre : <span class="ar">بَيْتُ جَدِّي</span>, littéralement « maison mon-grand-père ». Cette construction s'appelle l'<strong>iḍāfa</strong> (<span class="ar">الْإِضَافَة</span>, « l'annexion ») et c'est probablement la structure la plus fréquente de tout l'arabe écrit.</p>
<table class="gtable"><tr><th>Arabe</th><th>Littéralement</th><th>Sens</th></tr>
<tr><td class="ar">غُرْفَةُ الْجُلُوسِ</td><td>pièce le-fait-de-s'asseoir</td><td>le salon</td></tr>
<tr><td class="ar">كُرَةُ الْقَدَمِ</td><td>balle le-pied</td><td>le football</td></tr>
<tr><td class="ar">بَابُ الْبَيْتِ</td><td>porte la-maison</td><td>la porte de la maison</td></tr>
<tr><td class="ar">مَدِينَةٌ كَبِيرَةٌ</td><td>—</td><td>⚠ ceci n'est PAS une iḍāfa : c'est nom + adjectif</td></tr></table>
<p>Trois règles de forme à connaître :</p>
<p>1) Le <strong>premier</strong> nom ne porte <strong>jamais</strong> <span class="ar">ال</span>, même si l'ensemble est défini. « La porte de la maison » = <span class="ar">بَابُ الْبَيْتِ</span>, jamais <span class="ar">الْبَابُ الْبَيْتُ</span>. C'est le deuxième nom qui porte la définition pour tout le groupe.</p>
<p>2) Si le premier nom se termine par <span class="ar">ة</span>, ce <span class="ar">ة</span> se prononce <em>t</em> : <span class="ar">غُرْفَةُ الْجُلُوسِ</span> se lit <em>ghurfat al-julūs</em>. (À l'écrit, rien ne change.)</p>
<p>3) Le <strong>deuxième</strong> nom est toujours <span class="ar">مَجْرُور</span> (kasra finale, leçon 13) : <span class="ar keepv">بَابُ الْبَيْتِ</span>. Le premier nom, lui, prend le cas exigé par sa fonction dans la phrase.</p>
<div class="gnote">Comment distinguer une iḍāfa d'un nom + adjectif ? L'iḍāfa relie deux <strong>noms</strong> (maison + grand-père) ; le second répond à la question « de qui / de quoi ? ». Le nom + adjectif répond à « comment ? ». Comparez : <span class="ar">مُعَلِّمَةُ اللُّغَةِ الْعَرَبِيَّةِ</span> — « l'enseignante de la langue arabe » (iḍāfa puis adjectif) et remarquez que les possessifs de la leçon 5 sont en réalité des mini-iḍāfa : <span class="ar">بَيْتِي</span> = maison-de-moi.</div>
<div class="gex"><span class="ar">ذَهَبْنَا إِلَى مَحَطَّةِ الْقِطَارِ.</span> — Nous sommes allés à la gare (litt. station du train).<br><span class="ar">صَاحِبُ الدُّكَّانِ رَجُلٌ طَيِّبٌ.</span> — Le propriétaire de la boutique est un homme gentil.</div>`},

{ta:"حروف الجر",tav:"حُرُوفُ الْجَرِّ",t:"Les prépositions (et comment dire « avoir »)",h:`
<p>Les prépositions arabes (<span class="ar">حُرُوف الْجَرّ</span>) sont courtes, très fréquentes, et certaines se collent au mot suivant. Leur nom arabe dit tout : ce sont les « lettres qui tirent » — elles tirent le nom qui les suit vers le cas <span class="ar">مَجْرُور</span> (kasra finale, leçon 13) : <span class="ar keepv">فِي الْبَيْتِ</span>. Les voici classées :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">فِي</td><td>dans, à</td><td class="ar">فِي الْبَيْتِ — à la maison</td></tr>
<tr><td class="ar">إِلَى</td><td>vers, à (direction)</td><td class="ar">إِلَى الْمَدْرَسَةِ — à l'école</td></tr>
<tr><td class="ar">مِنْ</td><td>de, depuis</td><td class="ar">مِنَ الصَّبَاحِ — depuis le matin</td></tr>
<tr><td class="ar">عَلَى</td><td>sur</td><td class="ar">عَلَى الْمَكْتَبِ — sur le bureau</td></tr>
<tr><td class="ar">مَعَ</td><td>avec</td><td class="ar">مَعَ أَصْدِقَائِي — avec mes amis</td></tr>
<tr><td class="ar">بِـ (collée)</td><td>par, avec, en</td><td class="ar">بِالْحَافِلَةِ — en bus</td></tr>
<tr><td class="ar">لِـ (collée)</td><td>pour, à (appartenance)</td><td class="ar">لِي — pour moi / j'ai</td></tr>
<tr><td class="ar">عِنْدَ</td><td>chez, auprès de</td><td class="ar">عِنْدَ جَدَّتِي — chez ma grand-mère</td></tr>
<tr><td class="ar">قَبْلَ / بَعْدَ</td><td>avant / après</td><td class="ar">بَعْدَ الظُّهْرِ — après midi</td></tr>
<tr><td class="ar">تَحْتَ / فَوْقَ / أَمَامَ / وَرَاءَ / بَيْنَ</td><td>sous / au-dessus / devant / derrière / entre</td><td class="ar">تَحْتَ الشَّجَرَةِ — sous l'arbre</td></tr></table>
<p>Point capital : l'arabe n'a <strong>pas de verbe « avoir »</strong>. On le remplace par une préposition + possesseur, en tête de phrase :</p>
<table class="gtable"><tr><th>Arabe</th><th>Littéralement</th><th>Sens</th></tr>
<tr><td class="ar">عِنْدِي أَخٌ صَغِيرٌ</td><td>chez-moi un petit frère</td><td>j'ai un petit frère</td></tr>
<tr><td class="ar">عِنْدَ جَدِّي بَقَرَةٌ</td><td>chez mon grand-père une vache</td><td>mon grand-père a une vache</td></tr>
<tr><td class="ar">لَهُ أُخْتَانِ</td><td>à-lui deux sœurs</td><td>il a deux sœurs (remarquez le duel !)</td></tr></table>
<div class="gnote">Réflexe de lecture : une phrase qui commence par <span class="ar">عِنْدَ + possessif</span> ou <span class="ar">لِـ + pronom</span> se traduit presque toujours par « avoir ». Et rappelez-vous (leçon 5) que les prépositions acceptent les suffixes : <span class="ar">مَعَهُ، فِيهَا، إِلَيْكَ، بِكُمْ…</span></div>
<div class="gex"><span class="ar">عِنْدَنَا فِي الْبَيْتِ قِطَّةٌ صَغِيرَةٌ.</span> — Nous avons à la maison une petite chatte.<br><span class="ar">جَلَسْتُ عَلَى كُرْسِيٍّ تَحْتَ شَجَرَةٍ.</span> — Je me suis assis sur une chaise sous un arbre.</div>`},

{ta:"أدوات الاستفهام",tav:"أَدَوَاتُ الِاسْتِفْهَامِ",t:"Les mots interrogatifs",h:`
<p>Poser une question en arabe est simple : le mot interrogatif se place en tête de phrase et <strong>l'ordre des mots ne change pas</strong> — pas d'inversion comme en français. <span class="ar">أَيْنَ تَسْكُنُ؟</span> = « où habites-tu ? », littéralement « où tu-habites ? ».</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">مَا / مَاذَا</td><td>que, quoi (ماذا devant un verbe)</td><td class="ar">مَاذَا تَشْعُرُ؟ — que ressens-tu ?</td></tr>
<tr><td class="ar">مَنْ</td><td>qui</td><td class="ar">مَنْ هَذَا؟ — qui est-ce ?</td></tr>
<tr><td class="ar">أَيْنَ</td><td>où</td><td class="ar">إِلَى أَيْنَ؟ — vers où ?</td></tr>
<tr><td class="ar">مَتَى</td><td>quand</td><td class="ar">مَتَى يَصِلُ الْقِطَارُ؟ — quand arrive le train ?</td></tr>
<tr><td class="ar">كَيْفَ</td><td>comment</td><td class="ar">كَيْفَ حَالُكَ؟ — comment vas-tu ?</td></tr>
<tr><td class="ar">كَمْ</td><td>combien</td><td class="ar">كَمْ عُمْرُكَ؟ — quel âge as-tu ?</td></tr>
<tr><td class="ar">لِمَاذَا</td><td>pourquoi</td><td class="ar">لِمَاذَا تَبْكِي؟ — pourquoi pleures-tu ?</td></tr>
<tr><td class="ar">هَلْ</td><td>est-ce que</td><td class="ar">هَلْ أَنْتَ مَرِيضٌ؟ — es-tu malade ?</td></tr></table>
<div class="gnote">Deux détails. 1) <span class="ar">هَلْ</span> transforme n'importe quelle affirmation en question oui/non, exactement comme « est-ce que » : <span class="ar">هَلْ تُحِبُّ الشَّايَ؟</span>. 2) Attention aux jumeaux : <span class="ar keepv">مَنْ</span> (man, qui) et <span class="ar keepv">مِنْ</span> (min, de/depuis) s'écrivent pareil sans vocalisation ! En tête de question c'est « qui », au milieu d'une phrase c'est en général « de ».</div>
<div class="gex"><span class="ar">سَأَلْنَا السَّائِقَ: إِلَى أَيْنَ؟</span> — Le chauffeur nous a demandé : vers où ?<br><span class="ar">كَمِ السَّاعَةُ الْآنَ؟</span> — Quelle heure est-il maintenant ?</div>`},

{ta:"التفضيل",tav:"التَّفْضِيلُ",t:"Le comparatif et le superlatif : أفعل",h:`
<p>Pour comparer, l'arabe coule l'adjectif dans un moule unique : le schème <span class="ar">أَفْعَل</span> (une hamza devant, les voyelles réarrangées). Pas de « plus » séparé comme en français — le mot lui-même change de forme :</p>
<table class="gtable"><tr><th>Adjectif</th><th>Comparatif</th><th>Sens</th></tr>
<tr><td class="ar">كَبِير</td><td class="ar">أَكْبَر</td><td>plus grand</td></tr>
<tr><td class="ar">صَغِير</td><td class="ar">أَصْغَر</td><td>plus petit</td></tr>
<tr><td class="ar">جَمِيل</td><td class="ar">أَجْمَل</td><td>plus beau</td></tr>
<tr><td class="ar">حَسَن (bon)</td><td class="ar">أَحْسَن</td><td>meilleur</td></tr>
<tr><td class="ar">قَرِيب</td><td class="ar">أَقْرَب</td><td>plus proche</td></tr></table>
<p>Le « que » de comparaison se dit <span class="ar">مِنْ</span> : <span class="ar">أَخِي أَكْبَرُ مِنِّي</span> — mon frère est plus grand que moi. La forme ne change ni au féminin ni au pluriel : <span class="ar">أُخْتِي أَصْغَرُ مِنْ أَخِي</span>.</p>
<p>Le <strong>superlatif</strong> (« le plus… ») utilise le même mot, suivi directement d'un nom en iḍāfa (leçon 14) :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">أَجْمَلُ فُصُولِ السَّنَةِ</td><td>la plus belle saison de l'année</td></tr>
<tr><td class="ar">أَحْسَنُ طَعَامٍ فِي الْعَالَمِ</td><td>la meilleure nourriture du monde</td></tr>
<tr><td class="ar">أَكْبَرُ مَدِينَةٍ</td><td>la plus grande ville</td></tr></table>
<div class="gnote">Attention aux faux amis internes : <span class="ar">أَحْمَر</span> (rouge), <span class="ar">أَبْيَض</span> (blanc) et les autres couleurs (leçon 2) ont la même silhouette <span class="ar">أَفْعَل</span> mais ne sont pas des comparatifs ! Si le mot désigne une couleur ou un défaut physique, ce n'est pas « plus… ». Le contexte et le vocabulaire font la différence.</div>
<div class="gex"><span class="ar">قِرَاءَتُكَ أَحْسَنُ مِنْ قَبْلُ.</span> — Ta lecture est meilleure qu'avant.<br><span class="ar">الرَّبِيعُ هُوَ أَجْمَلُ فُصُولِ السَّنَةِ.</span> — Le printemps est la plus belle saison de l'année.</div>`},

{ta:"الأرقام والساعة",tav:"الْأَرْقَامُ وَالسَّاعَةُ",t:"Les nombres et l'heure",h:`
<p>Voici les nombres de 1 à 12, la base indispensable pour lire les prix, les âges et l'heure :</p>
<table class="gtable"><tr><th>Chiffre</th><th>Arabe</th><th></th><th>Chiffre</th><th>Arabe</th></tr>
<tr><td>1</td><td class="ar">وَاحِد</td><td></td><td>7</td><td class="ar">سَبْعَة</td></tr>
<tr><td>2</td><td class="ar">اِثْنَانِ</td><td></td><td>8</td><td class="ar">ثَمَانِيَة</td></tr>
<tr><td>3</td><td class="ar">ثَلَاثَة</td><td></td><td>9</td><td class="ar">تِسْعَة</td></tr>
<tr><td>4</td><td class="ar">أَرْبَعَة</td><td></td><td>10</td><td class="ar">عَشَرَة</td></tr>
<tr><td>5</td><td class="ar">خَمْسَة</td><td></td><td>11</td><td class="ar">أَحَدَ عَشَرَ</td></tr>
<tr><td>6</td><td class="ar">سِتَّة</td><td></td><td>12</td><td class="ar">اِثْنَا عَشَرَ</td></tr></table>
<p>Pour <strong>deux</strong>, l'arabe n'utilise presque jamais le chiffre : c'est le <strong>duel</strong> de la leçon 4 qui s'en charge. <span class="ar">تَذْكِرَتَانِ</span> — deux billets, <span class="ar">سَاعَتَانِ</span> — deux heures, <span class="ar">أُخْتَانِ</span> — deux sœurs. Si vous voyez la terminaison <span class="ar">ـان / ـين</span>, pensez « deux » avant de penser « pluriel ».</p>
<p>L'<strong>heure</strong> utilise l'adjectif ordinal féminin (car <span class="ar">السَّاعَة</span>, l'heure, est féminine) : littéralement « l'heure la troisième » :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">السَّاعَةُ الْوَاحِدَةُ</td><td>une heure</td></tr>
<tr><td class="ar">السَّاعَةُ الثَّالِثَةُ</td><td>trois heures</td></tr>
<tr><td class="ar">السَّاعَةُ السَّابِعَةُ صَبَاحًا</td><td>sept heures du matin</td></tr>
<tr><td class="ar">السَّاعَةُ الثَّامِنَةُ وَالنِّصْفُ</td><td>huit heures et demie</td></tr>
<tr><td class="ar">فِي السَّاعَةِ الْعَاشِرَةِ</td><td>à dix heures</td></tr></table>
<div class="gnote">C'est pour cela que les textes disent <span class="ar">أَسْتَيْقِظُ فِي السَّاعَةِ السَّابِعَةِ</span> : « la septième heure », pas « sept heures ». Les ordinaux (سَابِع → السَّابِعَة) ressemblent beaucoup aux cardinaux (سَبْعَة) : mêmes racines, voyelles différentes.</div>
<div class="gex"><span class="ar">أَخْرُجُ مِنَ الْبَيْتِ فِي السَّاعَةِ الثَّامِنَةِ.</span> — Je sors de la maison à huit heures.<br><span class="ar">اِشْتَرَى أَبِي تَذْكِرَتَيْنِ.</span> — Mon père a acheté deux billets (duel COD → ـتَيْنِ, leçon 13).</div>`},

{ta:"الجذر والوزن",tav:"الْجَذْرُ وَالْوَزْنُ",t:"La racine et les schèmes : le secret du vocabulaire",h:`
<p>Voici la leçon qui rend tout le reste plus facile. Presque chaque mot arabe est construit sur une <strong>racine de trois consonnes</strong> qui porte une idée générale, coulée dans un <strong>schème</strong> (un moule de voyelles et de lettres ajoutées) qui précise le sens. Prenons la racine <span class="ar">ك ت ب</span>, l'idée d'« écrire » :</p>
<table class="gtable"><tr><th>Mot</th><th>Sens</th><th>Rôle du schème</th></tr>
<tr><td class="ar">كَتَبَ</td><td>il a écrit</td><td>le verbe nu</td></tr>
<tr><td class="ar">كَاتِب</td><td>écrivain</td><td>celui qui fait l'action</td></tr>
<tr><td class="ar">مَكْتُوب</td><td>écrit (chose écrite)</td><td>ce qui subit l'action</td></tr>
<tr><td class="ar">كِتَاب</td><td>livre</td><td>l'objet du domaine</td></tr>
<tr><td class="ar">مَكْتَب</td><td>bureau</td><td>le lieu (schème مَفْعَل)</td></tr>
<tr><td class="ar">مَكْتَبَة</td><td>bibliothèque, librairie</td><td>le lieu, version féminine</td></tr></table>
<p>Les schèmes se reconnaissent vite. Deux exemples très rentables :</p>
<p>• <span class="ar">مَـ + racine</span> = souvent un <strong>lieu</strong> ou un <strong>outil</strong> : <span class="ar">مَدْرَسَة</span> (lieu où l'on étudie, racine درس), <span class="ar">مَطْبَخ</span> (lieu où l'on cuisine, racine طبخ), <span class="ar">مَلْعَب</span> (lieu où l'on joue, racine لعب), <span class="ar">مِفْتَاح</span> (outil pour ouvrir, racine فتح).</p>
<p>• <span class="ar">فَاعِل</span> (voyelle ā après la 1re consonne) = <strong>celui qui fait</strong> : <span class="ar">طَالِب</span> (celui qui demande [le savoir] = étudiant), <span class="ar">سَائِق</span> (celui qui conduit), <span class="ar">عَامِل</span> (celui qui travaille = ouvrier). Vous avez déjà croisé ce schème sous son nom technique : le <span class="ar">فَاعِل</span> de la leçon 8, « celui qui fait » l'action du verbe.</p>
<div class="gnote">Application pratique : devant un mot inconnu, isolez mentalement les trois consonnes de la racine (ignorez ال، مـ، ـة، les longues voyelles ajoutées). Si vous connaissez un mot de la même famille, vous devinez le sens. <span class="ar">مَطْعَم</span> ? Racine طعم comme <span class="ar">طَعَام</span> (nourriture) + schème de lieu = « lieu de la nourriture » = restaurant. C'est exactement l'analyse que fait le dictionnaire de l'app quand vous touchez un mot.</div>
<div class="gex"><span class="ar">دَرَسَ ← مَدْرَسَة ← مُدَرِّس</span> — étudier → école → instituteur.<br><span class="ar">سَبَحَ ← مَسْبَح ← سِبَاحَة</span> — nager → piscine → natation.</div>`}
];

/* ================= utilitaires ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const norm=s=>s.replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[،.؟!:«»"()؛\-…]/g,'');
/* ---- affichage universel des voyelles : le contenu (leçons incluses) est écrit
   entièrement vocalisé ; quand le mode voyelles est désactivé, on retire les
   harakāt de tout le texte affiché, sauf dans les éléments .keepv où les
   voyelles sont le sujet même de la leçon (pronoms, iʿrāb, suffixes du passé…). */
const HARAKAT_RE=/[\u064B-\u0652\u0670]/;
function stripHarakat(s){return s.replace(/[\u064B-\u0652\u0670]/g,'');}
function applyVocalDOM(root){
  if(vocalOn)return;
  root=root||app;if(!root)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const list=[];let n;
  while(n=tw.nextNode()){
    if(!HARAKAT_RE.test(n.nodeValue))continue;
    let e=n.parentElement,keep=false;
    while(e&&e!==root.parentElement){if(e.classList&&e.classList.contains('keepv')){keep=true;break;}e=e.parentElement;}
    if(!keep)list.push(n);
  }
  list.forEach(x=>{x.nodeValue=stripHarakat(x.nodeValue);});
}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k,d){try{const v=localStorage.getItem('qiraa_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('qiraa_'+k,JSON.stringify(v));}catch(e){}}};

/* index inversé des pluriels : forme plurielle -> clé du singulier */
const PLIDX={};
for(const k in DICT){const e=DICT[k];if(e[2]==='Pluriel'&&e[3]){const p=norm(e[3].split('—')[0].split('/')[0].trim());if(p&&!DICT[p])PLIDX[p]=k;}}

/* table norm -> forme vocalisée, construite depuis VOCAL */
const VMAP={};
if(typeof VOCAL!=='undefined'){
  for(const id in VOCAL){const v=VOCAL[id];
    [v.ta,...v.p,...v.tf].join(' ').split(/\s+/).forEach(tk=>{const n=norm(tk);if(n&&!VMAP[n])VMAP[n]=tk.replace(/[،.؟!:«»"()؛…]/g,'');});
  }
}
function viz(w){return vocalOn&&VMAP[norm(w)]?VMAP[norm(w)]:w;}

/* ================= lookup morphologique =================
   renvoie {key, e, notes[]} ou null */
function hitKey(w){if(DICT[w])return{key:w,e:DICT[w],pl:false};if(PLIDX[w])return{key:PLIDX[w],e:DICT[PLIDX[w]],pl:true,plForm:w};return null;}
function morphHit(t,notes){
  let h=hitKey(t);if(h)return h;
  if(t.endsWith('ة')&&t.length>3&&(h=hitKey(t.slice(0,-1)))){notes.push('ـة : forme féminine');return h;}
  if(t.endsWith('ا')&&t.length>3&&(h=hitKey(t.slice(0,-1)))){notes.push('ـًا : terminaison -an (tanwīn, complément)');return h;}
  for(const d of ['تان','تين'])if(t.endsWith(d)&&t.length>4&&(h=hitKey(t.slice(0,-3))||hitKey(t.slice(0,-3)+'ة'))){notes.push('ـ'+d+' : duel féminin (deux)');return h;}
  for(const d of ['ان','ين'])if(t.endsWith(d)&&t.length>4&&(h=hitKey(t.slice(0,-2)))){notes.push('ـ'+d+' : duel (deux)');return h;}
  if(t.endsWith('ون')&&t.length>4&&/^[يتن]/.test(t)&&(h=hitKey(t.slice(0,-2)))){notes.push('ـون : pluriel « ils / vous » (présent)');return h;}
  if(t.endsWith('وا')&&t.length>4&&(h=hitKey(t.slice(0,-2)))){notes.push('ـوا : pluriel « ils » (passé) ou impératif pluriel');return h;}
  return null;
}
const SUF=[['هما','eux deux / elles deux'],['كما','vous deux'],['هن','elles / leur (f.)'],['كن','vous (f.)'],['ها','elle / sa, son (à elle)'],['هم','ils / leur'],['كم','vous / votre'],['نا','nous / notre'],['ني','me / moi'],['ه','lui / son, sa (à lui)'],['ك','toi / ton, ta'],['ي','moi / mon, ma']];
function lookup(raw){
  const w=norm(raw);if(!w)return null;
  const stems=[[w,[]]];
  if(/^[وف]/.test(w)&&w.length>2)stems.push([w.slice(1),[w[0]==='و'?'وـ : « et »':'فـ : « alors, donc »']]);
  for(const [y,n] of stems.slice()){
    if(/^س[يأنت]/.test(y)&&y.length>3)stems.push([y.slice(1),[...n,'سـ : marque du futur']]);
    if(y.startsWith('لل')&&y.length>3){stems.push(['ال'+y.slice(2),[...n,'لـ : « pour, à » + ال']]);stems.push([y.slice(2),[...n,'للـ : « pour le/la » (لـ + ال)']]);stems.push([y.slice(1),[...n,'لـ : « pour, à »']]);}
    else if(y.startsWith('ال')&&y.length>3)stems.push([y.slice(2),[...n,'الـ : article défini « le / la »']]);
    else if(/^[بلك]/.test(y)&&y.length>2){
      const pn=y[0]==='ب'?'بـ : « par, avec, en »':y[0]==='ل'?'لـ : « pour, à »':'كـ : « comme »';
      const z=y.slice(1);stems.push([z,[...n,pn]]);
      if(z.startsWith('ال')&&z.length>3)stems.push([z.slice(2),[...n,pn+' + الـ (article)']]);
    }
  }
  for(const [t,n] of stems){const extra=[];const h=morphHit(t,extra);if(h)return fin(h,[...n,...extra]);}
  for(const [t,n] of stems){
    for(const [s,sens] of SUF){
      if(t.endsWith(s)&&t.length-s.length>=2){
        let base=t.slice(0,t.length-s.length);
        const cand=[base,base+'ة'];
        if(base.endsWith('ت'))cand.push(base.slice(0,-1)+'ة');
        if(base.endsWith('ئ'))cand.push(base.slice(0,-1)+'ء');
        if(base.endsWith('ائ'))cand.push(base.slice(0,-2)+'اء');
        if(base.endsWith('ا'))cand.push(base.slice(0,-1)+'ى');
        for(const c of cand){const extra=[];const h=morphHit(c,extra);if(h)return fin(h,[...n,'ـ'+s+' : suffixe « '+sens+' »',...extra]);}
      }
    }
  }
  return null;
}
function fin(h,notes){if(h.pl)notes.unshift('Forme plurielle — voir le singulier ci-dessous');return{key:h.key,e:h.e,notes,pl:h.pl,plForm:h.plForm};}

/* ---------- construction des 5 exercices ---------- */
function frOf(w){const r=lookup(w);return r?r.e[0].split('/')[0].split('·')[0].trim():w;}
function vf(w){return (typeof VMAP!=='undefined'&&VMAP[norm(w)])||w;} /* forme vocalisée, indépendante du mode */
function dv(plain,voc){return vocalOn&&voc?voc:plain;} /* choix d'affichage selon le mode */
function splitSents(p){return p.split(/([^.؟!]+[.؟!]?)/).filter(x=>x.trim()).map(x=>x.trim());}
function buildExercises(t){
  const VP=(typeof VOCAL!=='undefined'&&VOCAL[t.id])||null;
  const vocab=t.v.map(w=>({ar:w,arv:vf(w),fr:frOf(w)}));
  const pool=[];TEXTS.forEach(x=>{if(x.id!==t.id)x.v.forEach(w=>pool.push(w));});
  /* ex1 : QCM ar→fr */
  const q1=shuffle(vocab).slice(0,5).map(v=>{
    const wrong=shuffle(pool.filter(w=>frOf(w)!==v.fr)).slice(0,2).map(frOf);
    return{ar:v.ar,arv:v.arv,opts:shuffle([{t:v.fr,ok:true},...wrong.map(w=>({t:w,ok:false}))])};
  });
  /* ex2 : association — ordres tirés une seule fois */
  const pairs=shuffle(vocab).slice(0,6);
  const mL=shuffle(pairs.map((p,i)=>i)),mR=shuffle(pairs.map((p,i)=>i));
  /* ex3 : trous — phrases plate/vocalisée alignées token par token */
  const sentPairs=[];
  t.p.forEach((p,pi)=>{
    const a=splitSents(p),b=VP?splitSents(VP.p[pi]):a;
    a.forEach((x,si)=>sentPairs.push([x,b[si]||x]));
  });
  const holes=[];
  for(const v of shuffle(vocab)){
    if(holes.length>=5)break;
    for(const [sent,sentv] of sentPairs){
      const toks=sent.split(/\s+/),toksv=sentv.split(/\s+/);
      const idx=toks.findIndex(tk=>{const n=norm(tk),a=v.ar;return n===a||n==='ال'+a||n===a+'ة'||n===a+'ا'||n==='و'+a||n==='وال'+a||n==='بال'+a||n==='لل'+a.slice(a.startsWith('ا')?1:0);});
      if(idx>=0&&toks.length>=4){
        const wrong=shuffle(vocab.filter(x=>x.ar!==v.ar)).slice(0,2);
        holes.push({sent:toks.map((tk,i)=>i===idx?'____':tk).join(' '),sentv:toksv.map((tk,i)=>i===idx?'____':tk).join(' '),
          opts:shuffle([{t:toks[idx],tv:toksv[idx]||toks[idx],ok:true},...wrong.map(w=>({t:w.ar,tv:w.arv,ok:false}))])});
        break;
      }
    }
  }
  if(holes.length<5){
    const STOP=new Set(['في','من','على','إلى','مع','عن','أن','إن','لا','ما','لم','لن','هل','ثم','أو','كل','هذا','هذه','ذلك','هو','هي','هم','أنا','نحن','كان','كانت','عند','بعد','قبل','لأن','لكن','اسمه','اسمها','اسمي']);
    const used=new Set(holes.map(h=>norm(h.opts.find(o=>o.ok).t)));
    for(const [sent,sentv] of shuffle(sentPairs)){
      if(holes.length>=5)break;
      const toks=sent.split(/\s+/),toksv=sentv.split(/\s+/);if(toks.length<4)continue;
      const cands=toks.map((tk,i)=>({tk,i,n:norm(tk)})).filter(x=>x.n.length>=4&&!STOP.has(x.n)&&!used.has(x.n)&&lookup(x.tk));
      if(!cands.length)continue;
      const c=cands[Math.floor(Math.random()*cands.length)];used.add(c.n);
      const others=shuffle([...new Set(t.p.join(' ').split(/\s+/).map(norm))].filter(n=>n.length>=3&&n!==c.n&&!STOP.has(n))).slice(0,2);
      holes.push({sent:toks.map((tk,i)=>i===c.i?'____':tk).join(' '),sentv:toksv.map((tk,i)=>i===c.i?'____':tk).join(' '),
        opts:shuffle([{t:c.tk,tv:toksv[c.i]||c.tk,ok:true},...others.map(w=>({t:w,tv:vf(w),ok:false}))])});
    }
  }
  /* ex4 : grammaire — options mélangées une seule fois */
  const gq=shuffle(GRAMMAR_POOL).slice(0,5).map(g=>({fr:g.q,note:g.note,opts:shuffle(g.opts.map((o,i)=>({t:o,ok:i===g.a})))}));
  /* ex5 : vrai/faux */
  const tf=t.tf.map((x,i)=>({s:x[0],sv:VP?VP.tf[i]:x[0],v:x[1]}));
  const ex={cur:0,scores:[null,null,null,null,null],t,matched:new Set()};
  ex.data={q1,pairs,mL,mR,holes,gq,tf};
  ex.render=[
    ()=>exQCM(q1,0,'Choisis la traduction française de chaque mot.'),
    ()=>exMatch(),
    ()=>exQCM(holes,2,'Complète chaque phrase avec le bon mot.'),
    ()=>exQCM(gq,3,'Cinq questions de grammaire tirées des leçons.'),
    ()=>exTF(tf)
  ];
  return ex;
}

/* ---------- moteurs d'exercices (état persistant : le toggle voyelles ne change rien) ---------- */
function optLabel(o){const txt=dv(o.t,o.tv);return /[\u0600-\u06FF]/.test(txt)?'<span class="ar kufi">'+esc(txt)+'</span>':esc(txt);}
function exQCM(items,slot,intro){
  window._qcm={items,slot};
  let done=0,right=0;
  const body=items.map((it,qi)=>{
    const prompt=it.fr!==undefined?esc(it.fr):'<span class="ar kufi" dir="rtl">'+esc(dv(it.sent!==undefined?it.sent:it.ar,it.sentv!==undefined?it.sentv:it.arv))+'</span>';
    const answered=it.picked!==undefined;
    if(answered){done++;if(it.opts[it.picked].ok)right++;}
    const opts=it.opts.map((o,oi)=>{
      let cls='opt';if(answered){if(o.ok)cls+=' ok';else if(oi===it.picked)cls+=' ko';}
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="ansQCM(this,'+qi+','+oi+')">'+optLabel(o)+'</button>';
    }).join('');
    let fb='';
    if(answered){
      const ok=it.opts[it.picked].ok;
      fb='<div class="fb '+(ok?'ok':'ko')+'">'+(ok?'✓ Correct':'✗ La bonne réponse est en vert.')+(it.note?' <span style="color:var(--ink2);font-weight:400">— '+esc(it.note)+'</span>':'')+'</div>';
    }else fb='<div class="fb"></div>';
    return '<div class="q"'+(answered?' data-done="1"':'')+'><div class="prompt">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb+'</div>';
  }).join('');
  const scoreVis=done===items.length;
  if(scoreVis)EX.scores[slot]=right/items.length;
  return '<p style="color:var(--ink2)">'+intro+'</p>'+body+'<div class="score" id="qscore" style="display:'+(scoreVis?'block':'none')+'">'+(scoreVis?'Score : '+right+' / '+items.length:'')+'</div>';
}
function ansQCM(btn,qi,oi){
  const st=window._qcm,it=st.items[qi],q=btn.closest('.q');
  if(q.dataset.done)return;q.dataset.done=1;
  it.picked=oi;
  q.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(it.opts[i].ok)b.classList.add('ok');});
  const fb=q.querySelector('.fb');
  if(it.opts[oi].ok){fb.textContent='✓ Correct';fb.className='fb ok';}
  else{btn.classList.add('ko');fb.textContent='✗ La bonne réponse est en vert.';fb.className='fb ko';}
  if(it.note)fb.innerHTML+=' <span style="color:var(--ink2);font-weight:400">— '+esc(vocalOn?it.note:stripHarakat(it.note))+'</span>';
  const done=st.items.filter(x=>x.picked!==undefined).length;
  if(done===st.items.length){
    const right=st.items.filter(x=>x.opts[x.picked].ok).length;
    const sc=$('#qscore');sc.style.display='block';sc.textContent='Score : '+right+' / '+st.items.length;
    EX.scores[st.slot]=right/st.items.length;
  }
}
function exMatch(){
  const D=EX.data,pairs=D.pairs;
  window._m={sel:null};
  const btn=(i,side)=>{
    const p=pairs[i],matched=EX.matched.has(i);
    const label=side==='l'?'<span class="ar kufi">'+esc(dv(p.ar,p.arv))+'</span>':esc(p.fr);
    return '<button class="mbtn'+(matched?' ok':'')+'" data-i="'+i+'" data-side="'+side+'" onclick="pick(this)">'+label+'</button>';
  };
  const full=EX.matched.size===pairs.length;
  if(full)EX.scores[1]=1;
  return '<p style="color:var(--ink2)">Associe chaque mot arabe à sa traduction. Touche un mot puis sa paire.</p><div class="match">'+
  '<div style="display:grid;gap:8px">'+D.mL.map(i=>btn(i,'l')).join('')+'</div>'+
  '<div style="display:grid;gap:8px">'+D.mR.map(i=>btn(i,'r')).join('')+'</div>'+
  '</div><div class="score" id="mscore" style="display:'+(full?'block':'none')+'">Toutes les paires trouvées ✓</div>';
}
function pick(b){
  const st=window._m;
  if(b.classList.contains('ok'))return;
  if(!st.sel){st.sel=b;b.classList.add('sel');return;}
  if(st.sel===b){b.classList.remove('sel');st.sel=null;return;}
  if(st.sel.dataset.side===b.dataset.side){st.sel.classList.remove('sel');st.sel=b;b.classList.add('sel');return;}
  if(st.sel.dataset.i===b.dataset.i){
    st.sel.classList.remove('sel');st.sel.classList.add('ok');b.classList.add('ok');st.sel=null;
    EX.matched.add(+b.dataset.i);
    if(EX.matched.size===EX.data.pairs.length){$('#mscore').style.display='block';EX.scores[1]=1;}
  }
  else{const a=st.sel;a.classList.remove('sel');a.classList.add('ko');b.classList.add('ko');st.sel=null;setTimeout(()=>{a.classList.remove('ko');b.classList.remove('ko');},450);}
}
function exTF(items){
  window._tf={items};
  let done=0,right=0;
  const body=items.map((it,i)=>{
    const answered=it.picked!==undefined;
    if(answered){done++;if(it.picked===it.v)right++;}
    const bt=(val,lab)=>{
      let cls='opt';if(answered){if(val===it.v)cls+=' ok';else if(val===it.picked)cls+=' ko';}
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="ansTF(this,'+i+','+val+')">'+lab+'</button>';
    };
    const fb=answered?'<div class="fb '+(it.picked===it.v?'ok':'ko')+'">'+(it.picked===it.v?'✓ Correct':'✗ Relis le texte.')+'</div>':'<div class="fb"></div>';
    return '<div class="q"'+(answered?' data-done="1"':'')+'><div class="prompt"><span class="ar kufi" dir="rtl">'+renderAr(dv(it.s,it.sv))+'</span></div><div class="opts" style="grid-template-columns:1fr 1fr">'+bt(true,dv('صحيح','صَحِيح')+' — Vrai')+bt(false,dv('خطأ','خَطَأ')+' — Faux')+'</div>'+fb+'</div>';
  }).join('');
  const full=done===items.length;
  if(full)EX.scores[4]=right/items.length;
  return '<p style="color:var(--ink2)">D\'après le texte, chaque phrase est-elle vraie ou fausse ?</p>'+body+
  '<div class="score" id="tfscore" style="display:'+(full?'block':'none')+'">'+(full?'Score : '+right+' / '+items.length:'')+'</div>';
}
function ansTF(btn,i,val){
  const st=window._tf,it=st.items[i],q=btn.closest('.q');
  if(q.dataset.done)return;q.dataset.done=1;
  it.picked=val;
  q.querySelectorAll('.opt').forEach(b=>{b.disabled=true;});
  const fb=q.querySelector('.fb');
  const okBtn=q.querySelectorAll('.opt')[it.v?0:1];okBtn.classList.add('ok');
  if(val===it.v){fb.textContent='✓ Correct';fb.className='fb ok';}
  else{btn.classList.add('ko');fb.textContent='✗ Relis le texte.';fb.className='fb ko';}
  const done=st.items.filter(x=>x.picked!==undefined).length;
  if(done===st.items.length){
    const right=st.items.filter(x=>x.picked===x.v).length;
    const sc=$('#tfscore');sc.style.display='block';sc.textContent='Score : '+right+' / '+st.items.length;
    EX.scores[4]=right/st.items.length;
    const done2=store.get('done',{});done2[EX.t.id]=true;store.set('done',done2);
  }
}

/* ================= zoom & thème ================= */
let vocalOn=store.get('vocal',false);
function applyVocalBtn(){const b=$('#vocalBtn');if(b)b.classList.toggle('on',vocalOn);}
function toggleVocal(){vocalOn=!vocalOn;store.set('vocal',vocalOn);applyVocalBtn();render();}

let zoomLv=store.get('zoom',1);
function applyZoom(){document.documentElement.style.setProperty('--zoom',zoomLv);}
function zoom(d){zoomLv=Math.min(1.8,Math.max(0.8,Math.round((zoomLv+d*0.1)*10)/10));store.set('zoom',zoomLv);applyZoom();}
function toggleTheme(){const b=document.body;const dark=b.dataset.theme!=='dark';b.dataset.theme=dark?'dark':'light';store.set('theme',b.dataset.theme);}
function toggleFS(){
  try{
    const d=document;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);}
    else{const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  }catch(e){}
}
if(document.addEventListener)document.addEventListener('fullscreenchange',function(){const b=$('#fsBtn');if(b)b.classList.toggle('on',!!document.fullscreenElement);});
(function(){const th=store.get('theme',null);if(th)document.body.dataset.theme=th;applyZoom();applyVocalBtn();})();

render();
</script></body></html>
