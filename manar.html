<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مَنَار — Cours d'arabe de la Mosquée de Voiron · A1/A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@400;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF; --panel:#FFFFFF; --ink:#20242E; --ink2:#5A6072;
  --maj:#2B4BC9; --maj-soft:#E4E9FB; --safran:#D99A1B; --safran-soft:#FBF0D8;
  --oasis:#2E7D5B; --oasis-soft:#DFF0E8; --grenat:#B3382F; --grenat-soft:#F7E2E0;
  --line:#DBD9CF; --shadow:0 10px 30px rgba(32,36,46,.10);
  --r:14px; --zoom:1;
}
[data-theme="dark"]{
  --bg:#14171F; --panel:#1D212C; --ink:#ECEDF2; --ink2:#9AA1B5;
  --maj:#7D92EE; --maj-soft:#232A46; --safran:#E8B54A; --safran-soft:#33290F;
  --oasis:#5CBB92; --oasis-soft:#16301F; --grenat:#E1766D; --grenat-soft:#3A1B18;
  --line:#323848; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;font-size:calc(16px*var(--zoom));line-height:1.6;transition:background .3s,color .3s}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}
.kufi{font-family:"Noto Kufi Arabic",sans-serif;direction:rtl;unicode-bidi:isolate}
.gtable td.ar,.gtable th.ar{text-align:right}
.gex .ar{text-align:right}
h1,h2,h3{font-family:"Fraunces",serif}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none}
.logo .kufi{order:2}
.logo .kufi{font-size:1.25em;font-weight:700;color:var(--maj)}
.logo small{font-family:"Fraunces",serif;font-weight:600;letter-spacing:.02em}
.topbar nav{display:flex;gap:4px;margin-left:auto}
.navbtn{border:none;background:none;color:var(--ink2);font:inherit;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.navbtn.active{background:var(--maj);color:#fff}
.navbtn:not(.active):hover{background:var(--maj-soft);color:var(--maj)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1}
.iconbtn:hover{border-color:var(--maj);color:var(--maj)}
.iconbtn.on{background:var(--maj);border-color:var(--maj);color:#fff}

.wrap{max-width:min(calc(880px*var(--zoom)),100%);margin:0 auto;padding:26px 18px 90px;transition:max-width .15s}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--maj);font-weight:700;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.eyebrow .kufi{font-size:1.25em;letter-spacing:0;text-transform:none;order:3}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);order:2}

/* ---- home ---- */
.hero{padding:34px 0 10px}
.hero h1{font-size:2.3em;line-height:1.15;font-weight:700}
.hero .ar{display:block;font-size:2.4em;color:var(--maj);line-height:1.3;margin-bottom:6px}
.hero p{color:var(--ink2);max-width:56ch;margin-top:10px}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.bigcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.bigcard:hover{transform:translateY(-3px);border-color:var(--maj)}
.bigcard .kufi{font-size:1.5em;font-weight:700;color:var(--safran)}
.bigcard h2{margin:4px 0 6px;font-size:1.25em}
.bigcard p{color:var(--ink2);font-size:.92em}
.statline{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap}
.stat b{font-family:"Fraunces",serif;font-size:1.5em;color:var(--maj)}
.stat span{display:block;color:var(--ink2);font-size:.82em}

/* ---- lists ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--maj)}
.card .ar{font-size:1.5em;font-weight:700;display:block}
.card .fr{color:var(--ink2);font-size:.9em}
.badge{display:inline-block;font-size:.7em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--maj-soft);color:var(--maj);margin-bottom:8px}
.badge.done{background:var(--oasis-soft);color:var(--oasis)}
.themebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:inherit;font-size:.85em;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.active{background:var(--maj);border-color:var(--maj);color:#fff}

/* ---- lesson / text view ---- */
.back{border:none;background:none;color:var(--maj);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:14px}
.paneltxt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.titleAr{font-size:2.1em;font-weight:700;color:var(--maj);line-height:1.4}
.titleFr{color:var(--ink2);font-family:"Fraunces",serif;font-size:1.05em;margin-bottom:18px}
.prose{font-size:1.62em;line-height:2.25;text-align:right}
.prose p+p{margin-top:.9em}
.w{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--maj) 45%,transparent);border-radius:3px;transition:background .12s}
.w:hover,.w.on{background:var(--maj-soft);border-bottom-style:solid}
.hint{color:var(--ink2);font-size:.85em;margin-top:14px;display:flex;align-items:center;gap:8px}
.hint::before{content:"☝";font-size:1.2em}

/* grammar tables */
.gtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95em}
.gtable th,.gtable td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.gtable th{background:var(--maj-soft);color:var(--maj);font-weight:700}
.gtable .ar{font-size:1.25em}
.gnote{background:var(--safran-soft);border-right:4px solid var(--safran);padding:12px 14px;border-radius:8px;margin:12px 0;font-size:.93em}
.gex{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.gex .ar{font-size:1.4em;display:block}
.gex .fr{color:var(--ink2);font-size:.9em}
.lesson h3{margin:22px 0 6px;color:var(--maj)}
.lesson p{margin:8px 0}

/* ---- exercises ---- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 14px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:inherit;font-size:.88em;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer}
.tab.active{background:var(--safran);border-color:var(--safran);color:#20242E}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.q .prompt{font-weight:600;margin-bottom:12px}
.q .prompt .ar{font-size:1.5em}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:left;padding:10px 14px;border-radius:10px;cursor:pointer}
.opt .ar{font-size:1.3em}
.opt:hover{border-color:var(--maj)}
.opt.ok{background:var(--oasis-soft);border-color:var(--oasis);color:var(--oasis);font-weight:700}
.opt.ko{background:var(--grenat-soft);border-color:var(--grenat);color:var(--grenat)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:.9em;font-weight:600}
.fb.ok{color:var(--oasis)} .fb.ko{color:var(--grenat)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px;border-radius:10px;cursor:pointer}
.mbtn .ar{font-size:1.35em}
.mbtn.sel{border-color:var(--maj);background:var(--maj-soft)}
.mbtn.ok{background:var(--oasis-soft);border-color:var(--oasis);opacity:.6;cursor:default}
.mbtn.ko{background:var(--grenat-soft);border-color:var(--grenat)}
.score{background:var(--maj-soft);color:var(--maj);font-weight:700;border-radius:10px;padding:12px 16px;margin-top:8px}
.btn{border:none;background:var(--maj);color:#fff;font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}

/* ---- word sheet ---- */
.sheetbg{position:fixed;inset:0;background:rgba(15,18,26,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.sheetbg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.25);z-index:91;padding:22px 24px 30px;transition:transform .25s}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet .word{font-size:2.6em;font-weight:700;color:var(--maj);text-align:center;line-height:1.4}
.sheet .trad{text-align:center;font-family:"Fraunces",serif;font-size:1.3em;margin-top:2px}
.sheet .meta{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .row{display:flex;justify-content:space-between;gap-inline:12px;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.93em}
.sheet .row b.ar{font-size:1.25em}
.sheet .lab{color:var(--ink2);font-weight:600}

footer{max-width:min(calc(880px*var(--zoom)),100%);margin:0 auto;padding:0 18px 30px;color:var(--ink2);font-size:.8em}
@media(max-width:640px){
  .topbar{flex-wrap:wrap;gap:6px;row-gap:6px;padding:8px 10px}
  .topbar nav{order:10;flex-basis:100%;margin-left:0;justify-content:center;gap:2px}
  .logo{margin-right:auto}
  .logo small{display:none}
  .iconbtn{width:32px;height:32px;font-size:14px}
  .navbtn{padding:6px 10px;font-size:.88em}
  .wrap{padding:16px 12px 70px}
  .hero{padding:18px 0 6px}
  .hero h1{font-size:1.55em}
  .hero .ar{font-size:1.9em}
  .homegrid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .paneltxt{padding:16px}
  .prose{font-size:1.4em;line-height:2.1}
  .titleAr{font-size:1.7em}
  .q{padding:14px}
  .q .prompt .ar{font-size:1.3em}
  .tab{padding:7px 10px;font-size:.82em}
  .match{grid-template-columns:1fr 1fr;gap:6px}
  .mbtn{padding:9px 6px}
  .mbtn .ar{font-size:1.2em}
  .gtable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .gtable th,.gtable td{padding:6px 7px}
  .gnote,.gex{padding:10px 11px}
  .sheet{padding:16px 14px 24px}
  .sheet .word{font-size:2.1em}
  .score{padding:10px 12px}
  footer{padding:0 12px 24px}
}
@media(max-width:380px){
  .hero h1{font-size:1.35em}
  .prose{font-size:1.28em}
  .navbtn{padding:6px 8px;font-size:.84em}
}
:focus-visible{outline:2px solid var(--maj);outline-offset:2px}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="backBtn" onclick="goBack()" title="Retour en arrière">←</button>
  <div class="logo" onclick="go('home')"><small>Mosquée de Voiron ·</small><span class="kufi">مَنَار</span></div>
  <nav>
    <button class="navbtn" data-nav="home" onclick="go('home')">Accueil</button>
    <button class="navbtn" data-nav="grammar" onclick="go('grammar')">Grammaire</button>
    <button class="navbtn" data-nav="texts" onclick="go('texts')">Textes</button>
  </nav>
  <button class="iconbtn kufi" id="vocalBtn" onclick="toggleVocal()" title="Afficher / masquer les voyelles (tashkīl)">ـَـّ</button>
  <button class="iconbtn" onclick="zoom(-1)" title="Réduire le texte">A−</button>
  <button class="iconbtn" onclick="zoom(1)" title="Agrandir le texte">A+</button>
  <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Thème clair / sombre">◐</button>
  <button class="iconbtn" id="fsBtn" onclick="toggleFS()" title="Plein écran">⛶</button>
</header>
<main class="wrap" id="app"></main>
<footer><strong>مَنَار — Manār</strong> · Cours d'arabe de la Mosquée de Voiron (AVEC) — 50 textes · 19 leçons de grammaire · exercices auto-corrigés.<br>Toucher un mot arabe affiche sa traduction, son type et son pluriel (ou singulier).</footer>
<div class="sheetbg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

{id:6,th:0,ta:"الفطور يوم الجمعة",tf_:"Le petit déjeuner du vendredi",
p:["يوم الجمعة هو يوم العطلة عندنا. كل العائلة تجلس حول المائدة في الصباح. الفطور يوم الجمعة طويل وجميل.",
"أمي تحضر الفطور: خبز ساخن وجبن وزيتون وبيض وعسل. أبي يحضر الشاي والقهوة. أنا أساعد أمي في المطبخ.",
"نأكل ونتكلم ونضحك. بعد الفطور نشرب الشاي في الحديقة. أنا أحب صباح الجمعة كثيرا."],
v:["جمعة","عطلة","مائدة","زيتون","بيض","عسل","قهوة","يضحك"],
tf:[["يوم العطلة هو الجمعة",true],["الأب يحضر الفطور",false],["في الفطور بيض وعسل",true],["يشربون الشاي في المطبخ",false]]},

{id:7,th:0,ta:"نهاية الأسبوع",tf_:"Le week-end",
p:["في نهاية الأسبوع لا أذهب إلى المدرسة. أستيقظ متأخرا وآكل الفطور ببطء. ثم أساعد أمي في تنظيف البيت.",
"بعد الظهر أخرج مع أصدقائي. أحيانا نذهب إلى الحديقة العامة وأحيانا نشاهد فيلما في البيت. في المساء نأكل العشاء عند جدتي.",
"يوم الأحد أكتب واجباتي وأحضر حقيبتي للمدرسة. نهاية الأسبوع قصيرة لكنها جميلة."],
v:["نهاية","أسبوع","متأخر","تنظيف","أحيانا","فيلم","جدة","حقيبة"],
tf:[["يستيقظ مبكرا في نهاية الأسبوع",false],["يساعد أمه في التنظيف",true],["يأكلون العشاء عند الجدة",true],["يوم الأحد يلعب كرة القدم",false]]},

{id:8,th:0,ta:"غرفتي",tf_:"Ma chambre",
p:["غرفتي صغيرة لكنني أحبها كثيرا. فيها سرير مريح ومكتب كبير وخزانة للملابس. النافذة تطل على الحديقة.",
"على المكتب كتبي ودفاتري وحاسوب صغير. فوق السرير صورة لعائلتي. بجانب الباب مرآة كبيرة.",
"أدرس في غرفتي كل مساء. أحيانا أقرأ قصة قبل النوم. غرفتي هي مكاني المفضل في البيت."],
v:["خزانة","ملابس","دفتر","حاسوب","صورة","باب","مرآة","قصة"],
tf:[["الغرفة كبيرة",false],["على المكتب حاسوب",true],["المرآة بجانب النافذة",false],["يقرأ قصة قبل النوم أحيانا",true]]},

{id:9,th:0,ta:"حينا",tf_:"Notre quartier",
p:["نحن نسكن في حي هادئ وجميل. في الحي شوارع نظيفة وأشجار كثيرة. الجيران طيبون ونحن نعرفهم كلهم.",
"قريبا من بيتنا مسجد كبير ومدرسة وحديقة عامة. في آخر الشارع دكان صغير. صاحب الدكان رجل كبير في السن اسمه أبو سمير.",
"في المساء يخرج الناس إلى الشارع. الأطفال يلعبون والرجال يتكلمون أمام البيوت. أنا أحب حينا كثيرا."],
v:["حي","جيران","نظيف","مسجد","دكان","صاحب","ناس","أطفال"],
tf:[["الحي هادئ",true],["الدكان في أول الشارع",false],["صاحب الدكان شاب",false],["الأطفال يلعبون في المساء",true]]},

{id:10,th:0,ta:"التسوق مع أمي",tf_:"Les courses avec maman",
p:["كل يوم سبت أذهب مع أمي إلى السوق. نخرج من البيت في الصباح ونركب الحافلة. السوق كبير وفيه ناس كثيرون.",
"أمي تشتري الخضار والفواكه: طماطم وبطاطس وتفاح وموز. أنا أحمل الأكياس. ثم نشتري اللحم والخبز من الدكان.",
"قبل الرجوع نشرب عصيرا باردا. أمي تشتري لي أحيانا حلوى صغيرة. نرجع إلى البيت في الظهر ونحن سعداء."],
v:["سوق","خضار","فواكه","طماطم","تفاح","لحم","كيس","عصير"],
tf:[["يذهبان إلى السوق يوم الجمعة",false],["يركبان الحافلة",true],["الابن يحمل الأكياس",true],["يرجعان في المساء",false]]},
/* ============ THEME 1 : EN VILLE ============ */
{id:11,th:1,ta:"في السوق",tf_:"Au marché",
p:["السوق في مدينتنا قديم وكبير. يفتح السوق في الصباح ويغلق في المساء. فيه دكاكين كثيرة وناس من كل مكان.",
"في السوق تجد كل شيء: الخضار والفواكه واللحم والسمك والملابس. الأسعار رخيصة والباعة يتكلمون بصوت عال.",
"ذهبت أمس إلى السوق مع أبي. اشترينا سمكا طازجا وخبزا ساخنا. ثم شربنا الشاي في مقهى صغير قرب الباب."],
v:["قديم","يفتح","يغلق","سمك","سعر","رخيص","بائع","مقهى"],
tf:[["السوق جديد",false],["الأسعار رخيصة",true],["اشتريا لحما",false],["شربا الشاي في مقهى",true]]},

{id:12,th:1,ta:"في المطعم",tf_:"Au restaurant",
p:["يوم الخميس ذهبنا إلى مطعم في وسط المدينة. المطعم جميل ونظيف والطاولات كبيرة. جلسنا قرب النافذة.",
"جاء النادل وأعطانا قائمة الطعام. طلب أبي دجاجا مع الأرز وطلبت أمي سمكا. أنا طلبت لحما مشويا وسلطة.",
"الطعام كان لذيذا جدا. بعد الأكل شربنا الشاي وأكلنا حلوى. دفع أبي الحساب وخرجنا سعداء."],
v:["مطعم","طاولة","نادل","قائمة","دجاج","أرز","لذيذ","حساب"],
tf:[["ذهبوا إلى المطعم يوم الجمعة",false],["جلسوا قرب النافذة",true],["الأم طلبت دجاجا",false],["الأب دفع الحساب",true]]},

{id:13,th:1,ta:"في محطة القطار",tf_:"À la gare",
p:["وصلنا إلى محطة القطار في الساعة التاسعة صباحا. المحطة كبيرة وفيها ناس كثيرون. بعضهم يجري لأن القطار قريب.",
"ذهب أبي إلى الشباك واشترى تذكرتين إلى المدينة الكبيرة. انتظرنا القطار على الرصيف. بعد عشر دقائق وصل القطار.",
"ركبنا القطار وجلسنا قرب النافذة. القطار سريع ومريح. شاهدت من النافذة الحقول والقرى الصغيرة."],
v:["محطة","قطار","تذكرة","رصيف","دقيقة","سريع","حقل","قرية"],
tf:[["وصلوا في المساء",false],["اشترى الأب تذكرتين",true],["انتظروا ساعة كاملة",false],["القطار سريع ومريح",true]]},

{id:14,th:1,ta:"عند الطبيب",tf_:"Chez le médecin",
p:["أمس كنت مريضا. كان رأسي يؤلمني وكانت حرارتي عالية. أخذتني أمي إلى الطبيب في الصباح.",
"انتظرنا قليلا في غرفة الانتظار. ثم دخلنا. سألني الطبيب: ماذا تشعر؟ قلت له: رأسي يؤلمني وأنا تعبان.",
"فحصني الطبيب وكتب لي دواء. قال: اشرب ماء كثيرا ونم مبكرا. اليوم أنا أحسن والحمد لله."],
v:["مريض","رأس","حرارة","انتظار","يشعر","تعبان","دواء","أحسن"],
tf:[["كان الولد مريضا",true],["ذهب إلى الطبيب في المساء",false],["كتب الطبيب دواء",true],["اليوم هو تعبان",false]]},

{id:15,th:1,ta:"في المكتبة",tf_:"À la bibliothèque",
p:["في مدينتنا مكتبة عامة كبيرة. المكتبة مفتوحة كل يوم من الصباح إلى المساء. فيها كتب كثيرة بلغات مختلفة.",
"أذهب إلى المكتبة كل يوم أربعاء بعد المدرسة. أقرأ القصص وأكتب واجباتي هناك. المكان هادئ والكراسي مريحة.",
"الموظفة في المكتبة اسمها سارة. هي امرأة طيبة وتساعدني دائما. أمس أخذت منها كتابا جديدا عن الحيوانات."],
v:["مكتبة","مفتوح","لغة","مختلف","هادئ","كرسي","موظفة","حيوان"],
tf:[["المكتبة مفتوحة كل يوم",true],["يذهب إليها يوم الخميس",false],["الموظفة اسمها سارة",true],["أخذ كتابا عن التاريخ",false]]},

{id:16,th:1,ta:"في الحديقة العامة",tf_:"Au parc",
p:["قرب بيتنا حديقة عامة واسعة. فيها أشجار عالية وأزهار جميلة وملعب للأطفال. في وسط الحديقة بحيرة صغيرة.",
"يوم السبت ذهبت إلى الحديقة مع أخي الصغير. لعب يوسف في الملعب وأنا جلست على كرسي تحت شجرة وقرأت كتابي.",
"في الظهر أكلنا خبزا وجبنا وشربنا العصير. شاهدنا البط في البحيرة. رجعنا إلى البيت في المساء تعبانين وسعداء."],
v:["واسع","زهرة","وسط","بحيرة","تحت","ظهر","بط","تعبان"],
tf:[["في وسط الحديقة بحيرة",true],["ذهب مع أخته",false],["قرأ كتابه تحت شجرة",true],["رجعا في الصباح",false]]},

{id:17,th:1,ta:"في المقهى",tf_:"Au café",
p:["في شارعنا مقهى صغير وقديم. صاحب المقهى رجل طيب اسمه أبو كريم. المقهى مفتوح من الصباح إلى الليل.",
"يجلس الرجال في المقهى ويشربون الشاي والقهوة. بعضهم يقرأ الجريدة وبعضهم يتكلم مع أصدقائه. المكان دائما مليء بالناس.",
"يذهب جدي إلى هذا المقهى كل مساء. يشرب قهوته ويتكلم مع أصدقائه القدامى. أحيانا أذهب معه وأشرب عصيرا."],
v:["ليل","بعض","دائما","مليء","جد","كل","يتكلم","معه"],
tf:[["صاحب المقهى اسمه أبو كريم",true],["المقهى يغلق في الظهر",false],["الجد يذهب كل مساء",true],["الحفيد يشرب القهوة",false]]},

{id:18,th:1,ta:"سائق التاكسي",tf_:"Le chauffeur de taxi",
p:["كان المطر قويا أمس ولم تأت الحافلة. وقفت أمي في الشارع وطلبت تاكسي. توقف تاكسي أصفر بعد دقائق.",
"سائق التاكسي رجل كبير في السن. سألنا: إلى أين؟ قالت أمي: إلى المستشفى من فضلك، لأن جدتي مريضة هناك.",
"كان السائق طيبا وسريعا. تكلم معنا عن المدينة وعن عمله. وصلنا بعد ربع ساعة. دفعت أمي له وشكرته."],
v:["مطر","قوي","حافلة","سائق","أصفر","أين","ربع","يشكر"],
tf:[["كان الجو جميلا",false],["التاكسي أصفر",true],["ذهبا إلى المستشفى",true],["السائق شاب",false]]},

{id:19,th:1,ta:"في البريد",tf_:"À la poste",
p:["أرسلت جدتي رسالة إلى خالي في فرنسا. ذهبت معها إلى مكتب البريد في وسط المدينة. المكتب مليء بالناس.",
"انتظرنا في الطابور أمام الشباك. أعطت جدتي الرسالة للموظف. سألها الموظف: عادية أم سريعة؟ قالت: سريعة من فضلك.",
"دفعت جدتي ثمن الطابع وخرجنا. في الطريق اشترت لي جدتي عصيرا. قالت لي: الرسالة ستصل بعد أسبوع."],
v:["رسالة","خال","بريد","طابور","أمام","موظف","ثمن","طابع"],
tf:[["الخال يسكن في فرنسا",true],["المكتب فارغ",false],["اختارت الجدة رسالة عادية",false],["الرسالة ستصل بعد أسبوع",true]]},

{id:20,th:1,ta:"مدينتي",tf_:"Ma ville",
p:["أنا أسكن في مدينة جميلة قرب البحر. المدينة ليست كبيرة ولكنها نظيفة وهادئة. الطقس فيها جميل في كل الفصول.",
"في وسط المدينة ساحة قديمة وسوق كبير ومسجد جميل. قرب البحر مطاعم ومقاه كثيرة. الناس هنا طيبون ويحبون الضيوف.",
"في المساء يمشي الناس قرب البحر. الأطفال يلعبون على الرمل والكبار يجلسون في المقاهي. أنا فخور بمدينتي."],
v:["بحر","طقس","فصل","ساحة","ضيف","يمشي","رمل","فخور"],
tf:[["المدينة قرب البحر",true],["المدينة كبيرة جدا",false],["الناس يحبون الضيوف",true],["الأطفال يلعبون في الساحة",false]]},
/* ============ THEME 2 : LES GENS ============ */
{id:21,th:2,ta:"عمل أبي",tf_:"Le travail de mon père",
p:["أبي طبيب في المستشفى الكبير. يخرج من البيت في الساعة السابعة صباحا ويرجع في المساء. عمله صعب لكنه يحبه.",
"في المستشفى يفحص أبي المرضى ويكتب لهم الدواء. يقول أبي دائما: أنا سعيد عندما أساعد الناس.",
"في يوم العطلة يبقى أبي معنا في البيت. نأكل معا ونتكلم ونضحك. أنا أريد أن أصير طبيبا مثل أبي."],
v:["عمل","صعب","يفحص","مرضى","عندما","يبقى","يريد","يصير"],
tf:[["الأب معلم",false],["يرجع الأب في المساء",true],["الأب يحب عمله",true],["الابن يريد أن يصير مهندسا",false]]},

{id:22,th:2,ta:"جدتي",tf_:"Ma grand-mère",
p:["جدتي امرأة كبيرة في السن لكنها نشيطة. تسكن في بيت صغير قريب من بيتنا. شعرها أبيض وعيناها جميلتان.",
"جدتي تطبخ أحسن طعام في العالم. كل يوم جمعة نأكل عندها الكسكس أو الأرز باللحم. بيتها دائما مليء بالضيوف.",
"في المساء تجلس جدتي معنا وتحكي لنا قصصا قديمة عن القرية وعن جدي. أنا أحب جدتي كثيرا وأزورها كل أسبوع."],
v:["شعر","أبيض","عين","أحسن","عالم","يحكي","يزور","عند"],
tf:[["الجدة تسكن بعيدا",false],["شعر الجدة أبيض",true],["تطبخ الكسكس يوم الجمعة",true],["تحكي قصصا عن المدرسة",false]]},

{id:23,th:2,ta:"الجار الجديد",tf_:"Le nouveau voisin",
p:["في الشهر الماضي جاء جار جديد إلى حينا. اسمه سمير وهو مهندس شاب. سكن في البيت الأبيض أمام بيتنا.",
"في البداية لم نعرفه. ثم جاء يوم السبت وسلم على أبي. تكلم الرجلان طويلا أمام الباب وشربا الشاي معا.",
"الآن سمير صديق للعائلة. يأكل عندنا أحيانا ويساعد أبي في الحديقة. جدتي تقول: الجار قبل الدار."],
v:["شهر","ماضي","جار","مهندس","شاب","بداية","يسلم","الآن"],
tf:[["الجار الجديد طبيب",false],["اسمه سمير",true],["سكن في البيت الأبيض",true],["جاء قبل سنة",false]]},

{id:24,th:2,ta:"معلمتي",tf_:"Ma maîtresse",
p:["معلمة اللغة العربية اسمها مريم. هي امرأة شابة وذكية. تعمل في مدرستنا منذ خمس سنوات.",
"المعلمة مريم تشرح الدرس ببطء وبصوت واضح. عندما لا نفهم، تشرح مرة ثانية وتضحك معنا. كل الطلاب يحبونها.",
"أمس قالت لي المعلمة: أنت طالب جيد وقراءتك أحسن من قبل. رجعت إلى البيت سعيدا وأخبرت أمي."],
v:["ذكي","منذ","يشرح","بطء","واضح","يفهم","مرة","يخبر"],
tf:[["المعلمة تعلم الرياضيات",false],["تشرح بصوت واضح",true],["الطلاب يحبونها",true],["رجع الطالب حزينا",false]]},

{id:25,th:2,ta:"رسالة إلى صديقي",tf_:"Une lettre à mon ami",
p:["صديقي العزيز كريم، كيف حالك؟ أنا بخير والحمد لله. أكتب لك هذه الرسالة من مدينتي الجديدة.",
"نحن الآن نسكن قرب البحر. المدينة جميلة والناس طيبون. مدرستي الجديدة كبيرة وعندي أصدقاء جدد. لكنني أفكر فيك كثيرا.",
"كيف العائلة؟ وكيف المدرسة؟ اكتب لي قريبا من فضلك. سأزورك في العطلة الصيفية إن شاء الله. صديقك الوفي، أحمد."],
v:["عزيز","حال","بخير","جديد","يفكر","قريبا","صيفي","وفي"],
tf:[["أحمد يكتب من مدينته القديمة",false],["المدينة الجديدة قرب البحر",true],["عند أحمد أصدقاء جدد",true],["سيزور كريم في الشتاء",false]]},

{id:26,th:2,ta:"أخي الطالب",tf_:"Mon frère étudiant",
p:["أخي الكبير اسمه عمر وعمره عشرون سنة. هو طالب في الجامعة ويدرس الطب. يريد أن يصير طبيبا مثل أبي.",
"عمر يدرس كثيرا. يقرأ الكتب في الليل ويكتب في دفاتره. في الصباح يذهب إلى الجامعة بالحافلة. أحيانا يرجع متأخرا.",
"في نهاية الأسبوع يساعدني عمر في واجباتي. يشرح لي الرياضيات ببطء. أخي ذكي وطيب وأنا فخور به."],
v:["جامعة","طب","كتاب","رياضيات","عشرون","عمر","به","واجب"],
tf:[["عمر يدرس الهندسة",false],["عمره عشرون سنة",true],["يذهب إلى الجامعة بالقطار",false],["يساعد أخاه الصغير",true]]},

{id:27,th:2,ta:"عيد ميلاد ليلى",tf_:"L'anniversaire de Leïla",
p:["أمس كان عيد ميلاد أختي ليلى. صارت ليلى عشرين سنة. حضرت أمي حفلة صغيرة في البيت.",
"جاء الأصدقاء والجيران في المساء. أكلنا كعكة كبيرة وشربنا العصير. غنينا لليلى وأعطيناها الهدايا.",
"أعطيتها أنا كتابا جميلا لأنها تحب القراءة. كانت ليلى سعيدة جدا وشكرتنا كلنا. كانت ليلة جميلة."],
v:["عيد","ميلاد","حفلة","كعكة","يغني","هدية","قراءة","ليلة"],
tf:[["صارت ليلى ثلاثين سنة",false],["أكلوا كعكة",true],["أعطاها أخوها كتابا",true],["كانت الحفلة في مطعم",false]]},

{id:28,th:2,ta:"عرس في العائلة",tf_:"Un mariage dans la famille",
p:["في الأسبوع الماضي تزوج خالي يوسف. كان العرس في بيت جدي في القرية. جاءت كل العائلة من كل المدن.",
"لبس الرجال ملابس جميلة ولبست النساء فساتين ملونة. كان هناك طعام كثير: لحم وأرز وكسكس وحلوى.",
"غنى الناس ورقصوا حتى الليل. كان خالي سعيدا جدا وزوجته أيضا. أنا لعبت مع أولاد خالاتي. كان يوما لا أنساه."],
v:["يتزوج","عرس","امرأة","فستان","ملون","يرقص","زوجة","ينسى"],
tf:[["تزوج الخال يوسف",true],["كان العرس في المدينة",false],["رقص الناس حتى الليل",true],["كان الخال حزينا",false]]},

{id:29,th:2,ta:"طفل جديد في البيت",tf_:"Un bébé à la maison",
p:["قبل شهر جاء طفل جديد إلى عائلتنا. ولدت أمي بنتا صغيرة وجميلة. اسمها هدى وهي الآن أختي الصغيرة.",
"هدى تنام كثيرا وتبكي أحيانا في الليل. أمي تعبانة لكنها سعيدة. جدتي تسكن معنا الآن لأنها تساعد أمي.",
"أنا أحب أختي الصغيرة. أنظر إليها عندما تنام وألعب معها عندما تستيقظ. صار بيتنا أجمل معها."],
v:["طفل","يولد","بنت","يبكي","ينظر","إليها","أجمل","صار"],
tf:[["ولدت الأم ولدا",false],["اسم البنت هدى",true],["الجدة تسكن معهم الآن",true],["البنت لا تبكي أبدا",false]]},

{id:30,th:2,ta:"جدي في القرية",tf_:"Mon grand-père au village",
p:["جدي يسكن في قرية صغيرة بعيدة عن المدينة. بيته قديم وجميل وأمامه حقل كبير. عند جدي بقرة وخروفان ودجاج كثير.",
"يستيقظ جدي مبكرا كل يوم. يعمل في الحقل في الصباح ويجلس تحت الشجرة في الظهر. يقول جدي: الهواء هنا نظيف والحياة بسيطة.",
"نزور جدي في كل عطلة. أشرب الحليب الطازج وآكل الخبز الساخن. ألعب مع الدجاج وأمشي في الحقول. أحب القرية كثيرا."],
v:["بعيد","بقرة","خروف","مبكرا","هواء","حياة","بسيط","حليب"],
tf:[["الجد يسكن في المدينة",false],["عند الجد بقرة",true],["يقول الجد إن الحياة بسيطة",true],["يزورونه مرة في السنة",false]]},
/* ============ THEME 3 : VOYAGES ET SAISONS ============ */
{id:31,th:3,ta:"رحلة إلى البحر",tf_:"Voyage à la mer",
p:["في الصيف الماضي سافرنا إلى مدينة قرب البحر. ركبنا السيارة في الصباح ووصلنا بعد ثلاث ساعات. كان الطقس حارا وجميلا.",
"سكنا في فندق صغير أمام البحر. كل صباح كنا نذهب إلى الشاطئ. سبحت في الماء ولعبت على الرمل مع أخي.",
"في المساء كنا نمشي في المدينة ونأكل السمك في المطاعم. بقينا أسبوعا كاملا. كانت رحلة جميلة لا أنساها."],
v:["يسافر","سيارة","حار","فندق","شاطئ","يسبح","ماء","رحلة"],
tf:[["سافروا في الشتاء",false],["سكنوا في فندق",true],["سبح في الماء",true],["بقوا ثلاثة أيام",false]]},

{id:32,th:3,ta:"فصل الصيف",tf_:"L'été",
p:["الصيف هو فصل العطلة والشمس. في الصيف تكون الأيام طويلة والليالي قصيرة. الطقس حار جدا في مدينتنا.",
"في الصيف لا نذهب إلى المدرسة. نستيقظ متأخرين ونلعب كثيرا. نشرب العصير البارد ونأكل الفواكه: البطيخ والعنب والتين.",
"في المساء نخرج إلى الشارع أو نذهب إلى البحر. بعض العائلات تسافر إلى الجبال لأن الهواء هناك بارد. أنا أحب الصيف كثيرا."],
v:["صيف","شمس","يوم","بارد","بطيخ","عنب","جبل","قصير"],
tf:[["في الصيف الأيام قصيرة",false],["يأكلون البطيخ في الصيف",true],["بعض العائلات تذهب إلى الجبال",true],["في الصيف يذهبون إلى المدرسة",false]]},

{id:33,th:3,ta:"فصل الشتاء",tf_:"L'hiver",
p:["في الشتاء يكون الطقس باردا والسماء رمادية. تمطر السماء كثيرا وأحيانا يسقط الثلج على الجبال. الأيام قصيرة والليالي طويلة.",
"في الشتاء نلبس ملابس ثقيلة: معطفا وقبعة وحذاء قويا. في البيت نجلس قرب النار ونشرب الشاي الساخن.",
"أنا أحب الشتاء عندما أكون في البيت. أقرأ القصص وأشاهد المطر من النافذة. أمي تطبخ شوربة ساخنة ولذيذة."],
v:["شتاء","سماء","ثلج","ثقيل","معطف","حذاء","نار","شوربة"],
tf:[["في الشتاء السماء زرقاء دائما",false],["يلبسون ملابس ثقيلة",true],["يجلسون قرب النار",true],["الأم تطبخ سلطة باردة",false]]},

{id:34,th:3,ta:"فصل الربيع",tf_:"Le printemps",
p:["الربيع هو أجمل فصول السنة. في الربيع يكون الطقس معتدلا، لا حارا ولا باردا. تخرج الأزهار في الحدائق والحقول.",
"في الربيع تصير الأشجار خضراء وترجع الطيور من البلاد البعيدة. الناس يخرجون إلى الحدائق ويجلسون تحت الأشجار.",
"في الربيع الماضي ذهبنا في رحلة إلى الجبل. مشينا بين الأزهار وأكلنا تحت شجرة كبيرة. كان يوما جميلا جدا."],
v:["ربيع","معتدل","أخضر","طير","بلاد","بين","يخرج","فصول"],
tf:[["الطقس في الربيع حار جدا",false],["الأشجار تصير خضراء",true],["الطيور ترجع في الربيع",true],["ذهبوا في رحلة إلى البحر",false]]},

{id:35,th:3,ta:"في المطار",tf_:"À l'aéroport",
p:["سافر عمي إلى فرنسا للعمل. ذهبنا معه إلى المطار في الصباح. المطار كبير جدا وفيه ناس من كل العالم.",
"حمل عمي حقيبتين كبيرتين. وقفنا معه في الطابور ثم أعطى جواز سفره وتذكرته للموظفة. قالت له: الطائرة ستقلع بعد ساعتين.",
"قبل الدخول سلم عمي علينا وقال: سأتصل بكم من هناك. كانت أمي حزينة قليلا. شاهدنا الطائرة من النافذة الكبيرة وهي تطير."],
v:["عم","مطار","جواز","طائرة","تقلع","يتصل","حزين","يطير"],
tf:[["سافر العم إلى فرنسا",true],["حمل حقيبة واحدة",false],["الطائرة تقلع بعد ساعتين",true],["كانت الأم سعيدة جدا",false]]},

{id:36,th:3,ta:"في الفندق",tf_:"À l'hôtel",
p:["وصلنا إلى الفندق في المساء. الفندق كبير وجميل وأمامه حديقة. استقبلنا موظف طيب وأعطانا مفتاح الغرفة.",
"غرفتنا في الطابق الثالث. فيها سريران كبيران ونافذة تطل على البحر. الحمام نظيف والماء ساخن.",
"في الصباح أكلنا الفطور في مطعم الفندق. كان الفطور لذيذا: خبز وجبن وبيض وعسل وعصير. ثم خرجنا لنشاهد المدينة."],
v:["يستقبل","مفتاح","طابق","ثالث","يطل","حمام","ساخن","يشاهد"],
tf:[["وصلوا في الصباح",false],["الغرفة في الطابق الثالث",true],["النافذة تطل على البحر",true],["كان الفطور سيئا",false]]},

{id:37,th:3,ta:"يوم في الريف",tf_:"Un jour à la campagne",
p:["يوم الأحد الماضي ذهبنا إلى الريف عند عمي. الطريق طويل لكنه جميل. شاهدنا من السيارة الحقول الخضراء والجبال.",
"بيت عمي صغير وأمامه حقل كبير. لعبت مع أولاد عمي بين الأشجار. شربنا حليبا طازجا وأكلنا خبزا ساخنا مع زيت الزيتون.",
"في المساء جلسنا كلنا تحت شجرة كبيرة. حكى عمي قصصا مضحكة وضحكنا كثيرا. رجعنا إلى المدينة في الليل تعبانين وسعداء."],
v:["ريف","طريق","زيت","مضحك","أولاد","طازج","كلنا","يرجع"],
tf:[["ذهبوا إلى الريف يوم السبت",false],["شربوا حليبا طازجا",true],["حكى العم قصصا مضحكة",true],["رجعوا في الصباح",false]]},

{id:38,th:3,ta:"يوم ممطر",tf_:"Un jour de pluie",
p:["استيقظت اليوم وسمعت صوت المطر. نظرت من النافذة: السماء رمادية والشارع مليء بالماء. قالت أمي: البس معطفك وخذ المظلة.",
"خرجت إلى المدرسة تحت المطر. كان الجو باردا والناس يجرون في الشوارع. وصلت إلى الصف وملابسي مبللة قليلا.",
"في المساء جلست في البيت قرب النافذة. شربت شايا ساخنا وقرأت قصة. أنا أحب صوت المطر عندما أكون في البيت."],
v:["يسمع","صوت","رمادي","مظلة","جو","يجري","مبلل","عندما"],
tf:[["كانت السماء زرقاء",false],["أخذ المظلة",true],["وصل وملابسه مبللة قليلا",true],["في المساء خرج إلى الحديقة",false]]},

{id:39,th:3,ta:"رحلة بالقطار",tf_:"Voyage en train",
p:["سافرت مع أبي بالقطار إلى العاصمة لزيارة عمتي. خرجنا من البيت مبكرا وركبنا القطار في الساعة الثامنة.",
"جلست قرب النافذة وشاهدت الحقول والقرى والجبال. القطار سريع ومريح. أكلنا في القطار خبزا وجبنا وشربنا الشاي.",
"وصلنا إلى العاصمة في الظهر. كانت عمتي تنتظرنا في المحطة. سلمت علينا وأخذتنا إلى بيتها. بقينا عندها ثلاثة أيام جميلة."],
v:["عاصمة","زيارة","عمة","ينتظر","يأخذ","يبقى","ثلاثة","مريح"],
tf:[["سافرا بالحافلة",false],["ركبا القطار في الساعة الثامنة",true],["كانت العمة في المحطة",true],["بقيا أسبوعا كاملا",false]]},

{id:40,th:3,ta:"العطلة الصيفية",tf_:"Les vacances d'été",
p:["انتهت المدرسة وبدأت العطلة الصيفية. أنا سعيد جدا لأن العطلة طويلة: ثلاثة أشهر كاملة. عندي برنامج جميل.",
"في الشهر الأول سأبقى في المدينة وألعب مع أصدقائي. في الشهر الثاني سنسافر إلى القرية عند جدي. وفي الشهر الثالث سنذهب إلى البحر.",
"أريد أيضا أن أقرأ كتبا كثيرة وأن أتعلم السباحة جيدا. العطلة فرصة للراحة واللعب والتعلم. أتمنى لكم عطلة سعيدة!"],
v:["ينتهي","يبدأ","برنامج","أول","ثاني","سباحة","فرصة","راحة"],
tf:[["العطلة شهران",false],["في الشهر الثاني سيذهبون إلى القرية",true],["يريد أن يتعلم السباحة",true],["العطلة قصيرة",false]]},
/* ============ THEME 4 : LOISIRS ET SANTE ============ */
{id:41,th:4,ta:"أحب الرياضة",tf_:"J'aime le sport",
p:["أنا أحب الرياضة كثيرا. ألعب كرة القدم مع أصدقائي كل يوم سبت في ملعب الحي. فريقنا اسمه النجوم.",
"في الأسبوع الماضي لعبنا ضد فريق المدرسة الأخرى. كانت المباراة صعبة لكننا فزنا بهدفين. كنت سعيدا جدا.",
"الرياضة مفيدة للجسم والعقل. أبي يمشي كل صباح وأخي يسبح في المسبح. أمي تقول: العقل السليم في الجسم السليم."],
v:["كرة","فريق","نجم","مباراة","يفوز","هدف","جسم","عقل"],
tf:[["يلعب كرة القدم يوم الأحد",false],["فاز فريقه بهدفين",true],["الأب يمشي كل صباح",true],["اسم الفريق الأسود",false]]},

{id:42,th:4,ta:"في المطبخ مع أمي",tf_:"En cuisine avec maman",
p:["أمي تطبخ أحسن طعام في العالم. اليوم ساعدتها في المطبخ لأن عندنا ضيوفا في المساء. طبخنا معا دجاجا بالأرز.",
"غسلت أنا الخضار وقطعت أمي اللحم. وضعنا البصل والطماطم في القدر مع قليل من الزيت والملح. كانت رائحة الطعام جميلة.",
"في المساء جاء الضيوف وأكلوا معنا. قالوا كلهم: الطعام لذيذ جدا! كانت أمي سعيدة وأنا فخور لأنني ساعدتها."],
v:["يغسل","يقطع","بصل","قدر","ملح","رائحة","يضع","قليل"],
tf:[["طبخا سمكا",false],["غسل الابن الخضار",true],["وضعا البصل في القدر",true],["قال الضيوف إن الطعام سيئ",false]]},

{id:43,th:4,ta:"قطتنا الصغيرة",tf_:"Notre petite chatte",
p:["عندنا في البيت قطة صغيرة اسمها لولو. لونها أبيض وعيناها خضراوان. جاءت إلى بيتنا قبل سنة وهي الآن من العائلة.",
"لولو تحب الحليب والسمك. تنام كثيرا في النهار وتلعب في الليل. أحيانا تجلس على النافذة وتنظر إلى الطيور في الحديقة.",
"أخي الصغير يوسف يحب لولو كثيرا. يلعب معها كل يوم بعد المدرسة. عندما يجلس ليقرأ، تنام لولو بجانبه."],
v:["قطة","لون","نهار","بجانب","يحب","خضراوان","طيور","سنة"],
tf:[["لون القطة أسود",false],["تحب القطة السمك",true],["تنام في النهار",true],["جاءت قبل شهر",false]]},

{id:44,th:4,ta:"حديقة جدي",tf_:"Le jardin de mon grand-père",
p:["عند جدي حديقة جميلة وراء بيته. فيها أشجار برتقال وليمون وزيتون. في وسط الحديقة بئر قديمة.",
"يعمل جدي في حديقته كل صباح. يسقي الأشجار وينظف الأرض ويزرع الخضار: طماطم وبطاطس وبصل. يقول جدي: الحديقة مثل الطفل، تحتاج إلى الحب.",
"في الصيف نأكل الفواكه من الحديقة مباشرة. البرتقال حلو والليمون كثير. أحب أن أساعد جدي وأن أتعلم منه."],
v:["وراء","برتقال","ليمون","بئر","يسقي","يزرع","أرض","حلو"],
tf:[["الحديقة أمام البيت",false],["في الحديقة بئر",true],["يزرع الجد الخضار",true],["البرتقال حامض",false]]},

{id:45,th:4,ta:"مساء أمام التلفاز",tf_:"Une soirée devant la télé",
p:["في مساء الجمعة تجلس عائلتنا أمام التلفاز. أبي يحب الأخبار وأمي تحب الأفلام القديمة. أنا وأخي نحب الرياضة والرسوم المتحركة.",
"أمس شاهدنا فيلما جميلا عن البحر. كان الفيلم طويلا لكنه ممتع. أكلنا الفواكه وشربنا الشاي أمام التلفاز.",
"لكن أمي تقول دائما: التلفاز قليلا والقراءة كثيرا. لذلك نقرأ كل مساء قبل النوم. الكتاب صديق لا يتعب."],
v:["تلفاز","خبر","رسوم","ممتع","لذلك","نوم","يتعب","قبل"],
tf:[["الأب يحب الأفلام القديمة",false],["شاهدوا فيلما عن البحر",true],["الأم تقول اقرأوا كثيرا",true],["الفيلم كان قصيرا",false]]},

{id:46,th:4,ta:"هاتف أبي",tf_:"Le téléphone de papa",
p:["اشترى أبي هاتفا جديدا الأسبوع الماضي. الهاتف صغير وسريع وفيه كاميرا جيدة. أبي سعيد به كثيرا.",
"يستعمل أبي الهاتف للعمل: يقرأ رسائله ويتصل بأصدقائه. أمي تستعمله أحيانا لتتكلم مع خالتي في فرنسا. نشاهد صورها على الشاشة.",
"لكن أبي يقول لنا: الهاتف للكبار وليس للأطفال. ساعة واحدة في اليوم تكفي. الأفضل أن تلعبوا في الحديقة وتقرأوا الكتب."],
v:["هاتف","كاميرا","يستعمل","خالة","شاشة","يكفي","أفضل","ساعة"],
tf:[["اشترى الأب حاسوبا",false],["في الهاتف كاميرا جيدة",true],["الأم تتكلم مع أختها في فرنسا",true],["يقول الأب الهاتف للأطفال",false]]},

{id:47,th:4,ta:"العيد في بيتنا",tf_:"La fête à la maison",
p:["غدا يوم العيد. أمي نظفت البيت وحضرت الحلوى. اشترى لنا أبي ملابس جديدة: قميصا أبيض لي وفستانا أحمر لأختي.",
"في صباح العيد نستيقظ مبكرين ونلبس ملابسنا الجديدة. نذهب مع أبي إلى المسجد ثم نزور الجيران والعائلة.",
"في يوم العيد يعطي الكبار الأطفال نقودا وحلوى. نأكل كلنا عند جدتي في الظهر. العيد يوم فرح للصغار والكبار."],
v:["غدا","عيد","قميص","أحمر","نقود","فرح","صغار","كبار"],
tf:[["اشترى الأب ملابس قديمة",false],["الفستان أحمر",true],["يأكلون عند الجدة",true],["العيد يوم حزن",false]]},

{id:48,th:4,ta:"رأس السنة",tf_:"Le nouvel an",
p:["غدا تبدأ سنة جديدة. في مدينتنا يحتفل الناس في الساحة الكبيرة. تكون الشوارع مليئة بالأنوار الملونة.",
"في بيتنا نجلس كل العائلة معا في الليل. نأكل عشاء جميلا ونتكلم عن السنة الماضية. كل واحد يقول ماذا يريد في السنة الجديدة.",
"أنا قلت: أريد أن أنجح في المدرسة وأن أتعلم السباحة. قالت أمي: وأنا أريد الصحة والسعادة لكل العائلة. سنة سعيدة للجميع!"],

"أُمِّي تَشْتَرِي الْخُضَارَ وَالْفَوَاكِهَ: طَمَاطِمُ وَبَطَاطِسُ وَتُفَّاحٌ وَمَوْزٌ. أَنَا أَحْمِلُ الْأَكْيَاسَ. ثُمَّ نَشْتَرِي اللَّحْمَ وَالْخُبْزَ مِنَ الدُّكَّانِ.",
"قَبْلَ الرُّجُوعِ نَشْرَبُ عَصِيرًا بَارِدًا. أُمِّي تَشْتَرِي لِي أَحْيَانًا حَلْوَى صَغِيرَةً. نَرْجِعُ إِلَى الْبَيْتِ فِي الظُّهْرِ وَنَحْنُ سُعَدَاءُ."],
tf:["يَذْهَبَانِ إِلَى السُّوقِ يَوْمَ الْجُمُعَةِ","يَرْكَبَانِ الْحَافِلَةَ","الِابْنُ يَحْمِلُ الْأَكْيَاسَ","يَرْجِعَانِ فِي الْمَسَاءِ"]},
11:{ta:"فِي السُّوقِ",
p:["السُّوقُ فِي مَدِينَتِنَا قَدِيمٌ وَكَبِيرٌ. يَفْتَحُ السُّوقُ فِي الصَّبَاحِ وَيُغْلِقُ فِي الْمَسَاءِ. فِيهِ دَكَاكِينُ كَثِيرَةٌ وَنَاسٌ مِنْ كُلِّ مَكَانٍ.",
"فِي السُّوقِ تَجِدُ كُلَّ شَيْءٍ: الْخُضَارَ وَالْفَوَاكِهَ وَاللَّحْمَ وَالسَّمَكَ وَالْمَلَابِسَ. الْأَسْعَارُ رَخِيصَةٌ وَالْبَاعَةُ يَتَكَلَّمُونَ بِصَوْتٍ عَالٍ.",
"ذَهَبْتُ أَمْسِ إِلَى السُّوقِ مَعَ أَبِي. اشْتَرَيْنَا سَمَكًا طَازَجًا وَخُبْزًا سَاخِنًا. ثُمَّ شَرِبْنَا الشَّايَ فِي مَقْهًى صَغِيرٍ قُرْبَ الْبَابِ."],
tf:["السُّوقُ جَدِيدٌ","الْأَسْعَارُ رَخِيصَةٌ","اشْتَرَيَا لَحْمًا","شَرِبَا الشَّايَ فِي مَقْهًى"]},
12:{ta:"فِي الْمَطْعَمِ",
p:["يَوْمَ الْخَمِيسِ ذَهَبْنَا إِلَى مَطْعَمٍ فِي وَسَطِ الْمَدِينَةِ. الْمَطْعَمُ جَمِيلٌ وَنَظِيفٌ وَالطَّاوِلَاتُ كَبِيرَةٌ. جَلَسْنَا قُرْبَ النَّافِذَةِ.",
"جَاءَ النَّادِلُ وَأَعْطَانَا قَائِمَةَ الطَّعَامِ. طَلَبَ أَبِي دَجَاجًا مَعَ الْأَرُزِّ وَطَلَبَتْ أُمِّي سَمَكًا. أَنَا طَلَبْتُ لَحْمًا مَشْوِيًّا وَسَلَطَةً.",
"الطَّعَامُ كَانَ لَذِيذًا جِدًّا. بَعْدَ الْأَكْلِ شَرِبْنَا الشَّايَ وَأَكَلْنَا حَلْوَى. دَفَعَ أَبِي الْحِسَابَ وَخَرَجْنَا سُعَدَاءَ."],
tf:["ذَهَبُوا إِلَى الْمَطْعَمِ يَوْمَ الْجُمُعَةِ","جَلَسُوا قُرْبَ النَّافِذَةِ","الْأُمُّ طَلَبَتْ دَجَاجًا","الْأَبُ دَفَعَ الْحِسَابَ"]},
13:{ta:"فِي مَحَطَّةِ الْقِطَارِ",
p:["وَصَلْنَا إِلَى مَحَطَّةِ الْقِطَارِ فِي السَّاعَةِ التَّاسِعَةِ صَبَاحًا. الْمَحَطَّةُ كَبِيرَةٌ وَفِيهَا نَاسٌ كَثِيرُونَ. بَعْضُهُمْ يَجْرِي لِأَنَّ الْقِطَارَ قَرِيبٌ.",
"ذَهَبَ أَبِي إِلَى الشُّبَّاكِ وَاشْتَرَى تَذْكَرَتَيْنِ إِلَى الْمَدِينَةِ الْكَبِيرَةِ. انْتَظَرْنَا الْقِطَارَ عَلَى الرَّصِيفِ. بَعْدَ عَشْرِ دَقَائِقَ وَصَلَ الْقِطَارُ.",
"رَكِبْنَا الْقِطَارَ وَجَلَسْنَا قُرْبَ النَّافِذَةِ. الْقِطَارُ سَرِيعٌ وَمُرِيحٌ. شَاهَدْتُ مِنَ النَّافِذَةِ الْحُقُولَ وَالْقُرَى الصَّغِيرَةَ."],
tf:["وَصَلُوا فِي الْمَسَاءِ","اشْتَرَى الْأَبُ تَذْكَرَتَيْنِ","انْتَظَرُوا سَاعَةً كَامِلَةً","الْقِطَارُ سَرِيعٌ وَمُرِيحٌ"]},
14:{ta:"عِنْدَ الطَّبِيبِ",
p:["أَمْسِ كُنْتُ مَرِيضًا. كَانَ رَأْسِي يُؤْلِمُنِي وَكَانَتْ حَرَارَتِي عَالِيَةً. أَخَذَتْنِي أُمِّي إِلَى الطَّبِيبِ فِي الصَّبَاحِ.",
"انْتَظَرْنَا قَلِيلًا فِي غُرْفَةِ الِانْتِظَارِ. ثُمَّ دَخَلْنَا. سَأَلَنِي الطَّبِيبُ: مَاذَا تَشْعُرُ؟ قُلْتُ لَهُ: رَأْسِي يُؤْلِمُنِي وَأَنَا تَعْبَانُ.",
"فَحَصَنِي الطَّبِيبُ وَكَتَبَ لِي دَوَاءً. قَالَ: اشْرَبْ مَاءً كَثِيرًا وَنَمْ مُبَكِّرًا. الْيَوْمَ أَنَا أَحْسَنُ وَالْحَمْدُ لِلَّهِ."],
tf:["كَانَ الْوَلَدُ مَرِيضًا","ذَهَبَ إِلَى الطَّبِيبِ فِي الْمَسَاءِ","كَتَبَ الطَّبِيبُ دَوَاءً","الْيَوْمَ هُوَ تَعْبَانُ"]},
15:{ta:"فِي الْمَكْتَبَةِ",
p:["فِي مَدِينَتِنَا مَكْتَبَةٌ عَامَّةٌ كَبِيرَةٌ. الْمَكْتَبَةُ مَفْتُوحَةٌ كُلَّ يَوْمٍ مِنَ الصَّبَاحِ إِلَى الْمَسَاءِ. فِيهَا كُتُبٌ كَثِيرَةٌ بِلُغَاتٍ مُخْتَلِفَةٍ.",
"أَذْهَبُ إِلَى الْمَكْتَبَةِ كُلَّ يَوْمِ أَرْبِعَاءَ بَعْدَ الْمَدْرَسَةِ. أَقْرَأُ الْقِصَصَ وَأَكْتُبُ وَاجِبَاتِي هُنَاكَ. الْمَكَانُ هَادِئٌ وَالْكَرَاسِي مُرِيحَةٌ.",
"الْمُوَظَّفَةُ فِي الْمَكْتَبَةِ اسْمُهَا سَارَةُ. هِيَ امْرَأَةٌ طَيِّبَةٌ وَتُسَاعِدُنِي دَائِمًا. أَمْسِ أَخَذْتُ مِنْهَا كِتَابًا جَدِيدًا عَنِ الْحَيَوَانَاتِ."],
tf:["الْمَكْتَبَةُ مَفْتُوحَةٌ كُلَّ يَوْمٍ","يَذْهَبُ إِلَيْهَا يَوْمَ الْخَمِيسِ","الْمُوَظَّفَةُ اسْمُهَا سَارَةُ","أَخَذَ كِتَابًا عَنِ التَّارِيخِ"]},
16:{ta:"فِي الْحَدِيقَةِ الْعَامَّةِ",
p:["قُرْبَ بَيْتِنَا حَدِيقَةٌ عَامَّةٌ وَاسِعَةٌ. فِيهَا أَشْجَارٌ عَالِيَةٌ وَأَزْهَارٌ جَمِيلَةٌ وَمَلْعَبٌ لِلْأَطْفَالِ. فِي وَسَطِ الْحَدِيقَةِ بُحَيْرَةٌ صَغِيرَةٌ.",
"يَوْمَ السَّبْتِ ذَهَبْتُ إِلَى الْحَدِيقَةِ مَعَ أَخِي الصَّغِيرِ. لَعِبَ يُوسُفُ فِي الْمَلْعَبِ وَأَنَا جَلَسْتُ عَلَى كُرْسِيٍّ تَحْتَ شَجَرَةٍ وَقَرَأْتُ كِتَابِي.",
"فِي الظُّهْرِ أَكَلْنَا خُبْزًا وَجُبْنًا وَشَرِبْنَا الْعَصِيرَ. شَاهَدْنَا الْبَطَّ فِي الْبُحَيْرَةِ. رَجَعْنَا إِلَى الْبَيْتِ فِي الْمَسَاءِ تَعْبَانِينَ وَسُعَدَاءَ."],
tf:["فِي وَسَطِ الْحَدِيقَةِ بُحَيْرَةٌ","ذَهَبَ مَعَ أُخْتِهِ","قَرَأَ كِتَابَهُ تَحْتَ شَجَرَةٍ","رَجَعَا فِي الصَّبَاحِ"]},
17:{ta:"فِي الْمَقْهَى",
p:["فِي شَارِعِنَا مَقْهًى صَغِيرٌ وَقَدِيمٌ. صَاحِبُ الْمَقْهَى رَجُلٌ طَيِّبٌ اسْمُهُ أَبُو كَرِيمٍ. الْمَقْهَى مَفْتُوحٌ مِنَ الصَّبَاحِ إِلَى اللَّيْلِ.",
"يَجْلِسُ الرِّجَالُ فِي الْمَقْهَى وَيَشْرَبُونَ الشَّايَ وَالْقَهْوَةَ. بَعْضُهُمْ يَقْرَأُ الْجَرِيدَةَ وَبَعْضُهُمْ يَتَكَلَّمُ مَعَ أَصْدِقَائِهِ. الْمَكَانُ دَائِمًا مَلِيءٌ بِالنَّاسِ.",
"يَذْهَبُ جَدِّي إِلَى هَذَا الْمَقْهَى كُلَّ مَسَاءٍ. يَشْرَبُ قَهْوَتَهُ وَيَتَكَلَّمُ مَعَ أَصْدِقَائِهِ الْقُدَامَى. أَحْيَانًا أَذْهَبُ مَعَهُ وَأَشْرَبُ عَصِيرًا."],
tf:["صَاحِبُ الْمَقْهَى اسْمُهُ أَبُو كَرِيمٍ","الْمَقْهَى يُغْلِقُ فِي الظُّهْرِ","الْجَدُّ يَذْهَبُ كُلَّ مَسَاءٍ","الْحَفِيدُ يَشْرَبُ الْقَهْوَةَ"]},
18:{ta:"سَائِقُ التَّاكْسِي",
p:["كَانَ الْمَطَرُ قَوِيًّا أَمْسِ وَلَمْ تَأْتِ الْحَافِلَةُ. وَقَفَتْ أُمِّي فِي الشَّارِعِ وَطَلَبَتْ تَاكْسِي. تَوَقَّفَ تَاكْسِي أَصْفَرُ بَعْدَ دَقَائِقَ.",
"سَائِقُ التَّاكْسِي رَجُلٌ كَبِيرٌ فِي السِّنِّ. سَأَلَنَا: إِلَى أَيْنَ؟ قَالَتْ أُمِّي: إِلَى الْمُسْتَشْفَى مِنْ فَضْلِكَ، لِأَنَّ جَدَّتِي مَرِيضَةٌ هُنَاكَ.",
"كَانَ السَّائِقُ طَيِّبًا وَسَرِيعًا. تَكَلَّمَ مَعَنَا عَنِ الْمَدِينَةِ وَعَنْ عَمَلِهِ. وَصَلْنَا بَعْدَ رُبْعِ سَاعَةٍ. دَفَعَتْ أُمِّي لَهُ وَشَكَرَتْهُ."],
tf:["كَانَ الْجَوُّ جَمِيلًا","التَّاكْسِي أَصْفَرُ","ذَهَبَا إِلَى الْمُسْتَشْفَى","السَّائِقُ شَابٌّ"]},
19:{ta:"فِي الْبَرِيدِ",
p:["أَرْسَلَتْ جَدَّتِي رِسَالَةً إِلَى خَالِي فِي فَرَنْسَا. ذَهَبْتُ مَعَهَا إِلَى مَكْتَبِ الْبَرِيدِ فِي وَسَطِ الْمَدِينَةِ. الْمَكْتَبُ مَلِيءٌ بِالنَّاسِ.",
"انْتَظَرْنَا فِي الطَّابُورِ أَمَامَ الشُّبَّاكِ. أَعْطَتْ جَدَّتِي الرِّسَالَةَ لِلْمُوَظَّفِ. سَأَلَهَا الْمُوَظَّفُ: عَادِيَةٌ أَمْ سَرِيعَةٌ؟ قَالَتْ: سَرِيعَةٌ مِنْ فَضْلِكَ.",
"دَفَعَتْ جَدَّتِي ثَمَنَ الطَّابَعِ وَخَرَجْنَا. فِي الطَّرِيقِ اشْتَرَتْ لِي جَدَّتِي عَصِيرًا. قَالَتْ لِي: الرِّسَالَةُ سَتَصِلُ بَعْدَ أُسْبُوعٍ."],
tf:["الْخَالُ يَسْكُنُ فِي فَرَنْسَا","الْمَكْتَبُ فَارِغٌ","اخْتَارَتِ الْجَدَّةُ رِسَالَةً عَادِيَةً","الرِّسَالَةُ سَتَصِلُ بَعْدَ أُسْبُوعٍ"]},
20:{ta:"مَدِينَتِي",
p:["أَنَا أَسْكُنُ فِي مَدِينَةٍ جَمِيلَةٍ قُرْبَ الْبَحْرِ. الْمَدِينَةُ لَيْسَتْ كَبِيرَةً وَلَكِنَّهَا نَظِيفَةٌ وَهَادِئَةٌ. الطَّقْسُ فِيهَا جَمِيلٌ فِي كُلِّ الْفُصُولِ.",
"فِي وَسَطِ الْمَدِينَةِ سَاحَةٌ قَدِيمَةٌ وَسُوقٌ كَبِيرٌ وَمَسْجِدٌ جَمِيلٌ. قُرْبَ الْبَحْرِ مَطَاعِمُ وَمَقَاهٍ كَثِيرَةٌ. النَّاسُ هُنَا طَيِّبُونَ وَيُحِبُّونَ الضُّيُوفَ.",
"فِي الْمَسَاءِ يَمْشِي النَّاسُ قُرْبَ الْبَحْرِ. الْأَطْفَالُ يَلْعَبُونَ عَلَى الرَّمْلِ وَالْكِبَارُ يَجْلِسُونَ فِي الْمَقَاهِي. أَنَا فَخُورٌ بِمَدِينَتِي."],
tf:["الْمَدِينَةُ قُرْبَ الْبَحْرِ","الْمَدِينَةُ كَبِيرَةٌ جِدًّا","النَّاسُ يُحِبُّونَ الضُّيُوفَ","الْأَطْفَالُ يَلْعَبُونَ فِي السَّاحَةِ"]},
21:{ta:"عَمَلُ أَبِي",
p:["أَبِي طَبِيبٌ فِي الْمُسْتَشْفَى الْكَبِيرِ. يَخْرُجُ مِنَ الْبَيْتِ فِي السَّاعَةِ السَّابِعَةِ صَبَاحًا وَيَرْجِعُ فِي الْمَسَاءِ. عَمَلُهُ صَعْبٌ لَكِنَّهُ يُحِبُّهُ.",
"فِي الْمُسْتَشْفَى يَفْحَصُ أَبِي الْمَرْضَى وَيَكْتُبُ لَهُمُ الدَّوَاءَ. يَقُولُ أَبِي دَائِمًا: أَنَا سَعِيدٌ عِنْدَمَا أُسَاعِدُ النَّاسَ.",
"فِي يَوْمِ الْعُطْلَةِ يَبْقَى أَبِي مَعَنَا فِي الْبَيْتِ. نَأْكُلُ مَعًا وَنَتَكَلَّمُ وَنَضْحَكُ. أَنَا أُرِيدُ أَنْ أَصِيرَ طَبِيبًا مِثْلَ أَبِي."],
tf:["الْأَبُ مُعَلِّمٌ","يَرْجِعُ الْأَبُ فِي الْمَسَاءِ","الْأَبُ يُحِبُّ عَمَلَهُ","الِابْنُ يُرِيدُ أَنْ يَصِيرَ مُهَنْدِسًا"]},
22:{ta:"جَدَّتِي",
p:["جَدَّتِي امْرَأَةٌ كَبِيرَةٌ فِي السِّنِّ لَكِنَّهَا نَشِيطَةٌ. تَسْكُنُ فِي بَيْتٍ صَغِيرٍ قَرِيبٍ مِنْ بَيْتِنَا. شَعْرُهَا أَبْيَضُ وَعَيْنَاهَا جَمِيلَتَانِ.",
"جَدَّتِي تَطْبُخُ أَحْسَنَ طَعَامٍ فِي الْعَالَمِ. كُلَّ يَوْمِ جُمُعَةٍ نَأْكُلُ عِنْدَهَا الْكُسْكُسَ أَوِ الْأَرُزَّ بِاللَّحْمِ. بَيْتُهَا دَائِمًا مَلِيءٌ بِالضُّيُوفِ.",
"فِي الْمَسَاءِ تَجْلِسُ جَدَّتِي مَعَنَا وَتَحْكِي لَنَا قِصَصًا قَدِيمَةً عَنِ الْقَرْيَةِ وَعَنْ جَدِّي. أَنَا أُحِبُّ جَدَّتِي كَثِيرًا وَأَزُورُهَا كُلَّ أُسْبُوعٍ."],
tf:["الْجَدَّةُ تَسْكُنُ بَعِيدًا","شَعْرُ الْجَدَّةِ أَبْيَضُ","تَطْبُخُ الْكُسْكُسَ يَوْمَ الْجُمُعَةِ","تَحْكِي قِصَصًا عَنِ الْمَدْرَسَةِ"]},
23:{ta:"الْجَارُ الْجَدِيدُ",
p:["فِي الشَّهْرِ الْمَاضِي جَاءَ جَارٌ جَدِيدٌ إِلَى حَيِّنَا. اسْمُهُ سَمِيرٌ وَهُوَ مُهَنْدِسٌ شَابٌّ. سَكَنَ فِي الْبَيْتِ الْأَبْيَضِ أَمَامَ بَيْتِنَا.",
"فِي الْبِدَايَةِ لَمْ نَعْرِفْهُ. ثُمَّ جَاءَ يَوْمَ السَّبْتِ وَسَلَّمَ عَلَى أَبِي. تَكَلَّمَ الرَّجُلَانِ طَوِيلًا أَمَامَ الْبَابِ وَشَرِبَا الشَّايَ مَعًا.",
"الْآنَ سَمِيرٌ صَدِيقٌ لِلْعَائِلَةِ. يَأْكُلُ عِنْدَنَا أَحْيَانًا وَيُسَاعِدُ أَبِي فِي الْحَدِيقَةِ. جَدَّتِي تَقُولُ: الْجَارُ قَبْلَ الدَّارِ."],
tf:["الْجَارُ الْجَدِيدُ طَبِيبٌ","اسْمُهُ سَمِيرٌ","سَكَنَ فِي الْبَيْتِ الْأَبْيَضِ","جَاءَ قَبْلَ سَنَةٍ"]},
24:{ta:"مُعَلِّمَتِي",
p:["مُعَلِّمَةُ اللُّغَةِ الْعَرَبِيَّةِ اسْمُهَا مَرْيَمُ. هِيَ امْرَأَةٌ شَابَّةٌ وَذَكِيَّةٌ. تَعْمَلُ فِي مَدْرَسَتِنَا مُنْذُ خَمْسِ سَنَوَاتٍ.",
"الْمُعَلِّمَةُ مَرْيَمُ تَشْرَحُ الدَّرْسَ بِبُطْءٍ وَبِصَوْتٍ وَاضِحٍ. عِنْدَمَا لَا نَفْهَمُ، تَشْرَحُ مَرَّةً ثَانِيَةً وَتَضْحَكُ مَعَنَا. كُلُّ الطُّلَّابِ يُحِبُّونَهَا.",
"أَمْسِ قَالَتْ لِي الْمُعَلِّمَةُ: أَنْتَ طَالِبٌ جَيِّدٌ وَقِرَاءَتُكَ أَحْسَنُ مِنْ قَبْلُ. رَجَعْتُ إِلَى الْبَيْتِ سَعِيدًا وَأَخْبَرْتُ أُمِّي."],
tf:["الْمُعَلِّمَةُ تُعَلِّمُ الرِّيَاضِيَّاتِ","تَشْرَحُ بِصَوْتٍ وَاضِحٍ","الطُّلَّابُ يُحِبُّونَهَا","رَجَعَ الطَّالِبُ حَزِينًا"]},
25:{ta:"رِسَالَةٌ إِلَى صَدِيقِي",
p:["صَدِيقِي الْعَزِيزُ كَرِيمٌ، كَيْفَ حَالُكَ؟ أَنَا بِخَيْرٍ وَالْحَمْدُ لِلَّهِ. أَكْتُبُ لَكَ هَذِهِ الرِّسَالَةَ مِنْ مَدِينَتِي الْجَدِيدَةِ.",
"نَحْنُ الْآنَ نَسْكُنُ قُرْبَ الْبَحْرِ. الْمَدِينَةُ جَمِيلَةٌ وَالنَّاسُ طَيِّبُونَ. مَدْرَسَتِي الْجَدِيدَةُ كَبِيرَةٌ وَعِنْدِي أَصْدِقَاءُ جُدُدٌ. لَكِنَّنِي أُفَكِّرُ فِيكَ كَثِيرًا.",
"كَيْفَ الْعَائِلَةُ؟ وَكَيْفَ الْمَدْرَسَةُ؟ اكْتُبْ لِي قَرِيبًا مِنْ فَضْلِكَ. سَأَزُورُكَ فِي الْعُطْلَةِ الصَّيْفِيَّةِ إِنْ شَاءَ اللَّهُ. صَدِيقُكَ الْوَفِيُّ، أَحْمَدُ."],
tf:["أَحْمَدُ يَكْتُبُ مِنْ مَدِينَتِهِ الْقَدِيمَةِ","الْمَدِينَةُ الْجَدِيدَةُ قُرْبَ الْبَحْرِ","عِنْدَ أَحْمَدَ أَصْدِقَاءُ جُدُدٌ","سَيَزُورُ كَرِيمَ فِي الشِّتَاءِ"]},
26:{ta:"أَخِي الطَّالِبُ",
p:["أَخِي الْكَبِيرُ اسْمُهُ عُمَرُ وَعُمْرُهُ عِشْرُونَ سَنَةً. هُوَ طَالِبٌ فِي الْجَامِعَةِ وَيَدْرُسُ الطِّبَّ. يُرِيدُ أَنْ يَصِيرَ طَبِيبًا مِثْلَ أَبِي.",
"عُمَرُ يَدْرُسُ كَثِيرًا. يَقْرَأُ الْكُتُبَ فِي اللَّيْلِ وَيَكْتُبُ فِي دَفَاتِرِهِ. فِي الصَّبَاحِ يَذْهَبُ إِلَى الْجَامِعَةِ بِالْحَافِلَةِ. أَحْيَانًا يَرْجِعُ مُتَأَخِّرًا.",
"فِي نِهَايَةِ الْأُسْبُوعِ يُسَاعِدُنِي عُمَرُ فِي وَاجِبَاتِي. يَشْرَحُ لِي الرِّيَاضِيَّاتِ بِبُطْءٍ. أَخِي ذَكِيٌّ وَطَيِّبٌ وَأَنَا فَخُورٌ بِهِ."],
tf:["عُمَرُ يَدْرُسُ الْهَنْدَسَةَ","عُمْرُهُ عِشْرُونَ سَنَةً","يَذْهَبُ إِلَى الْجَامِعَةِ بِالْقِطَارِ","يُسَاعِدُ أَخَاهُ الصَّغِيرَ"]},
27:{ta:"عِيدُ مِيلَادِ لَيْلَى",
p:["أَمْسِ كَانَ عِيدُ مِيلَادِ أُخْتِي لَيْلَى. صَارَتْ لَيْلَى عِشْرِينَ سَنَةً. حَضَّرَتْ أُمِّي حَفْلَةً صَغِيرَةً فِي الْبَيْتِ.",
"جَاءَ الْأَصْدِقَاءُ وَالْجِيرَانُ فِي الْمَسَاءِ. أَكَلْنَا كَعْكَةً كَبِيرَةً وَشَرِبْنَا الْعَصِيرَ. غَنَّيْنَا لِلَيْلَى وَأَعْطَيْنَاهَا الْهَدَايَا.",
"أَعْطَيْتُهَا أَنَا كِتَابًا جَمِيلًا لِأَنَّهَا تُحِبُّ الْقِرَاءَةَ. كَانَتْ لَيْلَى سَعِيدَةً جِدًّا وَشَكَرَتْنَا كُلَّنَا. كَانَتْ لَيْلَةً جَمِيلَةً."],
tf:["صَارَتْ لَيْلَى ثَلَاثِينَ سَنَةً","أَكَلُوا كَعْكَةً","أَعْطَاهَا أَخُوهَا كِتَابًا","كَانَتِ الْحَفْلَةُ فِي مَطْعَمٍ"]},
28:{ta:"عُرْسٌ فِي الْعَائِلَةِ",
p:["فِي الْأُسْبُوعِ الْمَاضِي تَزَوَّجَ خَالِي يُوسُفُ. كَانَ الْعُرْسُ فِي بَيْتِ جَدِّي فِي الْقَرْيَةِ. جَاءَتْ كُلُّ الْعَائِلَةِ مِنْ كُلِّ الْمُدُنِ.",
"لَبِسَ الرِّجَالُ مَلَابِسَ جَمِيلَةً وَلَبِسَتِ النِّسَاءُ فَسَاتِينَ مُلَوَّنَةً. كَانَ هُنَاكَ طَعَامٌ كَثِيرٌ: لَحْمٌ وَأَرُزٌّ وَكُسْكُسٌ وَحَلْوَى.",
"غَنَّى النَّاسُ وَرَقَصُوا حَتَّى اللَّيْلِ. كَانَ خَالِي سَعِيدًا جِدًّا وَزَوْجَتُهُ أَيْضًا. أَنَا لَعِبْتُ مَعَ أَوْلَادِ خَالَاتِي. كَانَ يَوْمًا لَا أَنْسَاهُ."],
tf:["تَزَوَّجَ الْخَالُ يُوسُفُ","كَانَ الْعُرْسُ فِي الْمَدِينَةِ","رَقَصَ النَّاسُ حَتَّى اللَّيْلِ","كَانَ الْخَالُ حَزِينًا"]},
29:{ta:"طِفْلٌ جَدِيدٌ فِي الْبَيْتِ",
p:["قَبْلَ شَهْرٍ جَاءَ طِفْلٌ جَدِيدٌ إِلَى عَائِلَتِنَا. وَلَدَتْ أُمِّي بِنْتًا صَغِيرَةً وَجَمِيلَةً. اسْمُهَا هُدَى وَهِيَ الْآنَ أُخْتِي الصَّغِيرَةُ.",
"هُدَى تَنَامُ كَثِيرًا وَتَبْكِي أَحْيَانًا فِي اللَّيْلِ. أُمِّي تَعْبَانَةٌ لَكِنَّهَا سَعِيدَةٌ. جَدَّتِي تَسْكُنُ مَعَنَا الْآنَ لِأَنَّهَا تُسَاعِدُ أُمِّي.",
"أَنَا أُحِبُّ أُخْتِي الصَّغِيرَةَ. أَنْظُرُ إِلَيْهَا عِنْدَمَا تَنَامُ وَأَلْعَبُ مَعَهَا عِنْدَمَا تَسْتَيْقِظُ. صَارَ بَيْتُنَا أَجْمَلَ مَعَهَا."],
tf:["وَلَدَتِ الْأُمُّ وَلَدًا","اسْمُ الْبِنْتِ هُدَى","الْجَدَّةُ تَسْكُنُ مَعَهُمُ الْآنَ","الْبِنْتُ لَا تَبْكِي أَبَدًا"]},
30:{ta:"جَدِّي فِي الْقَرْيَةِ",
p:["جَدِّي يَسْكُنُ فِي قَرْيَةٍ صَغِيرَةٍ بَعِيدَةٍ عَنِ الْمَدِينَةِ. بَيْتُهُ قَدِيمٌ وَجَمِيلٌ وَأَمَامَهُ حَقْلٌ كَبِيرٌ. عِنْدَ جَدِّي بَقَرَةٌ وَخَرُوفَانِ وَدَجَاجٌ كَثِيرٌ.",
"يَسْتَيْقِظُ جَدِّي مُبَكِّرًا كُلَّ يَوْمٍ. يَعْمَلُ فِي الْحَقْلِ فِي الصَّبَاحِ وَيَجْلِسُ تَحْتَ الشَّجَرَةِ فِي الظُّهْرِ. يَقُولُ جَدِّي: الْهَوَاءُ هُنَا نَظِيفٌ وَالْحَيَاةُ بَسِيطَةٌ.",
"نَزُورُ جَدِّي فِي كُلِّ عُطْلَةٍ. أَشْرَبُ الْحَلِيبَ الطَّازَجَ وَآكُلُ الْخُبْزَ السَّاخِنَ. أَلْعَبُ مَعَ الدَّجَاجِ وَأَمْشِي فِي الْحُقُولِ. أُحِبُّ الْقَرْيَةَ كَثِيرًا."],
tf:["الْجَدُّ يَسْكُنُ فِي الْمَدِينَةِ","عِنْدَ الْجَدِّ بَقَرَةٌ","يَقُولُ الْجَدُّ إِنَّ الْحَيَاةَ بَسِيطَةٌ","يَزُورُونَهُ مَرَّةً فِي السَّنَةِ"]},
31:{ta:"رِحْلَةٌ إِلَى الْبَحْرِ",
p:["فِي الصَّيْفِ الْمَاضِي سَافَرْنَا إِلَى مَدِينَةٍ قُرْبَ الْبَحْرِ. رَكِبْنَا السَّيَّارَةَ فِي الصَّبَاحِ وَوَصَلْنَا بَعْدَ ثَلَاثِ سَاعَاتٍ. كَانَ الطَّقْسُ حَارًّا وَجَمِيلًا.",
"سَكَنَّا فِي فُنْدُقٍ صَغِيرٍ أَمَامَ الْبَحْرِ. كُلَّ صَبَاحٍ كُنَّا نَذْهَبُ إِلَى الشَّاطِئِ. سَبَحْتُ فِي الْمَاءِ وَلَعِبْتُ عَلَى الرَّمْلِ مَعَ أَخِي.",
"فِي الْمَسَاءِ كُنَّا نَمْشِي فِي الْمَدِينَةِ وَنَأْكُلُ السَّمَكَ فِي الْمَطَاعِمِ. بَقِينَا أُسْبُوعًا كَامِلًا. كَانَتْ رِحْلَةً جَمِيلَةً لَا أَنْسَاهَا."],
tf:["سَافَرُوا فِي الشِّتَاءِ","سَكَنُوا فِي فُنْدُقٍ","سَبَحَ فِي الْمَاءِ","بَقُوا ثَلَاثَةَ أَيَّامٍ"]},
32:{ta:"فَصْلُ الصَّيْفِ",
p:["الصَّيْفُ هُوَ فَصْلُ الْعُطْلَةِ وَالشَّمْسِ. فِي الصَّيْفِ تَكُونُ الْأَيَّامُ طَوِيلَةً وَاللَّيَالِي قَصِيرَةً. الطَّقْسُ حَارٌّ جِدًّا فِي مَدِينَتِنَا.",
"فِي الصَّيْفِ لَا نَذْهَبُ إِلَى الْمَدْرَسَةِ. نَسْتَيْقِظُ مُتَأَخِّرِينَ وَنَلْعَبُ كَثِيرًا. نَشْرَبُ الْعَصِيرَ الْبَارِدَ وَنَأْكُلُ الْفَوَاكِهَ: الْبَطِّيخَ وَالْعِنَبَ وَالتِّينَ.",
"فِي الْمَسَاءِ نَخْرُجُ إِلَى الشَّارِعِ أَوْ نَذْهَبُ إِلَى الْبَحْرِ. بَعْضُ الْعَائِلَاتِ تُسَافِرُ إِلَى الْجِبَالِ لِأَنَّ الْهَوَاءَ هُنَاكَ بَارِدٌ. أَنَا أُحِبُّ الصَّيْفَ كَثِيرًا."],
tf:["فِي الصَّيْفِ الْأَيَّامُ قَصِيرَةٌ","يَأْكُلُونَ الْبَطِّيخَ فِي الصَّيْفِ","بَعْضُ الْعَائِلَاتِ تَذْهَبُ إِلَى الْجِبَالِ","فِي الصَّيْفِ يَذْهَبُونَ إِلَى الْمَدْرَسَةِ"]},
33:{ta:"فَصْلُ الشِّتَاءِ",
p:["فِي الشِّتَاءِ يَكُونُ الطَّقْسُ بَارِدًا وَالسَّمَاءُ رَمَادِيَّةً. تُمْطِرُ السَّمَاءُ كَثِيرًا وَأَحْيَانًا يَسْقُطُ الثَّلْجُ عَلَى الْجِبَالِ. الْأَيَّامُ قَصِيرَةٌ وَاللَّيَالِي طَوِيلَةٌ.",
"فِي الشِّتَاءِ نَلْبَسُ مَلَابِسَ ثَقِيلَةً: مِعْطَفًا وَقُبَّعَةً وَحِذَاءً قَوِيًّا. فِي الْبَيْتِ نَجْلِسُ قُرْبَ النَّارِ وَنَشْرَبُ الشَّايَ السَّاخِنَ.",
"أَنَا أُحِبُّ الشِّتَاءَ عِنْدَمَا أَكُونُ فِي الْبَيْتِ. أَقْرَأُ الْقِصَصَ وَأُشَاهِدُ الْمَطَرَ مِنَ النَّافِذَةِ. أُمِّي تَطْبُخُ شُورْبَةً سَاخِنَةً وَلَذِيذَةً."],
tf:["فِي الشِّتَاءِ السَّمَاءُ زَرْقَاءُ دَائِمًا","يَلْبَسُونَ مَلَابِسَ ثَقِيلَةً","يَجْلِسُونَ قُرْبَ النَّارِ","الْأُمُّ تَطْبُخُ سَلَطَةً بَارِدَةً"]},
34:{ta:"فَصْلُ الرَّبِيعِ",
p:["الرَّبِيعُ هُوَ أَجْمَلُ فُصُولِ السَّنَةِ. فِي الرَّبِيعِ يَكُونُ الطَّقْسُ مُعْتَدِلًا، لَا حَارًّا وَلَا بَارِدًا. تَخْرُجُ الْأَزْهَارُ فِي الْحَدَائِقِ وَالْحُقُولِ.",
"فِي الرَّبِيعِ تَصِيرُ الْأَشْجَارُ خَضْرَاءَ وَتَرْجِعُ الطُّيُورُ مِنَ الْبِلَادِ الْبَعِيدَةِ. النَّاسُ يَخْرُجُونَ إِلَى الْحَدَائِقِ وَيَجْلِسُونَ تَحْتَ الْأَشْجَارِ.",
"فِي الرَّبِيعِ الْمَاضِي ذَهَبْنَا فِي رِحْلَةٍ إِلَى الْجَبَلِ. مَشَيْنَا بَيْنَ الْأَزْهَارِ وَأَكَلْنَا تَحْتَ شَجَرَةٍ كَبِيرَةٍ. كَانَ يَوْمًا جَمِيلًا جِدًّا."],
tf:["الطَّقْسُ فِي الرَّبِيعِ حَارٌّ جِدًّا","الْأَشْجَارُ تَصِيرُ خَضْرَاءَ","الطُّيُورُ تَرْجِعُ فِي الرَّبِيعِ","ذَهَبُوا فِي رِحْلَةٍ إِلَى الْبَحْرِ"]},
35:{ta:"فِي الْمَطَارِ",
p:["سَافَرَ عَمِّي إِلَى فَرَنْسَا لِلْعَمَلِ. ذَهَبْنَا مَعَهُ إِلَى الْمَطَارِ فِي الصَّبَاحِ. الْمَطَارُ كَبِيرٌ جِدًّا وَفِيهِ نَاسٌ مِنْ كُلِّ الْعَالَمِ.",
"حَمَلَ عَمِّي حَقِيبَتَيْنِ كَبِيرَتَيْنِ. وَقَفْنَا مَعَهُ فِي الطَّابُورِ ثُمَّ أَعْطَى جَوَازَ سَفَرِهِ وَتَذْكَرَتَهُ لِلْمُوَظَّفَةِ. قَالَتْ لَهُ: الطَّائِرَةُ سَتُقْلِعُ بَعْدَ سَاعَتَيْنِ.",
"قَبْلَ الدُّخُولِ سَلَّمَ عَمِّي عَلَيْنَا وَقَالَ: سَأَتَّصِلُ بِكُمْ مِنْ هُنَاكَ. كَانَتْ أُمِّي حَزِينَةً قَلِيلًا. شَاهَدْنَا الطَّائِرَةَ مِنَ النَّافِذَةِ الْكَبِيرَةِ وَهِيَ تَطِيرُ."],
tf:["سَافَرَ الْعَمُّ إِلَى فَرَنْسَا","حَمَلَ حَقِيبَةً وَاحِدَةً","الطَّائِرَةُ تُقْلِعُ بَعْدَ سَاعَتَيْنِ","كَانَتِ الْأُمُّ سَعِيدَةً جِدًّا"]},
36:{ta:"فِي الْفُنْدُقِ",
p:["وَصَلْنَا إِلَى الْفُنْدُقِ فِي الْمَسَاءِ. الْفُنْدُقُ كَبِيرٌ وَجَمِيلٌ وَأَمَامَهُ حَدِيقَةٌ. اسْتَقْبَلَنَا مُوَظَّفٌ طَيِّبٌ وَأَعْطَانَا مِفْتَاحَ الْغُرْفَةِ.",
"غُرْفَتُنَا فِي الطَّابِقِ الثَّالِثِ. فِيهَا سَرِيرَانِ كَبِيرَانِ وَنَافِذَةٌ تُطِلُّ عَلَى الْبَحْرِ. الْحَمَّامُ نَظِيفٌ وَالْمَاءُ سَاخِنٌ.",
"فِي الصَّبَاحِ أَكَلْنَا الْفُطُورَ فِي مَطْعَمِ الْفُنْدُقِ. كَانَ الْفُطُورُ لَذِيذًا: خُبْزٌ وَجُبْنٌ وَبَيْضٌ وَعَسَلٌ وَعَصِيرٌ. ثُمَّ خَرَجْنَا لِنُشَاهِدَ الْمَدِينَةَ."],
tf:["وَصَلُوا فِي الصَّبَاحِ","الْغُرْفَةُ فِي الطَّابِقِ الثَّالِثِ","النَّافِذَةُ تُطِلُّ عَلَى الْبَحْرِ","كَانَ الْفُطُورُ سَيِّئًا"]},
37:{ta:"يَوْمٌ فِي الرِّيفِ",
p:["يَوْمَ الْأَحَدِ الْمَاضِي ذَهَبْنَا إِلَى الرِّيفِ عِنْدَ عَمِّي. الطَّرِيقُ طَوِيلٌ لَكِنَّهُ جَمِيلٌ. شَاهَدْنَا مِنَ السَّيَّارَةِ الْحُقُولَ الْخَضْرَاءَ وَالْجِبَالَ.",
"بَيْتُ عَمِّي صَغِيرٌ وَأَمَامَهُ حَقْلٌ كَبِيرٌ. لَعِبْتُ مَعَ أَوْلَادِ عَمِّي بَيْنَ الْأَشْجَارِ. شَرِبْنَا حَلِيبًا طَازَجًا وَأَكَلْنَا خُبْزًا سَاخِنًا مَعَ زَيْتِ الزَّيْتُونِ.",
"فِي الْمَسَاءِ جَلَسْنَا كُلُّنَا تَحْتَ شَجَرَةٍ كَبِيرَةٍ. حَكَى عَمِّي قِصَصًا مُضْحِكَةً وَضَحِكْنَا كَثِيرًا. رَجَعْنَا إِلَى الْمَدِينَةِ فِي اللَّيْلِ تَعْبَانِينَ وَسُعَدَاءَ."],
tf:["ذَهَبُوا إِلَى الرِّيفِ يَوْمَ السَّبْتِ","شَرِبُوا حَلِيبًا طَازَجًا","حَكَى الْعَمُّ قِصَصًا مُضْحِكَةً","رَجَعُوا فِي الصَّبَاحِ"]},
38:{ta:"يَوْمٌ مُمْطِرٌ",
p:["اسْتَيْقَظْتُ الْيَوْمَ وَسَمِعْتُ صَوْتَ الْمَطَرِ. نَظَرْتُ مِنَ النَّافِذَةِ: السَّمَاءُ رَمَادِيَّةٌ وَالشَّارِعُ مَلِيءٌ بِالْمَاءِ. قَالَتْ أُمِّي: الْبَسْ مِعْطَفَكَ وَخُذِ الْمِظَلَّةَ.",
"خَرَجْتُ إِلَى الْمَدْرَسَةِ تَحْتَ الْمَطَرِ. كَانَ الْجَوُّ بَارِدًا وَالنَّاسُ يَجْرُونَ فِي الشَّوَارِعِ. وَصَلْتُ إِلَى الصَّفِّ وَمَلَابِسِي مُبَلَّلَةٌ قَلِيلًا.",
"فِي الْمَسَاءِ جَلَسْتُ فِي الْبَيْتِ قُرْبَ النَّافِذَةِ. شَرِبْتُ شَايًا سَاخِنًا وَقَرَأْتُ قِصَّةً. أَنَا أُحِبُّ صَوْتَ الْمَطَرِ عِنْدَمَا أَكُونُ فِي الْبَيْتِ."],
tf:["كَانَتِ السَّمَاءُ زَرْقَاءَ","أَخَذَ الْمِظَلَّةَ","وَصَلَ وَمَلَابِسُهُ مُبَلَّلَةٌ قَلِيلًا","فِي الْمَسَاءِ خَرَجَ إِلَى الْحَدِيقَةِ"]},
39:{ta:"رِحْلَةٌ بِالْقِطَارِ",
p:["سَافَرْتُ مَعَ أَبِي بِالْقِطَارِ إِلَى الْعَاصِمَةِ لِزِيَارَةِ عَمَّتِي. خَرَجْنَا مِنَ الْبَيْتِ مُبَكِّرًا وَرَكِبْنَا الْقِطَارَ فِي السَّاعَةِ الثَّامِنَةِ.",
"جَلَسْتُ قُرْبَ النَّافِذَةِ وَشَاهَدْتُ الْحُقُولَ وَالْقُرَى وَالْجِبَالَ. الْقِطَارُ سَرِيعٌ وَمُرِيحٌ. أَكَلْنَا فِي الْقِطَارِ خُبْزًا وَجُبْنًا وَشَرِبْنَا الشَّايَ.",
"وَصَلْنَا إِلَى الْعَاصِمَةِ فِي الظُّهْرِ. كَانَتْ عَمَّتِي تَنْتَظِرُنَا فِي الْمَحَطَّةِ. سَلَّمَتْ عَلَيْنَا وَأَخَذَتْنَا إِلَى بَيْتِهَا. بَقِينَا عِنْدَهَا ثَلَاثَةَ أَيَّامٍ جَمِيلَةٍ."],
tf:["سَافَرَا بِالْحَافِلَةِ","رَكِبَا الْقِطَارَ فِي السَّاعَةِ الثَّامِنَةِ","كَانَتِ الْعَمَّةُ فِي الْمَحَطَّةِ","بَقِيَا أُسْبُوعًا كَامِلًا"]},
40:{ta:"الْعُطْلَةُ الصَّيْفِيَّةُ",
p:["انْتَهَتِ الْمَدْرَسَةُ وَبَدَأَتِ الْعُطْلَةُ الصَّيْفِيَّةُ. أَنَا سَعِيدٌ جِدًّا لِأَنَّ الْعُطْلَةَ طَوِيلَةٌ: ثَلَاثَةُ أَشْهُرٍ كَامِلَةٍ. عِنْدِي بَرْنَامَجٌ جَمِيلٌ.",
"فِي الشَّهْرِ الْأَوَّلِ سَأَبْقَى فِي الْمَدِينَةِ وَأَلْعَبُ مَعَ أَصْدِقَائِي. فِي الشَّهْرِ الثَّانِي سَنُسَافِرُ إِلَى الْقَرْيَةِ عِنْدَ جَدِّي. وَفِي الشَّهْرِ الثَّالِثِ سَنَذْهَبُ إِلَى الْبَحْرِ.",
"أُرِيدُ أَيْضًا أَنْ أَقْرَأَ كُتُبًا كَثِيرَةً وَأَنْ أَتَعَلَّمَ السِّبَاحَةَ جَيِّدًا. الْعُطْلَةُ فُرْصَةٌ لِلرَّاحَةِ وَاللَّعِبِ وَالتَّعَلُّمِ. أَتَمَنَّى لَكُمْ عُطْلَةً سَعِيدَةً!"],
tf:["الْعُطْلَةُ شَهْرَانِ","فِي الشَّهْرِ الثَّانِي سَيَذْهَبُونَ إِلَى الْقَرْيَةِ","يُرِيدُ أَنْ يَتَعَلَّمَ السِّبَاحَةَ","الْعُطْلَةُ قَصِيرَةٌ"]},
41:{ta:"أُحِبُّ الرِّيَاضَةَ",
p:["أَنَا أُحِبُّ الرِّيَاضَةَ كَثِيرًا. أَلْعَبُ كُرَةَ الْقَدَمِ مَعَ أَصْدِقَائِي كُلَّ يَوْمِ سَبْتٍ فِي مَلْعَبِ الْحَيِّ. فَرِيقُنَا اسْمُهُ النُّجُومُ.",
"فِي الْأُسْبُوعِ الْمَاضِي لَعِبْنَا ضِدَّ فَرِيقِ الْمَدْرَسَةِ الْأُخْرَى. كَانَتِ الْمُبَارَاةُ صَعْبَةً لَكِنَّنَا فُزْنَا بِهَدَفَيْنِ. كُنْتُ سَعِيدًا جِدًّا.",
"الرِّيَاضَةُ مُفِيدَةٌ لِلْجِسْمِ وَالْعَقْلِ. أَبِي يَمْشِي كُلَّ صَبَاحٍ وَأَخِي يَسْبَحُ فِي الْمَسْبَحِ. أُمِّي تَقُولُ: الْعَقْلُ السَّلِيمُ فِي الْجِسْمِ السَّلِيمِ."],
tf:["يَلْعَبُ كُرَةَ الْقَدَمِ يَوْمَ الْأَحَدِ","فَازَ فَرِيقُهُ بِهَدَفَيْنِ","الْأَبُ يَمْشِي كُلَّ صَبَاحٍ","اسْمُ الْفَرِيقِ الْأَسْوَدُ"]},
42:{ta:"فِي الْمَطْبَخِ مَعَ أُمِّي",
p:["أُمِّي تَطْبُخُ أَحْسَنَ طَعَامٍ فِي الْعَالَمِ. الْيَوْمَ سَاعَدْتُهَا فِي الْمَطْبَخِ لِأَنَّ عِنْدَنَا ضُيُوفًا فِي الْمَسَاءِ. طَبَخْنَا مَعًا دَجَاجًا بِالْأَرُزِّ.",
"غَسَلْتُ أَنَا الْخُضَارَ وَقَطَعَتْ أُمِّي اللَّحْمَ. وَضَعْنَا الْبَصَلَ وَالطَّمَاطِمَ فِي الْقِدْرِ مَعَ قَلِيلٍ مِنَ الزَّيْتِ وَالْمِلْحِ. كَانَتْ رَائِحَةُ الطَّعَامِ جَمِيلَةً.",
"فِي الْمَسَاءِ جَاءَ الضُّيُوفُ وَأَكَلُوا مَعَنَا. قَالُوا كُلُّهُمْ: الطَّعَامُ لَذِيذٌ جِدًّا! كَانَتْ أُمِّي سَعِيدَةً وَأَنَا فَخُورٌ لِأَنَّنِي سَاعَدْتُهَا."],
tf:["طَبَخَا سَمَكًا","غَسَلَ الِابْنُ الْخُضَارَ","وَضَعَا الْبَصَلَ فِي الْقِدْرِ","قَالَ الضُّيُوفُ إِنَّ الطَّعَامَ سَيِّئٌ"]},
43:{ta:"قِطَّتُنَا الصَّغِيرَةُ",
p:["عِنْدَنَا فِي الْبَيْتِ قِطَّةٌ صَغِيرَةٌ اسْمُهَا لُولُو. لَوْنُهَا أَبْيَضُ وَعَيْنَاهَا خَضْرَاوَانِ. جَاءَتْ إِلَى بَيْتِنَا قَبْلَ سَنَةٍ وَهِيَ الْآنَ مِنَ الْعَائِلَةِ.",
"لُولُو تُحِبُّ الْحَلِيبَ وَالسَّمَكَ. تَنَامُ كَثِيرًا فِي النَّهَارِ وَتَلْعَبُ فِي اللَّيْلِ. أَحْيَانًا تَجْلِسُ عَلَى النَّافِذَةِ وَتَنْظُرُ إِلَى الطُّيُورِ فِي الْحَدِيقَةِ.",
"أَخِي الصَّغِيرُ يُوسُفُ يُحِبُّ لُولُو كَثِيرًا. يَلْعَبُ مَعَهَا كُلَّ يَوْمٍ بَعْدَ الْمَدْرَسَةِ. عِنْدَمَا يَجْلِسُ لِيَقْرَأَ، تَنَامُ لُولُو بِجَانِبِهِ."],
tf:["لَوْنُ الْقِطَّةِ أَسْوَدُ","تُحِبُّ الْقِطَّةُ السَّمَكَ","تَنَامُ فِي النَّهَارِ","جَاءَتْ قَبْلَ شَهْرٍ"]},
44:{ta:"حَدِيقَةُ جَدِّي",
p:["عِنْدَ جَدِّي حَدِيقَةٌ جَمِيلَةٌ وَرَاءَ بَيْتِهِ. فِيهَا أَشْجَارُ بُرْتُقَالٍ وَلَيْمُونٍ وَزَيْتُونٍ. فِي وَسَطِ الْحَدِيقَةِ بِئْرٌ قَدِيمَةٌ.",
"يَعْمَلُ جَدِّي فِي حَدِيقَتِهِ كُلَّ صَبَاحٍ. يَسْقِي الْأَشْجَارَ وَيُنَظِّفُ الْأَرْضَ وَيَزْرَعُ الْخُضَارَ: طَمَاطِمُ وَبَطَاطِسُ وَبَصَلٌ. يَقُولُ جَدِّي: الْحَدِيقَةُ مِثْلُ الطِّفْلِ، تَحْتَاجُ إِلَى الْحُبِّ.",
"فِي الصَّيْفِ نَأْكُلُ الْفَوَاكِهَ مِنَ الْحَدِيقَةِ مُبَاشَرَةً. الْبُرْتُقَالُ حُلْوٌ وَاللَّيْمُونُ كَثِيرٌ. أُحِبُّ أَنْ أُسَاعِدَ جَدِّي وَأَنْ أَتَعَلَّمَ مِنْهُ."],
tf:["الْحَدِيقَةُ أَمَامَ الْبَيْتِ","فِي الْحَدِيقَةِ بِئْرٌ","يَزْرَعُ الْجَدُّ الْخُضَارَ","الْبُرْتُقَالُ حَامِضٌ"]},
45:{ta:"مَسَاءٌ أَمَامَ التِّلْفَازِ",
p:["فِي مَسَاءِ الْجُمُعَةِ تَجْلِسُ عَائِلَتُنَا أَمَامَ التِّلْفَازِ. أَبِي يُحِبُّ الْأَخْبَارَ وَأُمِّي تُحِبُّ الْأَفْلَامَ الْقَدِيمَةَ. أَنَا وَأَخِي نُحِبُّ الرِّيَاضَةَ وَالرُّسُومَ الْمُتَحَرِّكَةَ.",
"أَمْسِ شَاهَدْنَا فِيلْمًا جَمِيلًا عَنِ الْبَحْرِ. كَانَ الْفِيلْمُ طَوِيلًا لَكِنَّهُ مُمْتِعٌ. أَكَلْنَا الْفَوَاكِهَ وَشَرِبْنَا الشَّايَ أَمَامَ التِّلْفَازِ.",
"لَكِنَّ أُمِّي تَقُولُ دَائِمًا: التِّلْفَازُ قَلِيلًا وَالْقِرَاءَةُ كَثِيرًا. لِذَلِكَ نَقْرَأُ كُلَّ مَسَاءٍ قَبْلَ النَّوْمِ. الْكِتَابُ صَدِيقٌ لَا يَتْعَبُ."],
tf:["الْأَبُ يُحِبُّ الْأَفْلَامَ الْقَدِيمَةَ","شَاهَدُوا فِيلْمًا عَنِ الْبَحْرِ","الْأُمُّ تَقُولُ اقْرَأُوا كَثِيرًا","الْفِيلْمُ كَانَ قَصِيرًا"]},
46:{ta:"هَاتِفُ أَبِي",
p:["اشْتَرَى أَبِي هَاتِفًا جَدِيدًا الْأُسْبُوعَ الْمَاضِي. الْهَاتِفُ صَغِيرٌ وَسَرِيعٌ وَفِيهِ كَامِيرَا جَيِّدَةٌ. أَبِي سَعِيدٌ بِهِ كَثِيرًا.",
"يَسْتَعْمِلُ أَبِي الْهَاتِفَ لِلْعَمَلِ: يَقْرَأُ رَسَائِلَهُ وَيَتَّصِلُ بِأَصْدِقَائِهِ. أُمِّي تَسْتَعْمِلُهُ أَحْيَانًا لِتَتَكَلَّمَ مَعَ خَالَتِي فِي فَرَنْسَا. نُشَاهِدُ صُوَرَهَا عَلَى الشَّاشَةِ.",
"لَكِنَّ أَبِي يَقُولُ لَنَا: الْهَاتِفُ لِلْكِبَارِ وَلَيْسَ لِلْأَطْفَالِ. سَاعَةٌ وَاحِدَةٌ فِي الْيَوْمِ تَكْفِي. الْأَفْضَلُ أَنْ تَلْعَبُوا فِي الْحَدِيقَةِ وَتَقْرَأُوا الْكُتُبَ."],
tf:["اشْتَرَى الْأَبُ حَاسُوبًا","فِي الْهَاتِفِ كَامِيرَا جَيِّدَةٌ","الْأُمُّ تَتَكَلَّمُ مَعَ أُخْتِهَا فِي فَرَنْسَا","يَقُولُ الْأَبُ الْهَاتِفُ لِلْأَطْفَالِ"]},
47:{ta:"الْعِيدُ فِي بَيْتِنَا",
p:["غَدًا يَوْمُ الْعِيدِ. أُمِّي نَظَّفَتِ الْبَيْتَ وَحَضَّرَتِ الْحَلْوَى. اشْتَرَى لَنَا أَبِي مَلَابِسَ جَدِيدَةً: قَمِيصًا أَبْيَضَ لِي وَفُسْتَانًا أَحْمَرَ لِأُخْتِي.",
"فِي صَبَاحِ الْعِيدِ نَسْتَيْقِظُ مُبَكِّرِينَ وَنَلْبَسُ مَلَابِسَنَا الْجَدِيدَةَ. نَذْهَبُ مَعَ أَبِي إِلَى الْمَسْجِدِ ثُمَّ نَزُورُ الْجِيرَانَ وَالْعَائِلَةَ.",
"فِي يَوْمِ الْعِيدِ يُعْطِي الْكِبَارُ الْأَطْفَالَ نُقُودًا وَحَلْوَى. نَأْكُلُ كُلُّنَا عِنْدَ جَدَّتِي فِي الظُّهْرِ. الْعِيدُ يَوْمُ فَرَحٍ لِلصِّغَارِ وَالْكِبَارِ."],
tf:["اشْتَرَى الْأَبُ مَلَابِسَ قَدِيمَةً","الْفُسْتَانُ أَحْمَرُ","يَأْكُلُونَ عِنْدَ الْجَدَّةِ","الْعِيدُ يَوْمُ حُزْنٍ"]},
48:{ta:"رَأْسُ السَّنَةِ",
p:["غَدًا تَبْدَأُ سَنَةٌ جَدِيدَةٌ. فِي مَدِينَتِنَا يَحْتَفِلُ النَّاسُ فِي السَّاحَةِ الْكَبِيرَةِ. تَكُونُ الشَّوَارِعُ مَلِيئَةً بِالْأَنْوَارِ الْمُلَوَّنَةِ.",
"فِي بَيْتِنَا نَجْلِسُ كُلُّ الْعَائِلَةِ مَعًا فِي اللَّيْلِ. نَأْكُلُ عَشَاءً جَمِيلًا وَنَتَكَلَّمُ عَنِ السَّنَةِ الْمَاضِيَةِ. كُلُّ وَاحِدٍ يَقُولُ مَاذَا يُرِيدُ فِي السَّنَةِ الْجَدِيدَةِ.",
"أَنَا قُلْتُ: أُرِيدُ أَنْ أَنْجَحَ فِي الْمَدْرَسَةِ وَأَنْ أَتَعَلَّمَ السِّبَاحَةَ. قَالَتْ أُمِّي: وَأَنَا أُرِيدُ الصِّحَّةَ وَالسَّعَادَةَ لِكُلِّ الْعَائِلَةِ. سَنَةٌ سَعِيدَةٌ لِلْجَمِيعِ!"],
tf:["يَحْتَفِلُ النَّاسُ فِي السَّاحَةِ","الشَّوَارِعُ مَلِيئَةٌ بِالْأَنْوَارِ","قَالَ الْوَلَدُ أُرِيدُ سَيَّارَةً","الْأُمُّ تُرِيدُ الصِّحَّةَ لِلْعَائِلَةِ"]},
49:{ta:"الصِّحَّةُ كَنْزٌ",
p:["يَقُولُ جَدِّي دَائِمًا: الصِّحَّةُ كَنْزٌ كَبِيرٌ. لِذَلِكَ يَسْتَيْقِظُ مُبَكِّرًا وَيَمْشِي سَاعَةً كُلَّ صَبَاحٍ وَيَأْكُلُ الْخُضَارَ وَالْفَوَاكِهَ.",
"الْمُعَلِّمَةُ قَالَتْ لَنَا فِي الْمَدْرَسَةِ: لِصِحَّةٍ جَيِّدَةٍ، اشْرَبُوا الْمَاءَ كَثِيرًا وَنَامُوا مُبَكِّرِينَ وَالْعَبُوا الرِّيَاضَةَ. وَالْحَلْوَى قَلِيلًا فَقَطْ، لِأَنَّ السُّكَّرَ الْكَثِيرَ لَيْسَ جَيِّدًا لِلْجِسْمِ وَالْأَسْنَانِ.",
"أَنَا الْآنَ أَشْرَبُ الْحَلِيبَ كُلَّ صَبَاحٍ وَآكُلُ تُفَّاحَةً كُلَّ يَوْمٍ وَأَلْعَبُ كُرَةَ الْقَدَمِ. أُرِيدُ أَنْ أَكُونَ قَوِيًّا وَصَحِيحًا مِثْلَ جَدِّي."],
tf:["يَمْشِي الْجَدُّ كُلَّ صَبَاحٍ","قَالَتِ الْمُعَلِّمَةُ كُلُوا حَلْوَى كَثِيرَةً","السُّكَّرُ الْكَثِيرُ لَيْسَ جَيِّدًا لِلْأَسْنَانِ","يَشْرَبُ الْوَلَدُ الْحَلِيبَ فِي الْمَسَاءِ"]},
50:{ta:"أُحِبُّ الْقِرَاءَةَ",
p:["الْقِرَاءَةُ هِوَايَتِي الْمُفَضَّلَةُ. أَقْرَأُ كُلَّ مَسَاءٍ قَبْلَ النَّوْمِ. عِنْدِي فِي غُرْفَتِي رَفٌّ كَبِيرٌ مَلِيءٌ بِالْكُتُبِ وَالْقِصَصِ.",
"أُحِبُّ قِصَصَ الْمُغَامَرَاتِ وَكُتُبَ الْحَيَوَانَاتِ وَالتَّارِيخِ. أَخَذْتُ أَوَّلَ كِتَابٍ مِنَ الْمَكْتَبَةِ عِنْدَمَا كَانَ عُمْرِي سَبْعَ سَنَوَاتٍ. الْآنَ أَقْرَأُ كِتَابًا جَدِيدًا كُلَّ أُسْبُوعٍ.",
"تَقُولُ مُعَلِّمَتِي: مَنْ يَقْرَأُ كَثِيرًا يَعْرِفُ كَثِيرًا. الْكِتَابُ يُسَافِرُ بِنَا إِلَى بِلَادٍ بَعِيدَةٍ وَنَحْنُ فِي غُرْفَتِنَا. الْقِرَاءَةُ نُورٌ وَالْكِتَابُ أَحْسَنُ صَدِيقٍ."],
tf:["يَقْرَأُ كُلَّ صَبَاحٍ","فِي غُرْفَتِهِ رَفُّ كُتُبٍ","يُحِبُّ قِصَصَ الْمُغَامَرَاتِ","يَقْرَأُ كِتَابًا جَدِيدًا كُلَّ شَهْرٍ"]}
};
