<tr><td><strong>défini / indéfini</strong></td><td>« le livre » (on sait lequel) / « un livre » (n'importe lequel)</td><td><span class="ar">الْكِتَاب / كِتَاب</span></td></tr>
<tr><td><strong>masculin / féminin</strong></td><td>le genre du mot</td><td><span class="ar">طَالِب / طَالِبَة</span></td></tr>
<tr><td><strong>singulier / pluriel</strong></td><td>un seul / plusieurs (l'arabe a aussi un « duel » pour deux)</td><td><span class="ar">كِتَاب / كُتُب</span></td></tr>
<tr><td><strong>préfixe / suffixe</strong></td><td>morceau collé <em>avant</em> / <em>après</em> un mot</td><td><span class="ar">الْ</span>كِتَاب / كِتَابُ<span class="ar">هُ</span></td></tr>
<tr><td><strong>phrase</strong></td><td>groupe de mots qui dit quelque chose de complet</td><td>La maison est grande.</td></tr>
<tr><td><strong>groupe nominal</strong></td><td>un nom avec ses compléments, qui n'est <em>pas</em> une phrase</td><td>la grande maison</td></tr>
<tr><td><strong>sujet</strong></td><td>celui qui fait l'action, ou ce dont on parle</td><td><u>Ahmed</u> mange une pomme.</td></tr>
<tr><td><strong>attribut</strong></td><td>ce qu'on dit du sujet, en français après « être »</td><td>La maison est <u>grande</u>.</td></tr>
<tr><td><strong>COD</strong> (complément d'objet direct)</td><td>ce qui subit l'action, placé après le verbe sans préposition (répond à « quoi ? qui ? »)</td><td>Ahmed mange <u>une pomme</u>.</td></tr>
<tr><td><strong>complément introduit par une préposition</strong></td><td>un nom placé après une préposition (lieu, direction, moyen…)</td><td>Il va <u>à l'école</u>.</td></tr></table>

<h3>3. Les termes arabes</h3>
<p>Chaque leçon donne aussi le nom arabe des notions, par exemple <span class="ar">فَاعِل</span> (sujet d'un verbe) ou <span class="ar">مُبْتَدَأ</span> (sujet d'une phrase sans verbe). Ce sont les mots qu'emploient les professeurs et les livres de grammaire en arabe : ils valent la peine d'être retenus, mais ils sont toujours expliqués en français au moment où ils apparaissent.</p>
<div class="gex"><span class="ar">ذَهَبَ أَحْمَدُ إِلَى الْمَدْرَسَةِ.</span> — Ahmed est allé à l'école.<br><span class="fr"><span class="ar">ذَهَبَ</span> = <span class="ar">فِعْل</span> · <span class="ar">أَحْمَدُ</span> = <span class="ar">اِسْم</span> (sujet) · <span class="ar">إِلَى</span> = <span class="ar">حَرْف</span> (préposition) · <span class="ar">الْمَدْرَسَةِ</span> = <span class="ar">اِسْم</span> (après la préposition)</span></div>`},
{id:"pronoms",part:"2 · Le nom et ses compagnons",ta:"الضمائر المنفصلة",tav:"الضَّمَائِرُ الْمُنْفَصِلَةُ",t:"Les pronoms personnels (singulier, duel, pluriel)",h:`
<p>Les pronoms personnels isolés (<span class="ar">الضَّمَائِرُ الْمُنْفَصِلَةُ</span>) servent à désigner une personne : « je, tu, il… ». En arabe, ils sont plus nombreux qu'en français pour trois raisons. D'abord, l'arabe distingue le <strong>masculin et le féminin à la deuxième personne</strong> : on ne dit pas « tu » de la même façon à un homme (<span class="ar">أَنْتَ</span>) et à une femme (<span class="ar">أَنْتِ</span>). Ensuite, il distingue « ils » (<span class="ar">هُمْ</span>) de « elles » (<span class="ar">هُنَّ</span>). Enfin — et c'est une spécificité de l'arabe — il existe un <strong>troisième nombre</strong> entre le singulier et le pluriel : le <strong>duel</strong> (<span class="ar">الْمُثَنَّى</span>), utilisé quand on parle d'<em>exactement deux</em> personnes.</p>
<table class="gtable keepv"><tr><th>Arabe</th><th>Français</th></tr>
<tr><th colspan="2">Singulier (une personne)</th></tr>
<tr><td class="ar">أَنَا</td><td>je / moi</td></tr>
<tr><td class="ar">أَنْتَ</td><td>tu (à un homme)</td></tr>
<tr><td class="ar">أَنْتِ</td><td>tu (à une femme)</td></tr>
<tr><td class="ar">هُوَ</td></tr>
<tr><td class="ar">هِيَ</td></tr>
<tr><th colspan="2">Duel (exactement deux personnes)</th></tr>
<tr><td class="ar">أَنْتُمَا</td><td>vous deux (homme ou femme)</td></tr>
<tr><td class="ar">هُمَا</td><td>eux deux / elles deux</td></tr>
<tr><th colspan="2">Pluriel (trois personnes ou plus)</th></tr>
<tr><td class="ar">نَحْنُ</td></tr>
<tr><td class="ar">أَنْتُمْ</td><td>vous (plusieurs hommes / groupe mixte)</td></tr>
<tr><td class="ar">أَنْتُنَّ</td><td>vous (plusieurs femmes)</td></tr>
<tr><td class="ar">هُمْ</td></tr>
<tr><td class="ar">هُنَّ</td></tr></table>
<p>Remarquez que le duel est plus simple que le reste : <span class="ar">أَنْتُمَا</span> et <span class="ar">هُمَا</span> servent au masculin <em>et</em> au féminin. Autre différence avec le français : il n'y a pas de « vous » de politesse. On s'adresse à un professeur ou un inconnu avec la même forme qu'à un ami — le respect passe par le ton et les formules, pas par le pronom.</p>
<div class="gnote">Détail utile pour la lecture : sans les petites voyelles, <span class="ar keepv nov">أنت</span> peut être « tu » masculin (<span class="ar keepv">أَنْتَ</span>) ou féminin (<span class="ar keepv">أَنْتِ</span>). Seul le contexte (ou la vocalisation — le bouton ـَـّ en haut) permet de trancher. C'est un premier exemple d'une règle générale de l'arabe écrit : beaucoup d'ambiguïtés se résolvent par le contexte.</div>
<div class="gex"><span class="ar">هِيَ طَبِيبَةٌ وَهُوَ مُعَلِّمٌ.</span> — Elle est médecin et il est enseignant.<br><span class="ar">نَحْنُ فِي الْبَيْتِ وَهُمْ فِي الْمَدْرَسَةِ.</span> — Nous sommes à la maison et ils sont à l'école.<br><span class="ar">أَنْتُمَا صَدِيقَانِ.</span> — Vous deux, vous êtes amis.</div>
<p>Un point qui surprend au début : dans une phrase comme <span class="ar">أَنَا طَالِبٌ</span> (« je suis étudiant »), il n'y a aucun verbe. Le pronom et l'attribut se suffisent. C'est la « phrase nominale », que nous verrons en détail dans {{L:nominale}}.</p>`},
{id:"article",ta:"أل التعريف",tav:"أَلْ التَّعْرِيفِ",t:"L'article défini الْ et les lettres solaires",h:`
<p>L'arabe n'a <strong>pas d'article indéfini</strong> : « un livre » se dit simplement <span class="ar">كِتَاب</span>. L'absence d'article suffit à marquer l'indéfini. Pour dire « le / la / les », on colle le préfixe <span class="ar">ال</span> (al-) au début du mot : <span class="ar">الْكِتَاب</span> — le livre. Comme un nom défini ne prend jamais de tanwīn, on a <span class="ar">كِتَابٌ</span> (un livre) mais <span class="ar">الْكِتَابُ</span> (le livre). Un seul article pour tous les genres et tous les nombres : <span class="ar">الْبَيْت، الْمَدْرَسَة، الْكُتُب</span>.</p>
<p>À l'oral (et dans les textes vocalisés), le <span class="ar">ل</span> de l'article se comporte de deux façons selon la première lettre du mot :</p>
<table class="gtable keepv"><tr><th>Type</th><th>Lettres</th><th>Exemple</th><th>Prononciation</th></tr>
<tr><td>Lettres lunaires</td><td class="ar">ا ب ج ح خ ع غ ف ق ك م ه و ي</td><td class="ar">الْقَمَر</td><td>al-qamar (le ل s'entend)</td></tr>
<tr><td>Lettres solaires</td><td class="ar">ت ث د ذ ر ز س ش ص ض ط ظ ل ن</td><td class="ar">الشَّمْس</td><td>ash-shams (le ل disparaît, la lettre suivante est doublée)</td></tr></table>
<div class="gnote">D'où les noms : <span class="ar">قَمَر</span> (lune) commence par une lettre « lunaire », <span class="ar">شَمْس</span> (soleil) par une lettre « solaire ». Dans l'écriture, le <span class="ar">ل</span> reste toujours écrit — activez le bouton des voyelles (ـَـّ) et vous verrez la shadda (ـّ) sur la lettre solaire, par exemple dans <span class="ar">السُّوق</span> ou <span class="ar">النَّافِذَة</span>.</div>
<p>L'article fusionne avec certaines prépositions collées :</p>
<table class="gtable"><tr><th>Combinaison</th><th>Résultat</th><th>Exemple</th></tr>
<tr><td><span class="ar">بِـ</span> (par, avec, en) + <span class="ar">الْ</span></td><td class="ar">بِالْـ</td><td><span class="ar">بِالسَّيَّارَة</span> — en voiture</td></tr>
<tr><td><span class="ar">لِـ</span> (pour, à) + <span class="ar">الْ</span></td><td><span class="ar">لِلْـ</span> (le ا disparaît !)</td><td><span class="ar">لِلْجَمِيع</span> — pour tous ; <span class="ar">لِلْمَدْرَسَة</span> — pour l'école</td></tr>
<tr><td><span class="ar">كَـ</span> (comme) + <span class="ar">الْ</span></td><td class="ar">كَالْـ</td><td><span class="ar">كَالْبَحْر</span> — comme la mer</td></tr></table>
<div class="gnote">Le <span class="ar">ا</span> de l'article est un <strong>alif waṣl</strong> ({{L:lire}}) : au milieu d'une phrase, il ne se prononce pas. <span class="ar">وَالْبَيْتُ</span> se lit « wal-baytou », <span class="ar">فِي الْبَيْتِ</span> « fil-bayti ». C'est aussi pour cela qu'il disparaît complètement à l'écrit après <span class="ar">لِـ</span>. Ces petits mots collés (<span class="ar">بِـ، لِـ، كَـ، وَ</span>…) sont présentés en détail dans {{L:prepositions}} et {{L:segmentation}}.</div>
<div class="gex"><span class="ar">أَذْهَبُ إِلَى الْمَدْرَسَةِ بِالْحَافِلَةِ.</span> — Je vais à l'école en bus.<br><span class="ar">اِشْتَرَيْنَا خُبْزًا مِنَ السُّوقِ.</span> — Nous avons acheté du pain au marché (<span class="ar">خُبْزًا</span>, sans article = « du pain »).</div>`},
{id:"genre",ta:"المذكر والمؤنث",tav:"الْمُذَكَّرُ وَالْمُؤَنَّثُ",t:"Le masculin et le féminin",h:`
<p>Tout nom arabe est soit masculin, soit féminin — il n'y a pas de neutre. La bonne nouvelle : le féminin se reconnaît presque toujours à sa terminaison <span class="ar">ة</span> (tā' marbūṭa, le « t attaché »). Pour former le féminin d'un adjectif ou d'un nom de métier, il suffit en général d'ajouter ce <span class="ar">ة</span> :</p>
<table class="gtable"><tr><th>Masculin</th><th>Féminin</th><th>Sens</th></tr>
<tr><td class="ar">كَبِير</td><td class="ar">كَبِيرَة</td><td>grand / grande</td></tr>
<tr><td class="ar">جَمِيل</td><td class="ar">جَمِيلَة</td><td>beau / belle</td></tr>
<tr><td class="ar">طَالِب</td><td class="ar">طَالِبَة</td><td>étudiant / étudiante</td></tr>
<tr><td class="ar">طَبِيب</td><td class="ar">طَبِيبَة</td><td>médecin (h. / f.)</td></tr>
<tr><td class="ar">مُعَلِّم</td><td class="ar">مُعَلِّمَة</td><td>enseignant / enseignante</td></tr></table>
<p>L'adjectif <strong>suit</strong> le nom (jamais devant !) et s'accorde avec lui sur trois plans : le <strong>genre</strong>, le <strong>nombre</strong>, et — c'est la partie inhabituelle — la <strong>définition</strong>. Si le nom porte <span class="ar">ال</span>, l'adjectif doit le porter aussi :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">بِنْتٌ صَغِيرَة</td><td>une petite fille</td></tr>
<tr><td class="ar">الْبِنْتُ الصَّغِيرَة</td><td>la petite fille (les deux mots portent ال)</td></tr>
<tr><td class="ar">الْبِنْتُ صَغِيرَة</td><td>⚠ la fille est petite — c'est devenu une phrase ! ({{L:nominale}})</td></tr></table>
<div class="gnote">Ce dernier contraste est fondamental : <span class="ar">ال</span> sur le nom + <span class="ar">ال</span> sur l'adjectif = groupe nominal (« la petite fille ») ; <span class="ar">ال</span> sur le nom + adjectif sans <span class="ar">ال</span> = phrase (« la fille est petite »). En lisant, vérifiez toujours si l'adjectif porte l'article : cela change complètement le sens de ce que vous lisez.</div>
<p>Quelques féminins ne portent pas de <span class="ar">ة</span> (par exemple <span class="ar">أُمّ</span> — mère, <span class="ar">شَمْس</span> — soleil, <span class="ar">عَيْن</span> — œil) et certains adjectifs ont un féminin irrégulier : les couleurs notamment (<span class="ar">أَبْيَض / بَيْضَاء</span> — blanc / blanche, <span class="ar">أَحْمَر / حَمْرَاء</span> — rouge / rouge f., <span class="ar">أَخْضَر / خَضْرَاء</span> — vert / verte). Vous les rencontrerez dans les textes : le dictionnaire de l'app vous donnera la forme de base. L'adjectif se place toujours <strong>après</strong> le nom, et s'il y a plusieurs adjectifs, ils se suivent : <span class="ar">بَيْتٌ كَبِيرٌ جَمِيلٌ</span> — une grande et belle maison.</p>
<div class="gex"><span class="ar">أَخِي طَوِيلٌ وَأُخْتِي طَوِيلَةٌ.</span> — Mon frère est grand et ma sœur est grande.<br><span class="ar">السَّمَاءُ زَرْقَاءُ وَالْحُقُولُ خَضْرَاءُ.</span> — Le ciel est bleu et les champs sont verts.</div>`},
{id:"nombre",ta:"المفرد والمثنى والجمع",tav:"الْمُفْرَدُ وَالْمُثَنَّى وَالْجَمْعُ",t:"Le nombre : singulier, duel et pluriel",h:`
<p>Le français connaît deux nombres : le singulier et le pluriel. L'arabe en connaît <strong>trois</strong> : le <strong>singulier</strong> (<span class="ar">الْمُفْرَد</span>, une seule chose), le <strong>duel</strong> (<span class="ar">الْمُثَنَّى</span>, <em>exactement deux</em>) et le <strong>pluriel</strong> (<span class="ar">الْجَمْع</span>, trois ou plus). C'est une des grandes originalités de la langue, et elle traverse toute la grammaire : noms, adjectifs, pronoms ({{L:pronoms}}) et, plus tard, verbes ({{L:present}}, {{L:passe}}).</p>
<p><strong>1. Le duel</strong> est parfaitement régulier : on ajoute au nom la terminaison <span class="ar">ـَانِ</span> (quand le mot est sujet) ou <span class="ar">ـَيْنِ</span> (quand le mot est COD ou vient après une préposition ; la raison est expliquée dans {{L:cas}}). Pour un nom féminin, le <span class="ar">ة</span> s'ouvre en <span class="ar">ت</span> avant la terminaison. Le duel se suffit à lui-même : inutile d'ajouter le chiffre « deux ».</p>
<table class="gtable"><tr><th>Singulier</th><th>Duel (sujet)</th><th>Duel (autres cas)</th><th>Sens</th></tr>
<tr><td class="ar">كِتَاب</td><td class="ar">كِتَابَانِ</td><td class="ar">كِتَابَيْنِ</td><td>livre → deux livres</td></tr>
<tr><td class="ar">وَلَد</td><td class="ar">وَلَدَانِ</td><td class="ar">وَلَدَيْنِ</td><td>garçon → deux garçons</td></tr>
<tr><td class="ar">طَالِبَة</td><td class="ar">طَالِبَتَانِ</td><td class="ar">طَالِبَتَيْنِ</td><td>étudiante → deux étudiantes</td></tr>
<tr><td class="ar">سَاعَة</td><td class="ar">سَاعَتَانِ</td><td class="ar">سَاعَتَيْنِ</td><td>heure → deux heures</td></tr></table>
<p><strong>2. Le pluriel</strong> (trois ou plus) a deux grandes formes. La première est régulière (le « pluriel sain ») : on ajoute un suffixe. <span class="ar">ـُونَ</span> (ou <span class="ar">ـِينَ</span> selon la place dans la phrase) pour les personnes masculines, <span class="ar">ـَات</span> pour le féminin. La seconde, très répandue, est le <strong>pluriel brisé</strong> (<span class="ar">جَمْعُ التَّكْسِيرِ</span>) : on ne colle rien, on <em>casse</em> le mot de l'intérieur en changeant ses voyelles, un peu comme l'anglais <em>man → men</em>. Il faut l'apprendre avec chaque mot.</p>
<p>Voici les trois nombres côte à côte — c'est le tableau à retenir de cette leçon :</p>
<table class="gtable"><tr><th>Singulier (1)</th><th>Duel (2)</th><th>Pluriel (3+)</th><th>Sens</th></tr>
<tr><td class="ar">مُعَلِّم</td><td class="ar">مُعَلِّمَانِ</td><td class="ar">مُعَلِّمُونَ / مُعَلِّمِينَ</td><td>enseignant(s) — pluriel sain masculin</td></tr>
<tr><td class="ar">مُعَلِّمَة</td><td class="ar">مُعَلِّمَتَانِ</td><td class="ar">مُعَلِّمَات</td><td>enseignante(s) — pluriel sain féminin</td></tr>
<tr><td class="ar">سَيَّارَة</td><td class="ar">سَيَّارَتَانِ</td><td class="ar">سَيَّارَات</td><td>voiture(s)</td></tr>
<tr><td class="ar">كِتَاب</td><td class="ar">كِتَابَانِ</td><td class="ar">كُتُب</td><td>livre(s) — pluriel brisé</td></tr>
<tr><td class="ar">بَيْت</td><td class="ar">بَيْتَانِ</td><td class="ar">بُيُوت</td><td>maison(s) — brisé</td></tr>
<tr><td class="ar">رَجُل</td><td class="ar">رَجُلَانِ</td><td class="ar">رِجَال</td><td>homme(s) — brisé</td></tr>
<tr><td class="ar">طِفْل</td><td class="ar">طِفْلَانِ</td><td class="ar">أَطْفَال</td><td>enfant(s) — brisé</td></tr>
<tr><td class="ar">صَدِيق</td><td class="ar">صَدِيقَانِ</td><td class="ar">أَصْدِقَاء</td><td>ami(s) — brisé</td></tr></table>
<p>L'adjectif suit le nombre du nom : au duel, il prend lui aussi <span class="ar">ـَانِ</span> : <span class="ar">وَلَدَانِ صَغِيرَانِ</span> — deux petits garçons.</p>
<div class="gnote">Règle d'accord étonnante mais essentielle : un pluriel qui ne désigne <strong>pas des personnes</strong> s'accorde comme un <strong>féminin singulier</strong>. On dit <span class="ar">كُتُبٌ كَثِيرَة</span> (littéralement « des livres nombreuse » !), <span class="ar">الْبُيُوتُ كَبِيرَة</span> — les maisons sont grandes, et <span class="ar">هِيَ</span> pour « ils » en parlant d'objets. C'est pour cela que dans les textes, les adjectifs après des pluriels d'objets se terminent en <span class="ar">ة</span>. Le duel, lui, s'accorde normalement.</div>
<div class="gnote">Réflexe de lecture : une terminaison <span class="ar">ـَانِ / ـَيْنِ</span> sur un nom ? Pensez « deux » avant de penser « pluriel ». <span class="ar">ـُونَ / ـِينَ</span> ? Pluriel de personnes. <span class="ar">ـَات</span> ? Pluriel féminin ou d'objets. Le choix entre <span class="ar">ـَانِ</span> et <span class="ar">ـَيْنِ</span>, ou entre <span class="ar">ـُونَ</span> et <span class="ar">ـِينَ</span>, dépend du rôle du mot dans la phrase : ce sera expliqué dans {{L:cas}}. Attention : <span class="ar">ـِين</span> peut aussi faire partie du mot lui-même (<span class="ar">تِين</span> — figues).</div>
<div class="gex"><span class="ar">عِنْدِي أَخَوَانِ وَأُخْتٌ وَاحِدَةٌ.</span> — J'ai deux frères et une seule sœur.<br><span class="ar">فِي الْمَكْتَبَةِ كُتُبٌ كَثِيرَةٌ بِلُغَاتٍ مُخْتَلِفَةٍ.</span> — À la bibliothèque, il y a beaucoup de livres en différentes langues.<br><span class="ar">الْجِيرَانُ طَيِّبُونَ.</span> — Les voisins sont gentils (personnes → pluriel sain).</div>`},
{id:"possessifs",ta:"ضمائر الملكية",tav:"ضَمَائِرُ الْمِلْكِيَّةِ",t:"Les suffixes possessifs",h:`
<p>Pour dire « mon livre », le français utilise deux mots : un possessif + un nom. L'arabe n'en utilise qu'un seul : le possessif est un <strong>suffixe collé à la fin du nom</strong>. <span class="ar">كِتَاب</span> (livre) + <span class="ar">ـِي</span> (mon) = <span class="ar">كِتَابِي</span> (mon livre). C'est l'un des mécanismes les plus fréquents de la langue : dès qu'un mot vous semble « trop long », demandez-vous s'il ne se termine pas par un suffixe possessif.</p>
<table class="gtable keepv"><tr><th>Suffixe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">ـِي</td><td>mon / ma</td><td class="ar">بَيْتِي — ma maison</td></tr>
<tr><td class="ar">ـكَ</td><td>ton / ta (à un homme)</td><td class="ar">كِتَابُكَ — ton livre</td></tr>
<tr><td class="ar">ـكِ</td><td>ton / ta (à une femme)</td><td class="ar">كِتَابُكِ — ton livre</td></tr>
<tr><td class="ar">ـهُ</td><td>son / sa (à lui)</td><td class="ar">كِتَابُهُ — son livre</td></tr>
<tr><td class="ar">ـهَا</td><td>son / sa (à elle)</td><td class="ar">أُمُّهَا — sa mère</td></tr>
<tr><td class="ar">ـكُمَا</td><td>votre (à vous deux — duel)</td><td class="ar">بَيْتُكُمَا — votre maison à vous deux</td></tr>
<tr><td class="ar">ـهُمَا</td><td>leur (à eux deux / elles deux — duel)</td><td class="ar">بَيْتُهُمَا — leur maison à eux deux</td></tr>
<tr><td class="ar">ـنَا</td><td>notre / nos</td><td class="ar">بَيْتُنَا — notre maison</td></tr>
<tr><td class="ar">ـكُمْ</td><td>votre / vos (pluriel)</td><td class="ar">مَدْرَسَتُكُمْ — votre école</td></tr>
<tr><td class="ar">ـكُنَّ</td><td>votre (à plusieurs femmes)</td><td class="ar">مَدْرَسَتُكُنَّ — votre école (f.)</td></tr>
<tr><td class="ar">ـهُمْ</td><td>leur / leurs</td><td class="ar">جَدُّهُمْ — leur grand-père</td></tr>
<tr><td class="ar">ـهُنَّ</td><td>leur (à elles)</td><td class="ar">جَدُّهُنَّ — leur grand-père (f.)</td></tr></table>
<p>Vous reconnaissez la logique de {{L:pronoms}} : les suffixes suivent exactement les mêmes distinctions que les pronoms — masculin / féminin, et les trois nombres singulier / duel / pluriel. Le duel <span class="ar">ـكُمَا / ـهُمَا</span> sert, comme toujours, aux deux genres.</p>
<p>Règle d'orthographe essentielle : quand un nom féminin terminé par <span class="ar">ة</span> (tā' marbūṭa) reçoit un suffixe, ce <span class="ar">ة</span> <strong>s'ouvre et devient</strong> <span class="ar">ت</span>. Ainsi <span class="ar">مَدْرَسَة</span> (école) donne <span class="ar">مَدْرَسَتِي</span> (mon école), <span class="ar">مَدْرَسَتُهَا</span> (son école à elle), <span class="ar">مَدْرَسَتُنَا</span> (notre école). Si vous croisez un <span class="ar">ت</span> inattendu vers la fin d'un mot, c'est souvent un ancien <span class="ar">ة</span>.</p>
<p>Deux mots très courants changent un peu devant un suffixe : <span class="ar">أَب</span> (père) et <span class="ar">أَخ</span> (frère) deviennent <span class="ar">أَبُو / أَخُو</span> : <span class="ar">أَبُوهُ</span> (son père), <span class="ar">أَخُوكَ</span> (ton frère) — mais <span class="ar">أَبِي</span>, <span class="ar">أَخِي</span> (mon père, mon frère). L'explication complète vient dans {{L:exceptions}}.</p>
<div class="gnote">Ces mêmes suffixes se collent aussi aux <strong>verbes</strong> (où ils signifient « me, te, le, la… » : <span class="ar">فَحَصَنِي</span> — il m'a examiné, <span class="ar">أَعْطَيْتُهَا</span> — je lui ai donné à elle) et aux <strong>prépositions</strong> (<span class="ar">مَعَهُ</span> — avec lui, <span class="ar">لَكَ</span> — pour toi, <span class="ar">عِنْدَنَا</span> — chez nous). Un seul système à apprendre, trois usages. Seule différence : « me » se dit <span class="ar">ـنِي</span> sur un verbe, alors que « mon » se dit <span class="ar">ـِي</span> sur un nom.</div>
<div class="gex"><span class="ar">هَذَا كِتَابِي وَهَذَا كِتَابُكَ.</span> — Ceci est mon livre et ceci est ton livre.<br><span class="ar">بَيْتُهَا قَرِيبٌ مِنْ بَيْتِنَا.</span> — Sa maison (à elle) est proche de notre maison.</div>`},
{id:"demonstratifs",ta:"أسماء الإشارة",tav:"أَسْمَاءُ الْإِشَارَةِ",t:"Les démonstratifs : ceci, cela",h:`
<p>Pour montrer quelque chose, l'arabe accorde le démonstratif en genre, en nombre (y compris le duel !) et en distance, comme le français « ceci / cela » :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">هَذَا</td><td>ce, ceci (masculin, proche)</td><td class="ar">هَذَا كِتَابِي — c'est mon livre</td></tr>
<tr><td class="ar">هَذِهِ</td><td>cette, ceci (féminin, proche)</td><td class="ar">هَذِهِ مَدْرَسَتُنَا — c'est notre école</td></tr>
<tr><td class="ar">هَذَانِ</td><td>ces deux… (masculin, duel)</td><td class="ar">هَذَانِ وَلَدَانِ — voici deux garçons</td></tr>
<tr><td class="ar">هَاتَانِ</td><td>ces deux… (féminin, duel)</td><td class="ar">هَاتَانِ بِنْتَانِ — voici deux filles</td></tr>
<tr><td class="ar">هَؤُلَاءِ</td><td>ceux-ci, ces gens (pluriel)</td><td class="ar">هَؤُلَاءِ أَصْدِقَائِي — voici mes amis</td></tr>
<tr><td class="ar">ذَلِكَ</td><td>cela (masculin, éloigné)</td><td class="ar">ذَلِكَ الْبَيْت — cette maison-là</td></tr>
<tr><td class="ar">تِلْكَ</td><td>cela (féminin, éloigné)</td><td class="ar">تِلْكَ الْمَدِينَة — cette ville-là</td></tr>
<tr><td class="ar">هُنَا / هُنَاكَ</td><td>ici / là-bas</td><td class="ar">جَدِّي يَسْكُنُ هُنَاكَ — mon grand-père habite là-bas</td></tr></table>
<p>Le duel des démonstratifs suit la même logique que celui des noms ({{L:nombre}}) : <span class="ar">هَذَانِ / هَاتَانِ</span> deviennent <span class="ar">هَذَيْنِ / هَاتَيْنِ</span> quand le groupe n'est pas sujet.</p>
<p>Attention à une distinction que le français ne fait pas apparaître : le démonstratif + nom <strong>défini</strong> forme un groupe (« cette maison » = <span class="ar">هَذَا الْبَيْت</span>), tandis que le démonstratif + nom <strong>indéfini</strong> forme une phrase complète (« ceci est une maison » = <span class="ar">هَذَا بَيْت</span>).</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th></tr>
<tr><td class="ar">هَذَا الْكِتَاب</td><td>ce livre (groupe nominal)</td></tr>
<tr><td class="ar">هَذَا كِتَاب</td><td>ceci est un livre (phrase !)</td></tr>
<tr><td class="ar">هَذَا الْكِتَابُ جَدِيد</td><td>ce livre est nouveau (phrase complète)</td></tr>
<tr><td class="ar">هَذَا هُوَ الْكِتَابُ</td><td>c'est <em>le</em> livre (avec <span class="ar">هُوَ</span> pour séparer deux mots définis)</td></tr></table>
<div class="gnote">Rappel de {{L:article}} en action : c'est encore la présence ou l'absence de <span class="ar">ال</span> qui fait basculer le sens. Ce petit article est le vrai chef d'orchestre de la phrase arabe.</div>
<div class="gex"><span class="ar">هَذِهِ الرِّسَالَةُ مِنْ خَالِي.</span> — Cette lettre vient de mon oncle maternel.<br><span class="ar">يَذْهَبُ جَدِّي إِلَى هَذَا الْمَقْهَى كُلَّ مَسَاءٍ.</span> — Mon grand-père va à ce café chaque soir.</div>`},
{id:"nominale",part:"3 · Premières phrases",ta:"الجملة الاسمية",tav:"الْجُمْلَةُ الِاسْمِيَّةُ",t:"La phrase nominale (pas de « être » au présent)",h:`
<p>C'est la règle la plus déroutante pour un francophone : au présent, l'arabe <strong>n'utilise aucun verbe « être »</strong>. Une phrase complète peut être composée de deux mots seulement : un sujet, appelé <span class="ar">الْمُبْتَدَأ</span> (mubtada', « le point de départ »), et un attribut, appelé <span class="ar">الْخَبَر</span> (khabar, « l'information »). On appelle cela la <strong>phrase nominale</strong> (<span class="ar">الْجُمْلَةُ الِاسْمِيَّةُ</span>), car elle commence par un nom.</p>
<div class="gex"><span class="ar">الْبَيْتُ كَبِيرٌ.</span> — La maison [est] grande.<br><span class="ar">الطَّقْسُ جَمِيلٌ.</span> — Le temps [est] beau.<br><span class="ar">أَبِي طَبِيبٌ.</span> — Mon père [est] médecin.<br><span class="ar">أَنَا طَالِبَةٌ.</span> — Je [suis] étudiante.</div>
<p>Remarquez le schéma typique : le sujet est <strong>défini</strong> (avec <span class="ar">ال</span>, un possessif, un nom propre ou un pronom) et l'attribut est <strong>indéfini</strong>. C'est ce contraste qui permet de savoir où la phrase « se coupe » :</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Pourquoi</th></tr>
<tr><td class="ar">الْبَيْتُ كَبِيرٌ</td><td>la maison est grande</td><td>défini + indéfini = phrase</td></tr>
<tr><td class="ar">الْبَيْتُ الْكَبِيرُ</td><td>la grande maison</td><td>défini + défini = groupe nominal ({{L:genre}})</td></tr>
<tr><td class="ar">بَيْتٌ كَبِيرٌ</td><td>une grande maison</td><td>indéfini + indéfini = groupe nominal</td></tr></table>
<p>Le khabar peut être un adjectif, un nom, ou un groupe qui commence par une préposition (lieu) :</p>
<div class="gex"><span class="ar">أُمِّي فِي الْمَطْبَخِ.</span> — Ma mère [est] dans la cuisine.<br><span class="ar">الْكِتَابُ عَلَى الطَّاوِلَةِ.</span> — Le livre [est] sur la table.</div>
<div class="gnote">Et si les deux mots sont définis ? Pour dire « Ahmed est <em>l'</em>étudiant (dont on parle) », on glisse un pronom entre les deux pour marquer la coupure : <span class="ar">أَحْمَدُ هُوَ الطَّالِبُ</span>, <span class="ar">فَاطِمَةُ هِيَ الْمُعَلِّمَةُ</span>. Ce <span class="ar">هُوَ / هِيَ</span> ne se traduit pas, il joue le rôle du « est ».</div>
<p>Observez aussi la fin des mots : dans une phrase nominale simple, le mubtada' et le khabar se terminent tous les deux par une ḍamma (<span class="ar">ـُ</span> ou, avec le tanwīn, <span class="ar">ـٌ</span>). La raison de cette voyelle est expliquée dans {{L:cas}}.</p>
<div class="gnote">Et au passé ? Et à la négation ? Pour dire « la maison <em>était</em> grande » ou « la maison <em>n'est pas</em> grande », il faut des verbes spéciaux, <span class="ar">كَانَ</span> et <span class="ar">لَيْسَ</span>, présentés dans {{L:kana}}, une fois que les verbes et les terminaisons auront été vus.</div>
<div class="gex"><span class="ar">مَدْرَسَتِي قَرِيبَةٌ مِنَ الْبَيْتِ.</span> — Mon école est proche de la maison.<br><span class="ar">أَخِي مُهَنْدِسٌ وَأُخْتِي طَبِيبَةٌ.</span> — Mon frère est ingénieur et ma sœur est médecin.<br><span class="ar">هَذِهِ الْغُرْفَةُ صَغِيرَةٌ.</span> — Cette pièce est petite.</div>`},
{id:"prepositions",ta:"حروف الجر",tav:"حُرُوفُ الْجَرِّ",t:"Les prépositions, « avoir » et « il y a »",h:`
<p>Les prépositions arabes (<span class="ar">حُرُوفُ الْجَرِّ</span>) sont courtes, très fréquentes, et certaines se collent au mot suivant. Le nom qui suit une préposition se termine par une <strong>kasra</strong> (<span class="ar">ـِ</span>, ou <span class="ar">ـٍ</span> avec le tanwīn) : <span class="ar keepv">فِي الْبَيْتِ، فِي بَيْتٍ</span>. Retenez-le comme un réflexe ; la règle générale des terminaisons sera expliquée dans {{L:cas}}.</p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">فِي</td><td>dans, à</td><td><span class="ar">فِي الْبَيْتِ</span> — à la maison</td></tr>
<tr><td class="ar">إِلَى</td><td>vers, à (direction)</td><td><span class="ar">إِلَى الْمَدْرَسَةِ</span> — à l'école</td></tr>
<tr><td class="ar">مِنْ</td><td>de, depuis (point de départ)</td><td><span class="ar">مِنَ السُّوقِ</span> — du marché</td></tr>
<tr><td class="ar">عَنْ</td><td>au sujet de, de (éloignement)</td><td><span class="ar">تَكَلَّمْنَا عَنِ الْعُطْلَةِ</span> — nous avons parlé des vacances</td></tr>
<tr><td class="ar">عَلَى</td><td>sur</td><td><span class="ar">عَلَى الْمَكْتَبِ</span> — sur le bureau</td></tr>
<tr><td class="ar">مَعَ</td><td>avec (en compagnie de)</td><td><span class="ar">مَعَ أَصْدِقَائِي</span> — avec mes amis</td></tr>
<tr><td><span class="ar">بِـ</span> (collée)</td><td>par, avec (moyen), en</td><td><span class="ar">بِالْحَافِلَةِ</span> — en bus</td></tr>
<tr><td><span class="ar">لِـ</span> (collée)</td><td>pour, à (appartenance)</td><td><span class="ar">هَذَا الْكِتَابُ لِأُخْتِي</span> — ce livre est à ma sœur</td></tr>
<tr><td><span class="ar">كَـ</span> (collée)</td><td>comme</td><td><span class="ar">كَالْبَحْرِ</span> — comme la mer</td></tr>
<tr><td class="ar">مِثْلَ</td><td>comme, pareil à</td><td><span class="ar">مِثْلَ أَبِي</span> — comme mon père</td></tr>
<tr><td class="ar">عِنْدَ</td><td>chez, auprès de</td><td><span class="ar">عِنْدَ جَدَّتِي</span> — chez ma grand-mère</td></tr>
<tr><td class="ar">قَبْلَ / بَعْدَ</td><td>avant / après</td><td><span class="ar">بَعْدَ الظُّهْرِ</span> — après midi</td></tr>
<tr><td class="ar">مُنْذُ</td><td>depuis (durée)</td><td><span class="ar">مُنْذُ سَنَةٍ</span> — depuis un an</td></tr>
<tr><td class="ar">حَتَّى</td><td>jusqu'à</td><td><span class="ar">حَتَّى اللَّيْلِ</span> — jusqu'à la nuit</td></tr>
<tr><td class="ar">تَحْتَ / فَوْقَ</td><td>sous / au-dessus de</td><td><span class="ar">تَحْتَ الشَّجَرَةِ</span> — sous l'arbre</td></tr>
<tr><td class="ar">أَمَامَ / وَرَاءَ</td><td>devant / derrière</td><td><span class="ar">أَمَامَ الْبَيْتِ</span> — devant la maison</td></tr>
<tr><td class="ar">بَيْنَ</td><td>entre</td><td><span class="ar">بَيْنَ الْبَيْتِ وَالْمَدْرَسَةِ</span> — entre la maison et l'école</td></tr></table>
<div class="gnote">Remarquez <span class="ar">مِنَ السُّوقِ</span> et <span class="ar">عَنِ الْعُطْلَةِ</span> : devant l'article, <span class="ar">مِنْ</span> prend une fatḥa et <span class="ar">عَنْ</span> une kasra pour enchaîner (voyelle d'appui, {{L:lire}}). Et <span class="ar">لِـ</span> + <span class="ar">الْ</span> donne <span class="ar">لِلْـ</span> ({{L:article}}).</div>

<h3>Les prépositions avec un pronom</h3>
<p>Les prépositions acceptent les suffixes de {{L:possessifs}} : <span class="ar">مَعَهُ</span> (avec lui), <span class="ar">عِنْدَنَا</span> (chez nous), <span class="ar">بِكُمْ</span> (avec vous). Quelques-unes changent un peu de forme :</p>
<table class="gtable keepv"><tr><th>Préposition</th><th>+ moi</th><th>+ lui</th><th>+ elle</th><th>Remarque</th></tr>
<tr><td class="ar">لِـ</td><td class="ar">لِي</td><td class="ar">لَهُ</td><td class="ar">لَهَا</td><td>la kasra devient fatḥa (sauf avec « moi »)</td></tr>
<tr><td class="ar">عَلَى</td><td class="ar">عَلَيَّ</td><td class="ar">عَلَيْهِ</td><td class="ar">عَلَيْهَا</td><td>le ى devient ي</td></tr>
<tr><td class="ar">إِلَى</td><td class="ar">إِلَيَّ</td><td class="ar">إِلَيْهِ</td><td class="ar">إِلَيْهَا</td><td>le ى devient ي</td></tr>
<tr><td class="ar">فِي</td><td class="ar">فِيَّ</td><td class="ar">فِيهِ</td><td class="ar">فِيهَا</td><td>ـهُ devient ـهِ après un « i »</td></tr>
<tr><td class="ar">مِنْ</td><td class="ar">مِنِّي</td><td class="ar">مِنْهُ</td><td class="ar">مِنْهَا</td><td>le ن se double avec « moi »</td></tr>
<tr><td class="ar">عَنْ</td><td class="ar">عَنِّي</td><td class="ar">عَنْهُ</td><td class="ar">عَنْهَا</td><td>idem</td></tr></table>

<h3>Dire « avoir »</h3>
<p>Point capital : l'arabe n'a <strong>pas de verbe « avoir »</strong>. On le remplace par une préposition + possesseur, en tête de phrase :</p>
<table class="gtable"><tr><th>Arabe</th><th>Littéralement</th><th>Sens</th></tr>
<tr><td class="ar">عِنْدِي أَخٌ صَغِيرٌ</td><td>chez-moi un petit frère</td><td>j'ai un petit frère</td></tr>
<tr><td class="ar">عِنْدَ جَدِّي بَقَرَةٌ</td><td>chez mon grand-père une vache</td><td>mon grand-père a une vache</td></tr>
<tr><td class="ar">لَهُ أُخْتَانِ</td><td>à-lui deux sœurs</td><td>il a deux sœurs (remarquez le duel !)</td></tr>
<tr><td class="ar">مَعِي قَلَمٌ</td><td>avec-moi un stylo</td><td>j'ai un stylo (sur moi)</td></tr></table>

<h3>Dire « il y a »</h3>
<p>Une phrase nominale ({{L:nominale}}) commence normalement par un sujet défini. Mais quand le sujet est <strong>indéfini</strong> (« un livre », « des enfants »), on ne peut pas commencer par lui : on place d'abord le complément de lieu, puis le sujet. Cette phrase « à l'envers » se traduit par <strong>« il y a »</strong> :</p>
<table class="gtable"><tr><th>Arabe</th><th>Littéralement</th><th>Sens</th></tr>
<tr><td class="ar">عَلَى الطَّاوِلَةِ كِتَابٌ</td><td>sur la table un livre</td><td>il y a un livre sur la table</td></tr>
<tr><td class="ar">فِي الْمَكْتَبَةِ كُتُبٌ كَثِيرَةٌ</td><td>dans la bibliothèque des livres nombreux</td><td>il y a beaucoup de livres à la bibliothèque</td></tr>
<tr><td class="ar">فِي الصَّفِّ عِشْرُونَ طَالِبًا</td><td>dans la classe vingt étudiants</td><td>il y a vingt étudiants dans la classe</td></tr></table>
<p>Comparez : <span class="ar">الْكِتَابُ عَلَى الطَّاوِلَةِ</span> (sujet défini en tête) = « <em>le</em> livre est sur la table ». On peut aussi utiliser <span class="ar">هُنَاكَ</span> (« là-bas », d'où « il y a ») en tête : <span class="ar">هُنَاكَ مَطْعَمٌ قَرِيبٌ</span> — il y a un restaurant tout près.</p>
<div class="gnote">Réflexe de lecture : une phrase qui commence par une préposition (<span class="ar">فِي، عَلَى، عِنْدَ، لِـ</span>…) suivie d'un nom <strong>indéfini</strong> se traduit presque toujours par « il y a » ou par « avoir ».</div>
<div class="gex"><span class="ar">عِنْدَنَا فِي الْبَيْتِ قِطَّةٌ صَغِيرَةٌ.</span> — Nous avons à la maison une petite chatte.<br><span class="ar">جَلَسْتُ عَلَى كُرْسِيٍّ تَحْتَ شَجَرَةٍ.</span> — Je me suis assis sur une chaise sous un arbre.<br><span class="ar">فِي قَرْيَتِنَا مَسْجِدٌ جَمِيلٌ.</span> — Il y a une belle mosquée dans notre village.</div>`},
{id:"present",part:"4 · Le verbe",ta:"الفعل المضارع",tav:"الْفِعْلُ الْمُضَارِعُ",t:"Le présent : préfixes et terminaisons",h:`
<p>Le verbe arabe au présent (<span class="ar">الْمُضَارِع</span>) se conjugue surtout <strong>par l'avant</strong> : c'est un préfixe qui indique la personne. C'est l'inverse du français, qui conjugue par la fin. Le duel et certains pluriels ajoutent en plus une terminaison. Une fois ce tableau connu, vous identifiez la personne de n'importe quel verbe au premier coup d'œil :</p>
<table class="gtable"><tr><th>Personne</th><th>Forme</th><th>Exemple (écrire)</th><th>Sens</th></tr>
<tr><th colspan="4">Singulier</th></tr>
<tr><td>je</td><td class="ar">أ + ـــ</td><td class="ar">أَكْتُبُ</td><td>j'écris</td></tr>
<tr><td>tu (m.)</td><td class="ar">ت + ـــ</td><td class="ar">تَكْتُبُ</td><td>tu écris</td></tr>
<tr><td>tu (f.)</td><td class="ar">ت + ـِينَ</td><td class="ar">تَكْتُبِينَ</td><td>tu écris</td></tr>
<tr><td>il</td><td class="ar">ي + ـــ</td><td class="ar">يَكْتُبُ</td><td>il écrit</td></tr>
<tr><td>elle</td><td class="ar">ت + ـــ</td><td class="ar">تَكْتُبُ</td><td>elle écrit</td></tr>
<tr><th colspan="4">Duel (deux personnes)</th></tr>
<tr><td>vous deux</td><td class="ar">ت + ـَانِ</td><td class="ar">تَكْتُبَانِ</td><td>vous écrivez (à deux)</td></tr>
<tr><td>ils deux</td><td class="ar">ي + ـَانِ</td><td class="ar">يَكْتُبَانِ</td><td>ils écrivent (tous les deux)</td></tr>
<tr><td>elles deux</td><td class="ar">ت + ـَانِ</td><td class="ar">تَكْتُبَانِ</td><td>elles écrivent (toutes les deux)</td></tr>
<tr><th colspan="4">Pluriel (trois ou plus)</th></tr>
<tr><td>nous</td><td class="ar">ن + ـــ</td><td class="ar">نَكْتُبُ</td><td>nous écrivons</td></tr>
<tr><td>vous (m. pl.)</td><td class="ar">ت + ـُونَ</td><td class="ar">تَكْتُبُونَ</td><td>vous écrivez</td></tr>
<tr><td>vous (f. pl.)</td><td class="ar">ت + ـْنَ</td><td class="ar">تَكْتُبْنَ</td><td>vous écrivez (f.)</td></tr>
<tr><td>ils</td><td class="ar">ي + ـُونَ</td><td class="ar">يَكْتُبُونَ</td><td>ils écrivent</td></tr>
<tr><td>elles</td><td class="ar">ي + ـْنَ</td><td class="ar">يَكْتُبْنَ</td><td>elles écrivent</td></tr></table>
<div class="gnote">Deux pièges classiques. 1) <span class="ar">تَكْتُبُ</span> = « tu écris » (masculin) <em>ou</em> « elle écrit ». Même forme ! Seul le contexte tranche. 2) Au duel, <span class="ar">تَكْتُبَانِ</span> = « vous deux » <em>ou</em> « elles deux » : là encore, contexte. Retenez : <span class="ar">ـِينَ</span> = tu (f.), <span class="ar">ـَانِ</span> = duel, <span class="ar">ـُونَ</span> = pluriel masculin.</div>
<p>Le présent arabe couvre à la fois le présent simple et le présent progressif français : <span class="ar">أَدْرُسُ</span> = « j'étudie » ou « je suis en train d'étudier ». Il exprime aussi l'habitude : <span class="ar">أَشْرَبُ الْحَلِيبَ كُلَّ صَبَاحٍ</span> — je bois du lait chaque matin.</p>
<h3>La voyelle du milieu</h3>
<p>Dans <span class="ar">يَكْتُبُ</span>, la voyelle placée sur l'avant-dernière lettre est une ḍamma. Elle n'est pas la même pour tous les verbes, et elle ne se devine pas : il faut l'apprendre avec chaque verbe (le dictionnaire de l'app la donne).</p>
<table class="gtable keepv"><tr><th>Passé (il)</th><th>Présent (il)</th><th>Voyelle</th><th>Sens</th></tr>
<tr><td class="ar">كَتَبَ</td><td class="ar">يَكْتُبُ</td><td>ḍamma <span class="ar">ـُ</span></td><td>écrire</td></tr>
<tr><td class="ar">ذَهَبَ</td><td class="ar">يَذْهَبُ</td><td>fatḥa <span class="ar">ـَ</span></td><td>aller</td></tr>
<tr><td class="ar">جَلَسَ</td><td class="ar">يَجْلِسُ</td><td>kasra <span class="ar">ـِ</span></td><td>s'asseoir</td></tr>
<tr><td class="ar">شَرِبَ</td><td class="ar">يَشْرَبُ</td><td>fatḥa <span class="ar">ـَ</span></td><td>boire</td></tr></table>
<div class="gnote">Vous rencontrerez aussi des présents qui commencent par <span class="ar">يُـ</span> avec une ḍamma (<span class="ar">يُسَافِرُ</span> il voyage, <span class="ar">يُحِبُّ</span> il aime) ou qui semblent avoir une lettre de moins ou de plus (<span class="ar">يَقُولُ</span> il dit, <span class="ar">يَصِلُ</span> il arrive). Les préfixes et terminaisons de ce tableau restent exactement les mêmes ; ces verbes particuliers sont expliqués dans {{L:faibles}} et {{L:formes}}.</div>
<div class="gex"><span class="ar">أَبِي يَعْمَلُ فِي الْمُسْتَشْفَى وَأُمِّي تَعْمَلُ فِي الْمَدْرَسَةِ.</span> — Mon père travaille à l'hôpital et ma mère travaille à l'école.<br><span class="ar">الْأَطْفَالُ يَلْعَبُونَ فِي الْحَدِيقَةِ.</span> — Les enfants jouent dans le jardin.<br><span class="ar">الْوَلَدَانِ يَلْعَبَانِ فِي الْحَدِيقَةِ.</span> — Les deux garçons jouent dans le jardin.</div>`},
{id:"passe",ta:"الفعل الماضي",tav:"الْفِعْلُ الْمَاضِي",t:"Le passé : les suffixes",h:`
<p>Au passé (<span class="ar">الْمَاضِي</span>), c'est l'inverse du présent : la personne est indiquée par un <strong>suffixe</strong>. La forme « il a fait » est la plus simple — c'est le verbe nu, et c'est sous cette forme que les dictionnaires citent les verbes :</p>
<table class="gtable keepv"><tr><th>Personne</th><th>Suffixe</th><th>Exemple (aller)</th><th>Sens</th></tr>
<tr><th colspan="4">Singulier</th></tr>
<tr><td>il</td><td>—</td><td class="ar">ذَهَبَ</td><td>il est allé</td></tr>
<tr><td>elle</td><td class="ar">ـَتْ</td><td class="ar">ذَهَبَتْ</td><td>elle est allée</td></tr>
<tr><td>je</td><td class="ar">ـتُ</td><td class="ar">ذَهَبْتُ</td><td>je suis allé(e)</td></tr>
<tr><td>tu (m.)</td><td class="ar">ـتَ</td><td class="ar">ذَهَبْتَ</td><td>tu es allé</td></tr>
<tr><td>tu (f.)</td><td class="ar">ـتِ</td><td class="ar">ذَهَبْتِ</td><td>tu es allée</td></tr>
<tr><th colspan="4">Duel (deux personnes)</th></tr>
<tr><td>vous deux</td><td class="ar">ـتُمَا</td><td class="ar">ذَهَبْتُمَا</td><td>vous êtes allés (à deux)</td></tr>
<tr><td>ils deux</td><td class="ar">ـَا</td><td class="ar">ذَهَبَا</td><td>ils sont allés (tous les deux)</td></tr>
<tr><td>elles deux</td><td class="ar">ـَتَا</td><td class="ar">ذَهَبَتَا</td><td>elles sont allées (toutes les deux)</td></tr>
<tr><th colspan="4">Pluriel (trois ou plus)</th></tr>
<tr><td>nous</td><td class="ar">ـنَا</td><td class="ar">ذَهَبْنَا</td><td>nous sommes allés</td></tr>
<tr><td>vous (m. pl.)</td><td class="ar">ـتُمْ</td><td class="ar">ذَهَبْتُمْ</td><td>vous êtes allés</td></tr>
<tr><td>vous (f. pl.)</td><td class="ar">ـتُنَّ</td><td class="ar">ذَهَبْتُنَّ</td><td>vous êtes allées</td></tr>
<tr><td>ils</td><td class="ar">ـُوا</td><td class="ar">ذَهَبُوا</td><td>ils sont allés</td></tr>
<tr><td>elles</td><td class="ar">ـْنَ</td><td class="ar">ذَهَبْنَ</td><td>elles sont allées</td></tr></table>
<div class="gnote">Trois pièges de lecture. 1) Sans vocalisation, <span class="ar keepv nov">ذهبت</span> peut signifier « elle est allée » (<span class="ar keepv">ذَهَبَتْ</span>), « je suis allé » (<span class="ar keepv">ذَهَبْتُ</span>) ou « tu es allé(e) » (<span class="ar keepv">ذَهَبْتَ / ذَهَبْتِ</span>) — quatre lectures ! Le contexte décide ; le bouton ـَـّ de l'app vous montre la bonne voyelle. 2) Le <span class="ar">ـُوا</span> de « ils » se termine par un alif muet qui ne se prononce pas : <span class="ar keepv">ذَهَبُوا</span> se lit comme <span class="ar keepv">ذَهَبُو</span>. 3) <span class="ar keepv">ذَهَبْنَا</span> (nous) et <span class="ar keepv">ذَهَبْنَ</span> (elles) ne diffèrent que par l'alif final : nous = <span class="ar">ـْنَا</span>, elles = <span class="ar">ـْنَ</span>.</div>
<p>Le passé arabe correspond au passé composé français dans les récits : <span class="ar">أَكَلْنَا ثُمَّ خَرَجْنَا</span> — nous avons mangé puis nous sommes sortis. Pour l'imparfait français (« nous allions »), l'arabe combine <span class="ar">كَانَ</span> et le présent : voir {{L:kana}}.</p>
<div class="gnote">Les verbes comme <span class="ar">قَالَ</span> (dire), <span class="ar">كَانَ</span> (être) ou <span class="ar">مَشَى</span> (marcher) gardent les mêmes suffixes, mais leur corps change un peu : <span class="ar">قُلْتُ</span> (j'ai dit), <span class="ar">مَشَيْنَا</span> (nous avons marché). Voir {{L:faibles}}.</div>
<div class="gex"><span class="ar">وَصَلْنَا إِلَى الْمَحَطَّةِ وَانْتَظَرْنَا الْقِطَارَ.</span> — Nous sommes arrivés à la gare et nous avons attendu le train.<br><span class="ar">دَخَلَ الطَّبِيبُ وَفَحَصَ الْمَرِيضَ.</span> — Le médecin est entré et a examiné le malade.<br><span class="ar">ذَهَبَا مَعًا إِلَى السُّوقِ.</span> — Ils sont allés (tous les deux) ensemble au marché.</div>`},
{id:"verbale",ta:"الجملة الفعلية",tav:"الْجُمْلَةُ الْفِعْلِيَّةُ",t:"La phrase verbale : l'ordre verbe – sujet",h:`
<p>À côté de la phrase nominale, l'arabe possède un deuxième modèle de phrase : la <strong>phrase verbale</strong> (<span class="ar">الْجُمْلَةُ الْفِعْلِيَّةُ</span>), qui commence par un verbe. Et là, surprise : l'ordre de base n'est pas « sujet – verbe » comme en français, mais <strong>verbe – sujet – complément</strong>.</p>
<p>Chaque élément a un nom technique qu'il faut connaître : le verbe est le <span class="ar">فِعْل</span>, le sujet du verbe est le <span class="ar">فَاعِل</span> (« celui qui fait ») et le complément d'objet direct (COD) est le <span class="ar">مَفْعُول بِه</span> (« ce qui subit l'action »). Regardez la fin des mots dans les exemples : le <span class="ar">فَاعِل</span> se termine par une ḍamma (<span class="ar">أَحْمَدُ، الْبِنْتُ</span>) et le <span class="ar">مَفْعُول بِه</span> par une fatḥa (<span class="ar">رِسَالَةً</span>). Ce n'est pas un hasard : {{L:cas}} l'explique.</p>
<div class="gex"><span class="ar">ذَهَبَ أَحْمَدُ إِلَى السُّوقِ.</span> — litt. « est-allé Ahmed au marché » = Ahmed est allé au marché.<br><span class="ar">كَتَبَتِ الْبِنْتُ رِسَالَةً.</span> — litt. « a-écrit la fille une lettre » = la fille a écrit une lettre.<br><span class="ar">وَصَلَ الْقِطَارُ فِي الظُّهْرِ.</span> — litt. « est-arrivé le train à midi ».</div>
<p>C'est extrêmement fréquent dans les récits : dès qu'une phrase commence par un verbe au passé (<span class="ar">ذَهَبَ، جَاءَ، قَالَ، وَصَلَ، جَلَسَ…</span>), attendez-vous à trouver le sujet <em>juste après</em>. Prenez l'habitude de lire ainsi : verbe → qui ? → quoi / où ?</p>
<p>Règle d'accord importante et contre-intuitive : quand le verbe est <strong>devant</strong> le sujet, il reste au <strong>singulier</strong>, même si le sujet est au duel ou au pluriel. Il s'accorde seulement en genre :</p>
<table class="gtable"><tr><th>Arabe</th><th>Analyse</th></tr>
<tr><td class="ar">ذَهَبَ الْأَوْلَادُ إِلَى الْمَدْرَسَةِ</td><td>verbe au singulier + sujet pluriel : « les enfants sont allés »</td></tr>
<tr><td class="ar">ذَهَبَ الْوَلَدَانِ إِلَى الْمَدْرَسَةِ</td><td>même règle avec un sujet au duel : « les deux garçons sont allés »</td></tr>
<tr><td class="ar">قَالَتْ أُمِّي</td><td>verbe au féminin car le sujet (<span class="ar">أُمِّي</span>) est féminin : « ma mère a dit »</td></tr>
<tr><td class="ar">جَاءَ الضُّيُوفُ وَأَكَلُوا مَعَنَا</td><td>1er verbe au singulier (avant le sujet), 2e verbe au pluriel (le sujet est déjà connu) : « les invités sont venus et ont mangé avec nous »</td></tr></table>
<div class="gnote">Les deux types de phrase coexistent partout, souvent avec une nuance : la phrase nominale (<span class="ar">أَحْمَدُ ذَهَبَ إِلَى السُّوقِ</span>) met l'accent sur <em>Ahmed</em> ; la phrase verbale (<span class="ar">ذَهَبَ أَحْمَدُ إِلَى السُّوقِ</span>) raconte simplement l'action. Les récits enchaînent les phrases verbales ; les descriptions préfèrent les phrases nominales. Repérez cette alternance dans les textes de l'app.</div>
<div class="gnote">Quand le sujet est un pronom (« je », « nous »…), il n'est pas écrit : il est déjà contenu dans la terminaison du verbe. <span class="ar">ذَهَبْنَا إِلَى السُّوقِ</span> = nous sommes allés au marché. Ajouter <span class="ar">نَحْنُ</span> sert seulement à insister.</div>`},
{id:"futur",ta:"المستقبل",tav:"الْمُسْتَقْبَلُ",t:"Le futur : سَـ et سَوْفَ",h:`
<p>Le futur arabe est d'une simplicité remarquable : on prend le présent et on colle devant le préfixe <span class="ar">سَـ</span> (pour un futur proche ou neutre) ou le mot séparé <span class="ar">سَوْفَ</span> (plus formel, futur plus lointain). Aucune nouvelle conjugaison à apprendre — le duel et le pluriel de {{L:present}} restent valables tels quels : <span class="ar">سَيَكْتُبَانِ</span> — ils écriront (tous les deux).</p>
<table class="gtable"><tr><th>Présent</th><th>Futur</th><th>Sens</th></tr>
<tr><td class="ar">أَزُورُكَ</td><td class="ar">سَأَزُورُكَ</td><td>je te rendrai visite</td></tr>
<tr><td class="ar">نُسَافِرُ</td><td class="ar">سَنُسَافِرُ</td><td>nous voyagerons</td></tr>
<tr><td class="ar">تَصِلُ الرِّسَالَةُ</td><td class="ar">سَتَصِلُ الرِّسَالَةُ</td><td>la lettre arrivera</td></tr>
<tr><td class="ar">يَتَّصِلُ بِكُمْ</td><td class="ar">سَوْفَ يَتَّصِلُ بِكُمْ</td><td>il vous appellera</td></tr></table>
<div class="gnote">Réflexe de lecture : un verbe qui commence par <span class="ar">سَأَـ، سَنَـ، سَتَـ، سَيَـ</span> est presque toujours un futur. Décollez mentalement le <span class="ar">سـ</span> et vous retrouvez le présent que vous connaissez. Le dictionnaire de l'app fait cette analyse pour vous quand vous touchez le mot.</div>
<div class="gnote">Attention aux faux futurs : certains verbes commencent par un <span class="ar">س</span> qui fait partie du mot (<span class="ar">سَافَرَ</span> il a voyagé, <span class="ar">سَكَنَ</span> il a habité). Le <span class="ar">سَـ</span> du futur est toujours suivi d'un préfixe du présent (<span class="ar">أ، ن، ت، ي</span>). Pour dire « je n'irai pas », on n'utilise pas <span class="ar">سَـ</span> mais <span class="ar">لَنْ</span> ({{L:negation}}).</div>
<div class="gex"><span class="ar">سَأَزُورُكَ فِي الْعُطْلَةِ الصَّيْفِيَّةِ.</span> — Je te rendrai visite pendant les vacances d'été.<br><span class="ar">قَالَتِ الْمُوَظَّفَةُ: الطَّائِرَةُ سَتُقْلِعُ بَعْدَ سَاعَتَيْنِ.</span> — L'employée a dit : l'avion décollera dans deux heures.</div>`},
{id:"questions",ta:"أدوات الاستفهام",tav:"أَدَوَاتُ الِاسْتِفْهَامِ",t:"Poser une question : les mots interrogatifs",h:`
<p>Poser une question en arabe est simple : le mot interrogatif se place en tête de phrase et <strong>l'ordre des mots ne change pas</strong> — pas d'inversion comme en français. <span class="ar">أَيْنَ تَسْكُنُ؟</span> = « où habites-tu ? », littéralement « où tu-habites ? ». Le point d'interrogation arabe est retourné : <span class="ar">؟</span></p>
<table class="gtable"><tr><th>Arabe</th><th>Sens</th><th>Exemple</th></tr>
<tr><td class="ar">مَا</td><td>que, quoi (devant un nom)</td><td><span class="ar">مَا اسْمُكَ؟</span> — quel est ton nom ?</td></tr>
<tr><td class="ar">مَاذَا</td><td>que, quoi (devant un verbe)</td><td><span class="ar">مَاذَا تَشْرَبُ؟</span> — que bois-tu ?</td></tr>
<tr><td class="ar">مَنْ</td><td>qui</td><td><span class="ar">مَنْ هَذَا؟</span> — qui est-ce ?</td></tr>
<tr><td class="ar">أَيْنَ</td><td>où</td><td><span class="ar">أَيْنَ الْمَحَطَّةُ؟</span> — où est la gare ?</td></tr>
<tr><td class="ar">مِنْ أَيْنَ / إِلَى أَيْنَ</td><td>d'où / vers où</td><td><span class="ar">مِنْ أَيْنَ أَنْتَ؟</span> — d'où viens-tu ?</td></tr>
<tr><td class="ar">مَتَى</td><td>quand</td><td><span class="ar">مَتَى يَصِلُ الْقِطَارُ؟</span> — quand arrive le train ?</td></tr>
<tr><td class="ar">كَيْفَ</td><td>comment</td><td><span class="ar">كَيْفَ حَالُكَ؟</span> — comment vas-tu ?</td></tr>
<tr><td class="ar">كَمْ</td><td>combien</td><td><span class="ar">كَمْ عُمْرُكَ؟</span> — quel âge as-tu ?</td></tr>
<tr><td class="ar">لِمَاذَا</td><td>pourquoi</td><td><span class="ar">لِمَاذَا تَبْكِي؟</span> — pourquoi pleures-tu ?</td></tr>
<tr><td class="ar">أَيّ</td><td>quel, lequel</td><td><span class="ar">أَيُّ كِتَابٍ؟</span> — quel livre ?</td></tr>
<tr><td class="ar">هَلْ</td><td>est-ce que (question oui / non)</td><td><span class="ar">هَلْ أَنْتَ مَرِيضٌ؟</span> — es-tu malade ?</td></tr>
<tr><td class="ar">أَ (collé)</td><td>est-ce que (comme <span class="ar">هَلْ</span>)</td><td><span class="ar">أَتُحِبُّ الشَّايَ؟</span> — aimes-tu le thé ?</td></tr></table>
<div class="gnote">Trois détails. 1) <span class="ar">هَلْ</span> et <span class="ar">أَ</span> transforment n'importe quelle affirmation en question oui / non : <span class="ar">أَنْتَ مَرِيضٌ</span> (tu es malade) → <span class="ar">هَلْ أَنْتَ مَرِيضٌ؟</span>. Le <span class="ar">أَ</span> est collé au mot suivant : ne le confondez pas avec le <span class="ar">أَ</span> de « je » du présent ({{L:present}}). 2) Attention aux jumeaux : <span class="ar keepv">مَنْ</span> (qui) et <span class="ar keepv">مِنْ</span> (de, depuis) s'écrivent pareil sans voyelles ! En tête de question c'est en général « qui », au milieu d'une phrase « de ». 3) On répond <span class="ar">نَعَمْ</span> (oui) ou <span class="ar">لَا</span> (non).</div>
<p>Les mots interrogatifs se combinent avec les prépositions : <span class="ar">مَعَ مَنْ؟</span> (avec qui ?), <span class="ar">لِمَنْ هَذَا؟</span> (à qui est-ce ?), <span class="ar">بِكَمْ؟</span> (à combien ? pour un prix), <span class="ar">مُنْذُ مَتَى؟</span> (depuis quand ?). La réponse à <span class="ar">لِمَاذَا</span> commence souvent par <span class="ar">لِأَنَّ</span> (parce que), présenté dans {{L:liaison}}.</p>
<div class="gex"><span class="ar">سَأَلْنَا السَّائِقَ: كَمْ دَقِيقَةً إِلَى الْمَحَطَّةِ؟</span> — Nous avons demandé au chauffeur : combien de minutes jusqu'à la gare ?<br><span class="ar">كَمِ السَّاعَةُ الْآنَ؟</span> — Quelle heure est-il maintenant ?<br><span class="ar">مَعَ مَنْ تَسْكُنُ؟ — أَسْكُنُ مَعَ عَائِلَتِي.</span> — Avec qui habites-tu ? — J'habite avec ma famille.</div>`},
{id:"segmentation",part:"5 · Les mots et leurs familles",ta:"تحليل الكلمة",tav:"تَحْلِيلُ الْكَلِمَةِ",t:"Découper un mot : ce qui se colle avant et après",h:`
<p>En arabe, beaucoup de petits mots ne s'écrivent pas séparément : ils se <strong>collent</strong> au mot suivant (avant) ou au mot précédent (après). Un seul « mot » écrit peut ainsi contenir une phrase entière : <span class="ar">وَسَيَكْتُبُونَهَا</span> = « et ils l'écriront ». Vous connaissez déjà tous ces morceaux ; cette leçon les rassemble pour apprendre à les <strong>décoller</strong>.</p>

<h3>1. Le schéma d'un mot arabe</h3>
<table class="gtable"><tr><th>① liaison</th><th>② question</th><th>③ petit mot collé</th><th>④ article</th><th>⑤ le mot</th><th>⑥ suffixe</th></tr>
<tr><td><span class="ar">وَ</span> et<br><span class="ar">فَ</span> alors</td><td><span class="ar">أَ</span> est-ce que</td><td><span class="ar">بِـ</span> par, en<br><span class="ar">لِـ</span> pour<br><span class="ar">كَـ</span> comme<br><span class="ar">سَـ</span> futur</td><td><span class="ar">الْـ</span> le, la</td><td>nom ou verbe</td><td>pronom :<br><span class="ar">ـِي ـنِي ـكَ ـهُ ـهَا ـنَا ـهُمْ</span>…</td></tr></table>
<p>Les cases sont toujours dans cet ordre, et la plupart du temps seules une ou deux sont remplies. Deux règles : l'article <span class="ar">الْـ</span> et les prépositions <span class="ar">بِـ لِـ كَـ</span> ne vont qu'avec des noms ; <span class="ar">سَـ</span> ne va qu'avec un verbe au présent ({{L:futur}}). Un nom qui porte <span class="ar">الْـ</span> ne prend pas de suffixe possessif : c'est l'un ou l'autre.</p>

<h3>2. Exemples décomposés</h3>
<table class="gtable"><tr><th>Mot écrit</th><th>Découpage</th><th>Sens</th></tr>
<tr><td class="ar">وَالْبَيْتُ</td><td><span class="ar">وَ + الْ + بَيْتُ</span></td><td>et la maison</td></tr>
<tr><td class="ar">فَذَهَبْنَا</td><td><span class="ar">فَ + ذَهَبْنَا</span></td><td>alors nous sommes allés</td></tr>
<tr><td class="ar">وَبِالسَّيَّارَةِ</td><td><span class="ar">وَ + بِ + الْ + سَيَّارَةِ</span></td><td>et en voiture</td></tr>
<tr><td class="ar">لِلْمَدْرَسَةِ</td><td><span class="ar">لِ + الْ + مَدْرَسَةِ</span> (le ا disparaît)</td><td>pour l'école</td></tr>
<tr><td class="ar">مَدْرَسَتُنَا</td><td><span class="ar">مَدْرَسَة + نَا</span> (ة → ت)</td><td>notre école</td></tr>
<tr><td class="ar">وَكِتَابُهُ</td><td><span class="ar">وَ + كِتَابُ + هُ</span></td><td>et son livre</td></tr>
<tr><td class="ar">سَأَزُورُكَ</td><td><span class="ar">سَ + أَزُورُ + كَ</span></td><td>je te rendrai visite</td></tr>
<tr><td class="ar">أَتُحِبُّهُ</td><td><span class="ar">أَ + تُحِبُّ + هُ</span></td><td>l'aimes-tu ?</td></tr>
<tr><td class="ar">فَحَصَنِي</td><td><span class="ar">فَحَصَ + نِي</span></td><td>il m'a examiné</td></tr>
<tr><td class="ar">وَسَيَكْتُبُونَهَا</td><td><span class="ar">وَ + سَ + يَكْتُبُونَ + هَا</span></td><td>et ils l'écriront</td></tr></table>

<h3>3. Une méthode en quatre étapes</h3>
<p>1) Au début du mot, cherchez <span class="ar">وَ</span> ou <span class="ar">فَ</span>. 2) Cherchez ensuite <span class="ar">أَ</span>, <span class="ar">بِـ</span>, <span class="ar">لِـ</span>, <span class="ar">كَـ</span>, <span class="ar">سَـ</span> ou l'article <span class="ar">الْـ</span>. 3) À la fin du mot, cherchez un suffixe pronom (et un <span class="ar">ت</span> qui serait un ancien <span class="ar">ة</span>). 4) Ce qui reste est le mot du dictionnaire. Le dictionnaire de l'app fait exactement ce travail quand vous touchez un mot dans un texte : il affiche les morceaux qu'il a décollés.</p>
<div class="gnote">Le piège : ces mêmes lettres peuvent faire partie du mot lui-même ! Dans <span class="ar">وَلَد</span> (garçon), <span class="ar">وَصَلَ</span> (il est arrivé), <span class="ar">بَيْت</span> (maison), <span class="ar">كَبِير</span> (grand), <span class="ar">لَعِبَ</span> (il a joué), <span class="ar">فَتَحَ</span> (il a ouvert) ou <span class="ar">سَافَرَ</span> (il a voyagé), la première lettre n'est pas un petit mot collé. Le test : <strong>si ce qui reste après le découpage n'est pas un mot connu, ne découpez pas</strong>. De même à la fin : le <span class="ar">ه</span> de <span class="ar">وَجْه</span> (visage) ou le <span class="ar">ك</span> de <span class="ar">سَمَك</span> (poisson) font partie du mot.</div>
<div class="gnote">Distinguez aussi les terminaisons de verbe et les suffixes pronoms : dans <span class="ar">كَتَبْتُهَا</span> (je l'ai écrite), <span class="ar">ـْتُ</span> est la terminaison du passé « je » ({{L:passe}}), puis <span class="ar">ـهَا</span> est le pronom « la ». Et « me » se dit <span class="ar">ـنِي</span> sur un verbe (<span class="ar">سَاعَدَنِي</span> — il m'a aidé), alors que « mon » se dit <span class="ar">ـِي</span> sur un nom (<span class="ar">كِتَابِي</span>).</div>
<div class="gex"><span class="ar">فَقَالَتْ لَهُ: سَأَنْتَظِرُكَ.</span> — Alors elle lui a dit : je t'attendrai. (<span class="ar">فَ + قَالَتْ</span> · <span class="ar">لَ + هُ</span> · <span class="ar">سَ + أَنْتَظِرُ + كَ</span>)<br><span class="ar">وَبِالْأَمْسِ زُرْنَاهُمْ.</span> — Et hier, nous leur avons rendu visite. (<span class="ar">وَ + بِ + الْ + أَمْسِ</span> · <span class="ar">زُرْنَا + هُمْ</span>)</div>`},
{id:"racine",ta:"الجذر والوزن",tav:"الْجَذْرُ وَالْوَزْنُ",t:"La racine et les schèmes : le secret du vocabulaire",h:`
<p>Voici la leçon qui rend tout le reste plus facile. Presque chaque mot arabe est construit sur une <strong>racine de trois consonnes</strong> (<span class="ar">الْجَذْر</span>) qui porte une idée générale, coulée dans un <strong>schème</strong> (<span class="ar">الْوَزْن</span>, un moule de voyelles et de lettres ajoutées) qui précise le sens. Prenons la racine <span class="ar nov">ك ت ب</span>, l'idée d'« écrire » :</p>
<table class="gtable"><tr><th>Mot</th><th>Sens</th><th>Rôle du schème</th></tr>
<tr><td class="ar">كَتَبَ</td><td>il a écrit</td><td>le verbe de base</td></tr>
<tr><td class="ar">كَاتِب</td><td>écrivain</td><td>celui qui fait l'action</td></tr>
<tr><td class="ar">مَكْتُوب</td><td>écrit (chose écrite), lettre</td><td>ce qui subit l'action</td></tr>
<tr><td class="ar">كِتَاب</td><td>livre</td><td>l'objet du domaine</td></tr>
<tr><td class="ar">كِتَابَة</td><td>écriture, le fait d'écrire</td><td>le nom de l'action</td></tr>
<tr><td class="ar">مَكْتَب</td><td>bureau</td><td>le lieu</td></tr>
<tr><td class="ar">مَكْتَبَة</td><td>bibliothèque, librairie</td><td>le lieu, version féminine</td></tr></table>

<h3>1. Comment on écrit un schème : le modèle <span class="ar nov">ف ع ل</span></h3>
<p>Pour parler d'un schème sans choisir de racine précise, les grammairiens utilisent la racine <span class="ar nov">ف ع ل</span> (« faire ») comme modèle : <span class="ar">ف</span> = 1<sup>re</sup> lettre de la racine, <span class="ar">ع</span> = 2<sup>e</sup>, <span class="ar">ل</span> = 3<sup>e</sup>. Tout le reste (voyelles, lettres ajoutées) appartient au schème. Ainsi :</p>
<table class="gtable keepv"><tr><th>Schème</th><th>Racine <span class="ar nov">ك ت ب</span></th><th>Racine <span class="ar nov">د ر س</span></th><th>Racine <span class="ar nov">ل ع ب</span></th></tr>
<tr><td class="ar">فَاعِل</td><td class="ar">كَاتِب</td><td class="ar">دَارِس</td><td class="ar">لَاعِب</td></tr>
<tr><td class="ar">مَفْعُول</td><td class="ar">مَكْتُوب</td><td class="ar">مَدْرُوس</td><td class="ar">—</td></tr>
<tr><td class="ar">مَفْعَل / مَفْعَلَة</td><td class="ar">مَكْتَب</td><td class="ar">مَدْرَسَة</td><td class="ar">مَلْعَب</td></tr></table>
<p>C'est pour cela que le sujet du verbe s'appelle <span class="ar">فَاعِل</span> ({{L:verbale}}) : c'est littéralement « celui qui fait ». Cette notation reviendra pour les formes du verbe ({{L:formes}}) et pour le comparatif <span class="ar">أَفْعَل</span> ({{L:tafdil}}).</p>

<h3>2. Les schèmes les plus rentables</h3>
<p>• <span class="ar">فَاعِل</span> = <strong>celui qui fait</strong> : <span class="ar">طَالِب</span> (celui qui demande [le savoir] = étudiant), <span class="ar">سَائِق</span> (celui qui conduit), <span class="ar">عَامِل</span> (celui qui travaille = ouvrier), <span class="ar">لَاعِب</span> (joueur).</p>
<p>• <span class="ar">مَفْعُول</span> = <strong>ce qui subit l'action</strong> : <span class="ar">مَكْتُوب</span> (écrit), <span class="ar">مَفْتُوح</span> (ouvert), <span class="ar">مَشْهُور</span> (connu).</p>
<p>• <span class="ar">مَـ</span> + racine (<span class="ar">مَفْعَل، مَفْعِل، مَفْعَلَة</span>) = souvent un <strong>lieu</strong> : <span class="ar">مَدْرَسَة</span> (lieu où l'on étudie), <span class="ar">مَطْبَخ</span> (lieu où l'on cuisine), <span class="ar">مَلْعَب</span> (lieu où l'on joue), <span class="ar">مَسْجِد</span> (lieu où l'on se prosterne) ; avec un <span class="ar">مِـ</span>, souvent un <strong>outil</strong> : <span class="ar">مِفْتَاح</span> (outil pour ouvrir).</p>
<p>• Le <strong>nom d'action</strong> (<span class="ar">الْمَصْدَر</span>) : le « fait de… ». Il correspond souvent à notre infinitif ou à un nom en « -tion » : <span class="ar">كِتَابَة</span> (écrire, l'écriture), <span class="ar">قِرَاءَة</span> (lire, la lecture), <span class="ar">سِبَاحَة</span> (la natation), <span class="ar">دِرَاسَة</span> (les études), <span class="ar">أَكْل</span> (le fait de manger), <span class="ar">نَوْم</span> (le sommeil). Pour les verbes de base, sa forme varie et s'apprend avec le verbe. On l'utilise beaucoup après les verbes d'opinion : <span class="ar">أُحِبُّ الْقِرَاءَةَ</span> — j'aime lire (litt. « j'aime la lecture »).</p>
<div class="gnote">Application pratique : devant un mot inconnu, isolez mentalement les trois consonnes de la racine (ignorez <span class="ar">ال</span>, le <span class="ar">مـ</span> du début, le <span class="ar">ة</span> final, les voyelles longues ajoutées). Si vous connaissez un mot de la même famille, vous devinez le sens. <span class="ar">مَطْعَم</span> ? Racine <span class="ar nov">ط ع م</span> comme <span class="ar">طَعَام</span> (nourriture) + schème de lieu = « lieu de la nourriture » = restaurant.</div>
<div class="gnote">Quand une racine contient <span class="ar">و</span> ou <span class="ar">ي</span>, on ne voit parfois que deux consonnes : <span class="ar">قَالَ</span> (racine <span class="ar nov">ق و ل</span>), <span class="ar">مَشَى</span> (racine <span class="ar nov">م ش ي</span>). Ces verbes « faibles » font l'objet de {{L:faibles}}.</div>
<div class="gex"><span class="ar">دَرَسَ ← مَدْرَسَة ← دِرَاسَة</span> — étudier → école → études.<br><span class="ar">سَبَحَ ← مَسْبَح ← سِبَاحَة</span> — nager → piscine → natation.<br><span class="ar">لَعِبَ ← لَاعِب ← مَلْعَب</span> — jouer → joueur → terrain de jeu.</div>`},
{id:"faibles",ta:"الفعل المعتل",tav:"الْفِعْلُ الْمُعْتَلُّ",t:"Les verbes irréguliers (verbes « faibles »)",h:`
<p>Les verbes des leçons précédentes (<span class="ar">كَتَبَ، ذَهَبَ، جَلَسَ</span>) ont trois consonnes « solides » qui ne bougent jamais : on les appelle verbes <strong>sains</strong> (<span class="ar">صَحِيح</span>). Mais quand la racine contient un <span class="ar">و</span> ou un <span class="ar">ي</span> (les « lettres faibles », <span class="ar">حُرُوفُ الْعِلَّةِ</span>), ces lettres se transforment en voyelle longue, en voyelle courte, ou disparaissent. Ce sont les verbes <strong>faibles</strong> (<span class="ar">مُعْتَلّ</span>). Ils sont peu nombreux mais <strong>très fréquents</strong> : dire, être, venir, marcher… Bonne nouvelle : les préfixes et suffixes de {{L:present}} et {{L:passe}} ne changent pas ; seul le corps du verbe bouge.</p>

<h3>1. Le <span class="ar">و</span> au début disparaît au présent (verbe « assimilé », <span class="ar">مِثَال</span>)</h3>
<table class="gtable keepv"><tr><th>Passé (il)</th><th>Présent (il)</th><th>Racine</th><th>Sens</th></tr>
<tr><td class="ar">وَصَلَ</td><td class="ar">يَصِلُ</td><td class="ar nov">و ص ل</td><td>arriver</td></tr>
<tr><td class="ar">وَجَدَ</td><td class="ar">يَجِدُ</td><td class="ar nov">و ج د</td><td>trouver</td></tr>
<tr><td class="ar">وَضَعَ</td><td class="ar">يَضَعُ</td><td class="ar nov">و ض ع</td><td>poser, mettre</td></tr>
<tr><td class="ar">وَقَفَ</td><td class="ar">يَقِفُ</td><td class="ar nov">و ق ف</td><td>s'arrêter, se tenir debout</td></tr></table>
<p>Au passé, rien de spécial (<span class="ar">وَصَلْنَا</span>, nous sommes arrivés). Au présent, le <span class="ar">و</span> tombe : <span class="ar">أَصِلُ، تَصِلُ، نَصِلُ، يَصِلُونَ</span>. Indice : un présent avec seulement deux consonnes après le préfixe cache souvent une racine en <span class="ar">و</span>.</p>

<h3>2. Le <span class="ar">و</span> / <span class="ar">ي</span> au milieu devient une voyelle longue (verbe « creux », <span class="ar">أَجْوَف</span>)</h3>
<p>Au passé, on voit un <span class="ar">ا</span> au milieu : <span class="ar">قَالَ</span> (dire, racine <span class="ar nov">ق و ل</span>), <span class="ar">كَانَ</span> (être, <span class="ar nov">ك و ن</span>), <span class="ar">زَارَ</span> (rendre visite, <span class="ar nov">ز و ر</span>), <span class="ar">نَامَ</span> (dormir, <span class="ar nov">ن و م</span>), <span class="ar">صَارَ</span> (devenir, <span class="ar nov">ص ي ر</span>), <span class="ar">بَاعَ</span> (vendre, <span class="ar nov">ب ي ع</span>). Ce <span class="ar">ا</span> long devient une voyelle <strong>courte</strong> dès que le suffixe commence par une consonne (je, tu, nous, vous) :</p>
<table class="gtable keepv"><tr><th>Personne</th><th>dire</th><th>être</th><th>devenir</th><th>dormir</th></tr>
<tr><td>il</td><td class="ar">قَالَ</td><td class="ar">كَانَ</td><td class="ar">صَارَ</td><td class="ar">نَامَ</td></tr>
<tr><td>elle</td><td class="ar">قَالَتْ</td><td class="ar">كَانَتْ</td><td class="ar">صَارَتْ</td><td class="ar">نَامَتْ</td></tr>
<tr><td>ils</td><td class="ar">قَالُوا</td><td class="ar">كَانُوا</td><td class="ar">صَارُوا</td><td class="ar">نَامُوا</td></tr>
<tr><td>je</td><td class="ar">قُلْتُ</td><td class="ar">كُنْتُ</td><td class="ar">صِرْتُ</td><td class="ar">نِمْتُ</td></tr>
<tr><td>nous</td><td class="ar">قُلْنَا</td><td class="ar">كُنَّا</td><td class="ar">صِرْنَا</td><td class="ar">نِمْنَا</td></tr>
<tr><td>présent (il)</td><td class="ar">يَقُولُ</td><td class="ar">يَكُونُ</td><td class="ar">يَصِيرُ</td><td class="ar">يَنَامُ</td></tr></table>
<p>Au présent, la lettre faible réapparaît comme voyelle longue : <span class="ar">يَقُولُ، أَقُولُ، تَقُولِينَ، يَقُولُونَ</span>. Dans <span class="ar">كُنَّا</span>, le <span class="ar">ن</span> de la racine et celui de <span class="ar">ـنَا</span> se fondent en un <span class="ar">نّ</span>.</p>

<h3>3. La lettre faible à la fin (verbe « défectueux », <span class="ar">نَاقِص</span>)</h3>
<table class="gtable keepv"><tr><th>Passé (il)</th><th>Passé (je)</th><th>Passé (ils)</th><th>Présent (il)</th><th>Sens</th></tr>
<tr><td class="ar">مَشَى</td><td class="ar">مَشَيْتُ</td><td class="ar">مَشَوْا</td><td class="ar">يَمْشِي</td><td>marcher</td></tr>
<tr><td class="ar">بَكَى</td><td class="ar">بَكَيْتُ</td><td class="ar">بَكَوْا</td><td class="ar">يَبْكِي</td><td>pleurer</td></tr>
<tr><td class="ar">دَعَا</td><td class="ar">دَعَوْتُ</td><td class="ar">دَعَوْا</td><td class="ar">يَدْعُو</td><td>inviter, invoquer</td></tr>
<tr><td class="ar">نَسِيَ</td><td class="ar">نَسِيتُ</td><td class="ar">نَسُوا</td><td class="ar">يَنْسَى</td><td>oublier</td></tr>
<tr><td class="ar">بَقِيَ</td><td class="ar">بَقِيتُ</td><td class="ar">بَقُوا</td><td class="ar">يَبْقَى</td><td>rester</td></tr></table>
<p>À retenir : le <span class="ar">ى</span> final du passé redevient <span class="ar">ي</span> devant un suffixe (<span class="ar">مَشَى ← مَشَيْنَا</span>, {{L:lire}}) ; au présent, le verbe finit par une voyelle longue (<span class="ar">ـِي، ـُو، ـَى</span>) au lieu de la ḍamma : <span class="ar">يَمْشِي</span> et non <span class="ar nov">يمشُ</span>. Au pluriel, cette voyelle s'efface devant la terminaison : <span class="ar">يَمْشُونَ</span> (ils marchent).</p>

<h3>4. Les verbes à hamza et les verbes « doublés »</h3>
<p>Les verbes dont la racine contient une hamza sont presque réguliers ; seul le support de la hamza change ({{L:lire}}) : <span class="ar">أَكَلَ / يَأْكُلُ</span> (manger), <span class="ar">أَخَذَ / يَأْخُذُ</span> (prendre), <span class="ar">سَأَلَ / يَسْأَلُ</span> (demander), <span class="ar">قَرَأَ / يَقْرَأُ</span> (lire). Au présent « je », les deux hamzas se fondent en <span class="ar">آ</span> : <span class="ar">آكُلُ</span> (je mange), <span class="ar">آخُذُ</span> (je prends).</p>
<p>Quand les 2<sup>e</sup> et 3<sup>e</sup> lettres de la racine sont identiques, elles s'écrivent avec une shadda : <span class="ar">رَدَّ / يَرُدُّ</span> (répondre, racine <span class="ar nov">ر د د</span>), <span class="ar">مَدَّ / يَمُدُّ</span> (tendre). Devant un suffixe à consonne, elles se séparent : <span class="ar">رَدَدْتُ</span> (j'ai répondu). Le très fréquent <span class="ar">يُحِبُّ</span> (il aime, <span class="ar nov">ح ب ب</span>) appartient à cette famille.</p>

<h3>5. Les plus fréquents, à connaître par cœur</h3>
<table class="gtable keepv"><tr><th>Passé (il)</th><th>Passé (je)</th><th>Présent (il)</th><th>Sens</th></tr>
<tr><td class="ar">قَالَ</td><td class="ar">قُلْتُ</td><td class="ar">يَقُولُ</td><td>dire</td></tr>
<tr><td class="ar">كَانَ</td><td class="ar">كُنْتُ</td><td class="ar">يَكُونُ</td><td>être</td></tr>
<tr><td class="ar">زَارَ</td><td class="ar">زُرْتُ</td><td class="ar">يَزُورُ</td><td>rendre visite</td></tr>
<tr><td class="ar">جَاءَ</td><td class="ar">جِئْتُ</td><td class="ar">يَجِيءُ</td><td>venir</td></tr>
<tr><td class="ar">أَتَى</td><td class="ar">أَتَيْتُ</td><td class="ar">يَأْتِي</td><td>venir</td></tr>
<tr><td class="ar">رَأَى</td><td class="ar">رَأَيْتُ</td><td class="ar">يَرَى</td><td>voir (la hamza disparaît au présent)</td></tr>
<tr><td class="ar">وَصَلَ</td><td class="ar">وَصَلْتُ</td><td class="ar">يَصِلُ</td><td>arriver</td></tr>
<tr><td class="ar">مَشَى</td><td class="ar">مَشَيْتُ</td><td class="ar">يَمْشِي</td><td>marcher</td></tr>
<tr><td class="ar">نَسِيَ</td><td class="ar">نَسِيتُ</td><td class="ar">يَنْسَى</td><td>oublier</td></tr></table>
<div class="gnote">Comment retrouver la racine d'un verbe faible ? Si vous ne voyez que deux consonnes et une voyelle longue au milieu (<span class="ar">قَالَ، يَقُولُ</span>), pensez à un <span class="ar">و</span> ou un <span class="ar">ي</span> au milieu. Si le verbe finit par <span class="ar">ى</span>, <span class="ar">ا</span> ou <span class="ar">ـِي</span> (<span class="ar">مَشَى، يَمْشِي</span>), pensez à une lettre faible à la fin. Si un présent n'a que deux consonnes (<span class="ar">يَصِلُ</span>), pensez à un <span class="ar">و</span> au début. Le dictionnaire de l'app donne toujours la forme de base. Après certains mots (<span class="ar">لَمْ</span>, par exemple), ces verbes raccourcissent encore : ce sera vu dans {{L:modes}}.</div>
<div class="gex"><span class="ar">قَالَتْ أُمِّي: نِمْتُ جَيِّدًا.</span> — Ma mère a dit : j'ai bien dormi.<br><span class="ar">نَمْشِي إِلَى الْمَدْرَسَةِ كُلَّ يَوْمٍ.</span> — Nous marchons jusqu'à l'école chaque jour.<br><span class="ar">وَصَلْنَا فِي الْمَسَاءِ وَوَجَدْنَا الْبَابَ مَفْتُوحًا.</span> — Nous sommes arrivés le soir et nous avons trouvé la porte ouverte.</div>`},
{id:"formes",ta:"أوزان الفعل",tav:"أَوْزَانُ الْفِعْلِ",t:"Les formes du verbe : une racine, plusieurs verbes",h:`
<p>Avec une même racine ({{L:racine}}), l'arabe ne fabrique pas seulement des noms : il fabrique aussi <strong>plusieurs verbes</strong>, en ajoutant au verbe de base une shadda, un <span class="ar">ا</span>, un <span class="ar">أَ</span>, un <span class="ar">تَـ</span>, un <span class="ar">اِنْـ</span>, un <span class="ar">اِسْتَـ</span>… Chaque moule (<span class="ar">وَزْن</span>) apporte une nuance de sens. Les grammaires occidentales les numérotent de I à X ; la forme I est le verbe de base. Vous en rencontrez dans presque chaque texte : <span class="ar">سَافَرَ</span> (voyager), <span class="ar">اِشْتَرَى</span> (acheter), <span class="ar">اِنْتَظَرَ</span> (attendre), <span class="ar">اِسْتَيْقَظَ</span> (se réveiller)…</p>
<table class="gtable keepv"><tr><th>Forme</th><th>Passé (il)</th><th>Présent (il)</th><th>Nuance habituelle</th><th>Exemples</th></tr>
<tr><td>I</td><td class="ar">فَعَلَ</td><td class="ar">يَفْعَلُ / يَفْعُلُ / يَفْعِلُ</td><td>sens de base</td><td><span class="ar">دَرَسَ / يَدْرُسُ</span> étudier · <span class="ar">عَلِمَ</span> savoir</td></tr>
<tr><td>II</td><td class="ar">فَعَّلَ</td><td class="ar">يُفَعِّلُ</td><td>faire faire, intensif (shadda sur la 2<sup>e</sup> lettre)</td><td><span class="ar">دَرَّسَ / يُدَرِّسُ</span> enseigner (faire étudier) · <span class="ar">عَلَّمَ / يُعَلِّمُ</span> enseigner</td></tr>
<tr><td>III</td><td class="ar">فَاعَلَ</td><td class="ar">يُفَاعِلُ</td><td>faire avec / envers quelqu'un (ā après la 1<sup>re</sup> lettre)</td><td><span class="ar">سَافَرَ / يُسَافِرُ</span> voyager · <span class="ar">سَاعَدَ / يُسَاعِدُ</span> aider · <span class="ar">شَاهَدَ / يُشَاهِدُ</span> regarder</td></tr>
<tr><td>IV</td><td class="ar">أَفْعَلَ</td><td class="ar">يُفْعِلُ</td><td>faire faire (hamza devant)</td><td><span class="ar">أَرْسَلَ / يُرْسِلُ</span> envoyer · <span class="ar">أَقْلَعَ / يُقْلِعُ</span> décoller · <span class="ar">أَحَبَّ / يُحِبُّ</span> aimer · <span class="ar">أَرَادَ / يُرِيدُ</span> vouloir</td></tr>
<tr><td>V</td><td class="ar">تَفَعَّلَ</td><td class="ar">يَتَفَعَّلُ</td><td>réfléchi de II (« se faire… »)</td><td><span class="ar">تَعَلَّمَ / يَتَعَلَّمُ</span> apprendre (se faire enseigner) · <span class="ar">تَكَلَّمَ / يَتَكَلَّمُ</span> parler · <span class="ar">تَوَقَّفَ / يَتَوَقَّفُ</span> s'arrêter</td></tr>
<tr><td>VI</td><td class="ar">تَفَاعَلَ</td><td class="ar">يَتَفَاعَلُ</td><td>réciproque (« l'un l'autre »)</td><td><span class="ar">تَعَاوَنَ / يَتَعَاوَنُ</span> coopérer · <span class="ar">تَقَابَلَ / يَتَقَابَلُ</span> se rencontrer</td></tr>
<tr><td>VII</td><td class="ar">اِنْفَعَلَ</td><td class="ar">يَنْفَعِلُ</td><td>sens passif ou réfléchi</td><td><span class="ar">اِنْكَسَرَ / يَنْكَسِرُ</span> se casser · <span class="ar">اِنْطَلَقَ / يَنْطَلِقُ</span> partir, démarrer</td></tr>
<tr><td>VIII</td><td class="ar">اِفْتَعَلَ</td><td class="ar">يَفْتَعِلُ</td><td>réfléchi, « pour soi » (un <span class="ar">ت</span> après la 1<sup>re</sup> lettre)</td><td><span class="ar">اِنْتَظَرَ / يَنْتَظِرُ</span> attendre · <span class="ar">اِشْتَرَى / يَشْتَرِي</span> acheter · <span class="ar">اِسْتَمَعَ / يَسْتَمِعُ</span> écouter</td></tr>
<tr><td>X</td><td class="ar">اِسْتَفْعَلَ</td><td class="ar">يَسْتَفْعِلُ</td><td>demander, utiliser, considérer</td><td><span class="ar">اِسْتَعْمَلَ / يَسْتَعْمِلُ</span> utiliser · <span class="ar">اِسْتَقْبَلَ / يَسْتَقْبِلُ</span> accueillir · <span class="ar">اِسْتَيْقَظَ / يَسْتَيْقِظُ</span> se réveiller</td></tr></table>
<p>(La forme IX, <span class="ar">اِفْعَلَّ</span>, sert surtout aux couleurs — <span class="ar">اِحْمَرَّ</span>, rougir — et reste rare.)</p>
<div class="gnote">Les nuances sont des tendances, pas des lois : le sens exact s'apprend avec chaque verbe. Mais connaître la racine aide énormément : <span class="ar">اِنْتَظَرَ</span> (attendre) vient de <span class="ar nov">ن ظ ر</span> (regarder), <span class="ar">اِسْتَعْمَلَ</span> (utiliser) de <span class="ar nov">ع م ل</span> (travailler), <span class="ar">عَلَّمَ / تَعَلَّمَ</span> (enseigner / apprendre) de <span class="ar nov">ع ل م</span> (savoir).</div>

<h3>Reconnaître la forme d'un verbe au présent</h3>
<table class="gtable"><tr><th>Indice</th><th>Forme</th><th>Exemple</th></tr>
<tr><td>préfixe avec une <strong>ḍamma</strong> : <span class="ar">يُـ أُـ تُـ نُـ</span></td><td>II, III ou IV</td><td><span class="ar">يُدَرِّسُ، أُسَافِرُ، نُرِيدُ</span></td></tr>
<tr><td><span class="ar">يَتَـ</span></td><td>V ou VI</td><td><span class="ar">يَتَكَلَّمُ، يَتَعَاوَنُونَ</span></td></tr>
<tr><td><span class="ar">يَنْـ</span> (+ 3 lettres de racine)</td><td>VII</td><td><span class="ar">يَنْطَلِقُ</span></td></tr>
<tr><td>un <span class="ar">تَـ</span> après la 1<sup>re</sup> lettre de la racine</td><td>VIII</td><td><span class="ar">يَنْتَظِرُ، يَشْتَرِي</span></td></tr>
<tr><td><span class="ar">يَسْتَـ</span></td><td>X</td><td><span class="ar">يَسْتَعْمِلُ</span></td></tr></table>
<p>Au passé, les formes VII, VIII et X commencent par un <strong>alif waṣl</strong> ({{L:lire}}) : <span class="ar">اِنْطَلَقَ، اِشْتَرَى، اِسْتَعْمَلَ</span> — au milieu d'une phrase, il ne se prononce pas : <span class="ar">ثُمَّ اشْتَرَيْنَا</span>. La forme IV, elle, commence par une vraie hamza : <span class="ar">أَرْسَلَ</span>.</p>
<div class="gnote">Piège de la forme VIII : quand la racine commence par <span class="ar">و</span>, celui-ci se fond avec le <span class="ar">ت</span> : <span class="ar">اِتَّصَلَ / يَتَّصِلُ</span> (téléphoner, contacter ; racine <span class="ar nov">و ص ل</span>). Et attention aux faux amis : dans <span class="ar">يَنْظُرُ</span> (il regarde, forme I), le <span class="ar">ن</span> fait partie de la racine <span class="ar nov">ن ظ ر</span>.</div>

<h3>Les mots en مُـ</h3>
<p>Chaque forme dérivée produit aussi un participe qui commence par <span class="ar">مُـ</span> : « celui qui fait » (voyelle <span class="ar">ـِ</span> avant la dernière lettre) et « ce qui est fait » (voyelle <span class="ar">ـَ</span>). Beaucoup de noms de métiers en viennent :</p>
<table class="gtable"><tr><th>Forme</th><th>Celui qui fait</th><th>Ce qui est fait</th><th>Nom d'action</th></tr>
<tr><td>II</td><td><span class="ar">مُعَلِّم، مُدَرِّس</span> enseignant</td><td><span class="ar">مُوَظَّف</span> employé</td><td><span class="ar">تَعْلِيم</span> enseignement</td></tr>
<tr><td>III</td><td><span class="ar">مُسَافِر</span> voyageur</td><td>—</td><td><span class="ar">مُسَاعَدَة</span> aide</td></tr>
<tr><td>IV</td><td><span class="ar">مُرْسِل</span> expéditeur</td><td><span class="ar">مُرْسَل</span> envoyé</td><td><span class="ar">إِرْسَال</span> envoi</td></tr>
<tr><td>V</td><td><span class="ar">مُتَكَلِّم</span> celui qui parle</td><td>—</td><td><span class="ar">تَعَلُّم</span> apprentissage</td></tr>
<tr><td>VIII</td><td><span class="ar">مُنْتَظِر</span> celui qui attend</td><td>—</td><td><span class="ar">اِنْتِظَار</span> attente</td></tr>
<tr><td>X</td><td><span class="ar">مُسْتَعْمِل</span> utilisateur</td><td><span class="ar">مُسْتَعْمَل</span> utilisé, d'occasion</td><td><span class="ar">اِسْتِعْمَال</span> utilisation</td></tr></table>
<div class="gex"><span class="ar">يُسَافِرُ أَبِي كَثِيرًا وَيَتَّصِلُ بِنَا كُلَّ مَسَاءٍ.</span> — Mon père voyage beaucoup et il nous appelle chaque soir.<br><span class="ar">اِنْتَظَرْنَا الْحَافِلَةَ ثُمَّ اشْتَرَيْنَا التَّذَاكِرَ.</span> — Nous avons attendu le bus puis nous avons acheté les billets.<br><span class="ar">أَتَعَلَّمُ الْعَرَبِيَّةَ وَأَسْتَعْمِلُ هَذَا التَّطْبِيقَ.</span> — J'apprends l'arabe et j'utilise cette application.</div>`},
{id:"cas",part:"6 · Les terminaisons : l'iʿrāb",ta:"إعراب الاسم",tav:"إِعْرَابُ الِاسْمِ",t:"L'iʿrāb (1) : les cas du nom (مَرْفُوع، مَنْصُوب، مَجْرُور)",h:`
