    '<div class="cgrid2">'+G.map(g=>'<div class="ccard"><div class="cpair"><div>'+cSay(g[0])+cA(g[0],1)+'<div class="cfr">'+g[1]+'</div></div><div class="carrow">↔</div><div>'+cSay(g[2])+cA(g[2],1)+'<div class="cfr">'+g[3]+'</div></div></div></div>').join('')+'</div>'+
    cTeam('<strong>Tour de salle :</strong> chacun se lève et salue deux voisins. L\'un dit <span class="ar">السَّلَامُ عَلَيْكُمْ</span>, l\'autre répond <span class="ar">وَعَلَيْكُمُ السَّلَامُ</span>, puis <span class="ar">كَيْفَ حَالُكَ؟</span> — <span class="ar">بِخَيْرٍ، وَالْحَمْدُ لِلَّهِ</span>.')+
    cAsk('Pourquoi dit-on <span class="ar">حَالُكَ</span> à un homme et <span class="ar">حَالُكِ</span> à une femme ? Qu\'est-ce qui change ? '+cRv('Seule la petite voyelle sur le ك change : ـكَ (« ka ») pour un homme, ـكِ (« ki ») pour une femme. L\'arabe distingue souvent masculin et féminin, même pour « tu » !'))+
    cNote('<p>Objectif : mettre tout le monde à l\'aise et faire parler chacun dès la première minute. Faites écouter chaque formule avec 🔊, faites répéter en chœur deux fois, puis lancez le tour de salle (3–4 min). Gardez la question sur ـكَ / ـكِ pour la fin : elle prépare la grammaire de l\'étape 5.</p>');}},

  {ar:'الْيَوْمُ الْأَوَّلُ',t:'Le texte : on lit ensemble',min:20,h:()=>{
    const theatre=CL.theatre;
    let body;
    if(!theatre){
      body=STORY.map((p,i)=>'<div class="cpara"><div class="cpara-h"><span class="badge">Lecteur '+(i+1)+'</span>'+cSay(storyPara(p))+'</div><p class="ar cread">'+renderAr(storyPara(p))+'</p><div class="cfr">'+cRv('🇫🇷 '+esc(p.fr))+'</div></div>').join('');
    }else{
      const roles=Object.keys(SPK).map(k=>'<span class="crole" style="--c:'+SPK[k][2]+'">'+SPK[k][0]+' · <span class="ar">'+SPK[k][1]+'</span></span>').join('');
      body='<div class="croles">'+roles+'</div>'+STORY.map(p=>p.l.map(([s,t])=>'<div class="cline" style="--c:'+SPK[s][2]+'"><span class="cwho">'+SPK[s][0]+'</span><span class="ar cread">'+renderAr(t)+'</span></div>').join('')).join('<hr class="csep">');
    }
    return '<div class="ctoggle"><button class="'+(theatre?'btn-ghost':'btn')+'" onclick="CL.theatre=false;coursStep()">📖 Lecture par paragraphes</button><button class="'+(theatre?'btn':'btn-ghost')+'" onclick="CL.theatre=true;coursStep()">🎭 Lecture théâtrale (rôles)</button></div>'+
    cAsk('<strong>Avant de lire :</strong> regardez le texte sans le lire. Combien y a-t-il de paragraphes ? Repérez les guillemets « » : que nous disent-ils ? '+cRv('10 paragraphes. Les guillemets « » montrent que quelqu\'un parle : il y a donc des dialogues, comme au théâtre.'))+
    '<div class="cstory">'+body+'</div>'+
    cAsk('Quel est le titre de l\'histoire ? Que veut dire <span class="ar">الْأَوَّلُ</span> ? Devinez à partir du texte. '+cRv('<span class="ar">الْيَوْمُ الْأَوَّلُ</span> = « le premier jour ».'));
  },note:'<p><strong>1re lecture (≈ 10 min), par paragraphes :</strong> pour chaque paragraphe, faites d\'abord écouter avec 🔊, puis un élève différent le lit à voix haute (Lecteur 1, Lecteur 2…). Avant de révéler la traduction, demandez à la classe ce qu\'elle a compris : des noms ? des villes ? des métiers ?</p><p><strong>2e lecture (≈ 10 min), théâtrale :</strong> distribuez les 8 rôles (le narrateur, le professeur Omar, Youssef, Mariam, Karim, Sara, Fatima, et « tous les élèves » pour la classe entière). Chacun ne lit que ses répliques, en jouant le ton. Les mots du texte se touchent pour afficher leur traduction.</p>'},

  {ar:'هَلْ فَهِمْتُمْ؟',t:'Avez-vous compris ?',min:15,h:()=>{
    const qui=[['هِيَ طَبِيبَةٌ مِنْ لِيُون.','مَرْيَمُ'],['هُوَ مِنَ الْمَغْرِبِ، مِنْ مَدِينَةِ فَاسَ.','الْأُسْتَاذُ عُمَرُ'],['هُوَ طَالِبٌ فِي الْجَامِعَةِ.','يُوسُفُ'],['هِيَ جَدَّةٌ، وَبَيْتُهَا قَرِيبٌ مِنَ الْمَسْجِدِ.','فَاطِمَةُ'],['هُوَ مُهَنْدِسٌ مِنْ تُونِسَ.','كَرِيمٌ'],['هِيَ طَالِبَةٌ فِي الْمَدْرَسَةِ.','سَارَةُ']];
    const vf=[['يُوسُفُ مُهَنْدِسٌ.',0,'Faux : يُوسُفُ طَالِبٌ.'],['الْأُسْتَاذُ مِنَ الْمَغْرِبِ.',1,'Vrai.'],['سَارَةُ أُخْتُ كَرِيمٍ.',1,'Vrai : « وَهَذِهِ أُخْتِي سَارَةُ ».'],['فَاطِمَةُ طَبِيبَةٌ.',0,'Faux : فَاطِمَةُ جَدَّةٌ. La médecin, c\'est مَرْيَمُ.'],['مَرْيَمُ مِنْ تُونِسَ.',0,'Faux : مَرْيَمُ مِنْ لِيُون.'],['الصَّفُّ فِي الْمَسْجِدِ.',1,'Vrai.']];
    const qs=[['مَا اسْمُ الْأُسْتَاذِ؟','Comment s\'appelle le professeur ?','اِسْمُهُ عُمَرُ.'],['مِنْ أَيْنَ مَرْيَمُ؟','D\'où vient Mariam ?','هِيَ مِنْ لِيُون.'],['مَنْ سَارَةُ؟','Qui est Sara ?','هِيَ أُخْتُ كَرِيمٍ، وَهِيَ طَالِبَةٌ.'],['كَيْفَ الدَّرْسُ؟','Comment est la leçon ?','الدَّرْسُ سَهْلٌ!']];
    return '<h3>1. Qui est-ce ? <span class="ar">مَنْ هَذَا؟ مَنْ هَذِهِ؟</span></h3><div class="cgrid3">'+qui.map(q=>'<div class="ccard">'+cSay(q[0])+cA(q[0],1)+'<div class="cans">→ '+cRv(cA(q[1],1))+'</div></div>').join('')+'</div>'+
    '<h3>2. Vrai ou faux ? <span class="ar">صَحِيحٌ أَمْ خَطَأٌ؟</span></h3><p class="cfr">Toute la classe vote : ✋ main levée = vrai, ✊ poing fermé = faux. Puis on révèle.</p><div class="cgrid2">'+vf.map(v=>'<div class="ccard">'+cA(v[0],1)+'<div class="cans">'+cRv((v[1]?'✅ ':'❌ ')+esc(v[2]))+'</div></div>').join('')+'</div>'+
    '<h3>3. Questions en arabe</h3>'+cTeam('Par deux : lisez la question, cherchez la réponse dans le texte, puis répondez <strong>en arabe</strong> à voix haute.')+
    qs.map(q=>'<div class="ccard crow">'+cSay(q[0])+cA(q[0],1)+'<span class="cfr">'+q[1]+'</span><div class="cans">'+cRv(cA(q[2],1))+'</div></div>').join('');
  },note:'<p>« Qui est-ce ? » : lisez la phrase, laissez la salle crier le prénom, puis révélez. Pour le vrai / faux, demandez à un élève qui a voté « faux » de corriger la phrase en arabe. Les questions de la partie 3 se font en binômes (5 min), puis on corrige ensemble : les réponses n\'ont qu\'à reprendre des morceaux du texte.</p>'},

  {ar:'لُعْبَةُ الْبَحْثِ',t:'La chasse aux indices',min:10,h:()=>{
    const all=STORY.map(storyPara).join(' ');
    const btn=(k,lab,col)=>'<button class="chunt" style="--c:'+col+'" onclick="huntHL(\''+k+'\',this)">'+lab+'</button>';
    return cTeam('<strong>Par équipes de deux ou trois.</strong> Cherchez dans le texte, comptez, puis comparez avec les autres équipes. L\'animateur vérifie en surlignant.')+
    '<div class="chunts">'+btn('al','1. Les mots qui commencent par الْـ','#2B4BC9')+btn('ta','2. Les mots qui finissent par ة','#B3382F')+btn('pr','3. Les petits mots أَنَا، أَنْتَ، أَنْتِ، هُوَ، هِيَ، نَحْنُ','#2E7D5B')+'</div><div id="huntRes" class="cfr"></div>'+
    '<div class="cstory ar cread" id="huntText">'+renderAr(all)+'</div>'+
    cAsk('<strong>1.</strong> <span class="ar">الْـ</span> au début d\'un mot : à votre avis, que veut-il dire ? Indice : <span class="ar">مَسْجِدٌ</span> / <span class="ar">الْمَسْجِدُ</span>. '+cRv('C\'est l\'article « le / la » : <span class="ar">مَسْجِدٌ</span> = une mosquée, <span class="ar">الْمَسْجِدُ</span> = la mosquée. Le petit « n » final (ـٌ) de <span class="ar">مَسْجِدٌ</span> disparaît avec l\'article.'))+
    cAsk('<strong>2.</strong> Regardez les mots en <span class="ar">ة</span> : <span class="ar">طَبِيبَةٌ، طَالِبَةٌ، جَدَّةٌ، سَعِيدَةٌ</span>. Qui parle quand on les entend ? '+cRv('Toujours une <strong>femme</strong> (Mariam, Sara, Fatima) ! Le <span class="ar">ة</span> est la marque du féminin. Nous allons l\'utiliser à l\'étape 7.'))+
    cAsk('<strong>4.</strong> Trouvez les 4 métiers du texte. '+cRv('<span class="ar">مُعَلِّمٌ</span> (enseignant) · <span class="ar">طَالِبٌ / طَالِبَةٌ</span> (étudiant·e, élève) · <span class="ar">طَبِيبَةٌ</span> (médecin) · <span class="ar">مُهَنْدِسٌ</span> (ingénieur)'));
  },note:'<p>Laissez 5 min de recherche, puis cliquez sur chaque bouton pour surligner les réponses dans le texte et afficher le total. L\'équipe la plus proche gagne un point pour le grand jeu de l\'étape 9 (notez-le). Ne donnez pas encore de règle : on découvre, la grammaire vient juste après.</p>'},

  {ar:'أَنَا، أَنْتَ، أَنْتِ، هُوَ، هِيَ',t:'Grammaire 1 : je, tu, il, elle',min:15,h:()=>{
    const P=[['أَنَا','je','👆 on se montre soi-même'],['أَنْتَ','tu (à un homme)','👉 on montre un homme en face'],['أَنْتِ','tu (à une femme)','👉 on montre une femme en face'],['هُوَ','il','👈 on montre un homme sur le côté'],['هِيَ','elle','👈 on montre une femme sur le côté'],['نَحْنُ','nous','🫂 on montre tout le groupe']];
    const ex=[['يُوسُفُ ← ؟','هُوَ'],['مَرْيَمُ ← ؟','هِيَ'],['(à Karim) ؟ مُهَنْدِسٌ.','أَنْتَ مُهَنْدِسٌ.'],['(à Sara) ؟ طَالِبَةٌ.','أَنْتِ طَالِبَةٌ.'],['(Fatima parle) ؟ جَدَّةٌ.','أَنَا جَدَّةٌ.'],['كَرِيمٌ وَسَارَةُ (nous) : ؟ مِنْ تُونِسَ.','نَحْنُ مِنْ تُونِسَ.']];
    return cAsk('<strong>Enquête dans le texte :</strong> le professeur dit à Youssef <span class="ar">وَأَنْتَ؟ مَا اسْمُكَ؟</span> et à Mariam <span class="ar">وَأَنْتِ؟ مَا اسْمُكِ؟</span>. Trouvez les différences. Pourquoi ? '+cRv('<span class="ar">أَنْتَ</span> / <span class="ar">أَنْتِ</span> et <span class="ar">ـكَ</span> / <span class="ar">ـكِ</span> : fatḥa (« a ») pour un homme, kasra (« i ») pour une femme. En arabe, « tu » n\'est pas le même selon qu\'on parle à un homme ou à une femme.'))+
    '<div class="cgrid3">'+P.map(p=>'<div class="ccard ccenter">'+cSay(p[0])+'<div>'+cA(p[0],1)+'</div><div class="cbigfr">'+p[1]+'</div><div class="cfr">'+p[2]+'</div></div>').join('')+'</div>'+
    cTeam('<strong>Le jeu du doigt :</strong> l\'animateur montre quelqu\'un (lui-même, un homme, une femme, le groupe…) ; la classe crie le bon mot. Puis un élève prend la place de l\'animateur.')+
    '<h3>Complétez avec le bon pronom</h3><div class="cgrid2">'+ex.map(e=>'<div class="ccard">'+cA(e[0],1)+'<div class="cans">'+cRv(cA(e[1],1))+'</div></div>').join('')+'</div>'+
    '<div class="gnote">À retenir : <span class="ar">أَنَا</span> je · <span class="ar">أَنْتَ</span> tu (homme) · <span class="ar">أَنْتِ</span> tu (femme) · <span class="ar">هُوَ</span> il · <span class="ar">هِيَ</span> elle · <span class="ar">نَحْنُ</span> nous. Il n\'y a pas de « vous » de politesse : on dit <span class="ar">أَنْتَ</span> à tout le monde, même au professeur.</div>';
  },note:'<p>Commencez par l\'enquête (laissez les élèves trouver la différence a / i), puis présentez les six cartes avec les gestes : faites répéter chaque mot avec son geste. Le jeu du doigt doit être rapide et bruyant (3 min). Les exercices se font à l\'oral : un élève répond, la classe valide, puis on révèle.</p>'},

  {ar:'اِسْتِرَاحَةٌ',t:'Pause',min:10,h:()=>
    '<div class="cpause"><div class="cpause-i">☕</div>'+cA('اِسْتِرَاحَةٌ',1)+'<p class="cbigfr">Pause de 10 minutes</p></div>'+
    cAsk('<strong>Défi de la pause :</strong> essayez d\'écrire votre prénom en lettres arabes sur un papier. Au retour, quelques volontaires l\'écrivent au tableau !')+
    '<div class="ccard ccenter"><div class="cfr">Exemples</div>'+cA('يُوسُفُ · مَرْيَمُ · سَارَةُ · كَرِيمٌ · فَاطِمَةُ',1)+'</div>',
   note:'<p>Lancez le minuteur. Pendant la pause, passez voir ceux qui écrivent leur prénom et aidez-les pour les voyelles longues (ا، و، ي).</p>'},

  {ar:'أَنَا طَالِبٌ — أَنَا طَالِبَةٌ',t:'Grammaire 2 : « je suis » et le féminin',min:10,h:()=>{
    const F=[['طَالِبٌ','طَالِبَةٌ','étudiant·e'],['مُعَلِّمٌ','مُعَلِّمَةٌ','enseignant·e'],['طَبِيبٌ','طَبِيبَةٌ','médecin'],['مُهَنْدِسٌ','مُهَنْدِسَةٌ','ingénieur·e'],['سَعِيدٌ','سَعِيدَةٌ','heureux / heureuse'],['جَدِيدٌ','جَدِيدَةٌ','nouveau / nouvelle']];
    const err=[['هِيَ طَالِبٌ.','هِيَ طَالِبَةٌ.'],['هُوَ مُعَلِّمَةٌ.','هُوَ مُعَلِّمٌ.'],['(à Mariam) أَنْتِ طَبِيبٌ.','أَنْتِ طَبِيبَةٌ.'],['أَنَا فَاطِمَةُ، أَنَا سَعِيدٌ.','أَنَا فَاطِمَةُ، أَنَا سَعِيدَةٌ.']];
    return cAsk('<span class="ar cbig">أَنَا طَالِبٌ.</span> = « Je suis étudiant. » Comptez les mots : 2 en arabe, 3 en français. <strong>Où est passé « suis » ?</strong> '+cRv('Il n\'existe pas ! Au présent, l\'arabe n\'a pas besoin du verbe « être » : <span class="ar">أَنَا طَالِبٌ</span> = « moi étudiant ». De même <span class="ar">هِيَ طَبِيبَةٌ</span> = elle (est) médecin, <span class="ar">الدَّرْسُ سَهْلٌ</span> = la leçon (est) facile.'))+
    '<h3>Du masculin au féminin : on ajoute ة</h3><div class="cgrid3">'+F.map(f=>'<div class="ccard ccenter">'+cA(f[0],1)+'<div class="carrow">↓ + ة</div>'+cRv(cA(f[1],1))+'<div class="cfr">'+f[2]+'</div></div>').join('')+'</div>'+
    '<h3>Chasse à l\'erreur 🔎</h3>'+cTeam('Chaque phrase contient une erreur. Par deux, trouvez-la et corrigez-la.')+
    '<div class="cgrid2">'+err.map(e=>'<div class="ccard">'+cA('❌ '+e[0],1)+'<div class="cans">'+cRv(cA('✅ '+e[1],1))+'</div></div>').join('')+'</div>';
  },note:'<p>Faites deviner chaque féminin avant de le révéler : la règle « + ة » se découvre dès le deuxième mot. Pour la chasse à l\'erreur, la question clé est toujours : « qui parle, ou de qui parle-t-on ? un homme ou une femme ? »</p>'},

  {ar:'تَعَارُفٌ',t:'Atelier en binômes : faisons connaissance',min:15,h:()=>{
    const D=[['أ','السَّلَامُ عَلَيْكُمْ!'],['ب','وَعَلَيْكُمُ السَّلَامُ!'],['أ','مَا اسْمُكَ؟ / مَا اسْمُكِ؟'],['ب','اِسْمِي …'],['أ','مِنْ أَيْنَ أَنْتَ؟ / مِنْ أَيْنَ أَنْتِ؟'],['ب','أَنَا مِنْ …'],['أ','هَلْ أَنْتَ طَالِبٌ؟ / هَلْ أَنْتِ طَالِبَةٌ؟'],['ب','نَعَمْ، أَنَا … / لَا، أَنَا …'],['أ','تَشَرَّفْنَا!'],['ب','تَشَرَّفْنَا!']];
    const jobs=['طَالِبٌ / طَالِبَةٌ','مُعَلِّمٌ / مُعَلِّمَةٌ','طَبِيبٌ / طَبِيبَةٌ','مُهَنْدِسٌ / مُهَنْدِسَةٌ','مُوَظَّفٌ / مُوَظَّفَةٌ','عَامِلٌ / عَامِلَةٌ','تَاجِرٌ / تَاجِرَةٌ','مُتَقَاعِدٌ / مُتَقَاعِدَةٌ'];
    const jobsFr=['étudiant·e, élève','enseignant·e','médecin','ingénieur·e','employé·e','ouvrier·ère','commerçant·e','retraité·e'];
    const pays=[['فَرَنْسَا','France'],['الْمَغْرِبُ','Maroc'],['الْجَزَائِرُ','Algérie'],['تُونِسُ','Tunisie'],['تُرْكِيَا','Turquie'],['السِّنِغَالُ','Sénégal'],['مِصْرُ','Égypte'],['فُوَارُون','Voiron']];
    return '<div class="cgrid2"><div class="ccard"><h3>Le dialogue</h3>'+D.map(d=>'<div class="cdlg"><span class="cwho">'+(d[0]==='أ'?'A':'B')+'</span>'+cSay(d[1].split(' / ')[0].replace('…',''))+cA(d[1],1)+'</div>').join('')+
    '<p class="cfr">tu (homme) ـكَ / أَنْتَ · tu (femme) ـكِ / أَنْتِ · <span class="ar">تَشَرَّفْنَا</span> = enchanté(e) · <span class="ar">نَعَمْ</span> oui · <span class="ar">لَا</span> non · <span class="ar">هَلْ</span> = est-ce que</p></div>'+
    '<div class="ccard"><h3>Banque de mots</h3><p class="cfr">Métiers (masculin / féminin)</p>'+jobs.map((j,i)=>'<div class="cword">'+cA(j)+' <span class="cfr">'+jobsFr[i]+'</span></div>').join('')+
    '<p class="cfr" style="margin-top:10px">Pays et villes (<span class="ar">أَنَا مِنْ …</span>)</p><div class="cchips">'+pays.map(p=>'<span class="cchip">'+cA(p[0])+' '+p[1]+'</span>').join('')+'</div></div></div>'+
    cTeam('<strong>1. (7 min)</strong> Par deux, jouez le dialogue avec vos vraies informations, puis échangez les rôles A et B. Attention au masculin / féminin !')+
    cTeam('<strong>2. (8 min)</strong> Chacun présente son binôme à la classe, avec <span class="ar">هُوَ</span> ou <span class="ar">هِيَ</span> :<br>'+cA('هَذَا صَدِيقِي. اِسْمُهُ … هُوَ مِنْ … هُوَ …',1)+'<br>'+cA('هَذِهِ صَدِيقَتِي. اِسْمُهَا … هِيَ مِنْ … هِيَ …',1)+'<br><span class="cfr">Voici mon ami / mon amie. Il / elle s\'appelle… Il / elle est de… Il / elle est…</span>');

function gameHTML(){
  const G=CL.game,q=GAMEQ[G.q];

  return '<div class="cscores">'+team(0,'Soleil','الشَّمْسُ','☀️')+team(1,'Lune','الْقَمَرُ','🌙')+'</div>'+

  '<div class="exnav"><button class="btn-ghost" onclick="gameNav(-1)" '+(G.q?'':'disabled')+'>← Question précédente</button><button class="btn" onclick="gameNav(1)" '+(G.q<GAMEQ.length-1?'':'disabled')+'>Question suivante →</button></div>';

function gameScore(i,d){CL.game.s[i]=Math.max(0,CL.game.s[i]+d);coursStep();}
function gameNav(d){CL.game.q=Math.min(GAMEQ.length-1,Math.max(0,CL.game.q+d));CL.game.show=false;coursStep();}
function huntHL(k,btn){
  const box=$('#huntText');if(!box)return;
  const on=!btn.classList.contains('on');btn.classList.toggle('on',on);
  let n=0;
  box.querySelectorAll('.w').forEach(w=>{
    const t=norm(w.dataset.w),b=t.replace(/^[وف](?=ال|أن|ه|نح)/,'');
    const hit=k==='al'?(/^(ال|لل|بال)/.test(b)&&!/^(الله|لله)$/.test(b)):k==='ta'?/ة$/.test(t):['أنا','أنت','هو','هي','نحن'].includes(b);
    if(hit){w.classList.toggle('hl-'+k,on);n++;}
  });
  $('#huntRes').innerHTML=on?btn.textContent.replace(/^\d\.\s*/,'')+' : <strong>'+n+'</strong> trouvés.':'';
}

/* état de la leçon projetée : étape, mode de lecture, jeu, minuteur */
let CL={c:0,step:0,theatre:false,game:{q:0,show:false,s:[0,0]}};
let CTIMER={left:0,run:false,h:null};
function coursList(){

}
function coursCards(){
  return '<div class="ccours">'+COURS.map((c,i)=>{const tot=c.steps.reduce((a,s)=>a+s.min,0);
    return '<div class="bigcard ccourscard" onclick="go(\'cours\','+i+')"><span class="badge">Leçon '+(i+1)+' · '+Math.floor(tot/60)+' h'+(tot%60?' '+(tot%60):'')+' · '+c.steps.length+' étapes</span><div class="ccourstitle"><span class="ar">'+c.ta+'</span><h2>'+esc(c.t)+'</h2></div><p>'+esc(c.sub)+'</p></div>';}).join('')+'</div>';
}
function cours(i){
  setNav('cours');
  if(CL.c!==i)CL={c:i,step:0,theatre:false,game:{q:0,show:false,s:[0,0]}};
  const c=COURS[i];
  app.innerHTML='<div class="classroom keepv"><div class="chead"><div><div class="eyebrow">Leçon '+(i+1)+' · '+esc(c.t)+'</div></div>'+
  '<div class="csteps">'+c.steps.map((s,k)=>'<button class="cstep" data-k="'+k+'" onclick="coursGo('+k+')" title="'+esc(s.t)+'">'+(k+1)+'</button>').join('')+'</div></div><div id="cstepbody"></div></div>';
  coursStep(true);
}
function coursGo(k){const n=COURS[CL.c].steps.length;if(k<0||k>=n)return;CL.step=k;coursStep(true);window.scrollTo({top:0});}
function coursStep(resetTimer){
  const c=COURS[CL.c],k=CL.step,s=c.steps[k];
  document.querySelectorAll('.cstep').forEach(b=>{const j=+b.dataset.k;b.classList.toggle('active',j===k);b.classList.toggle('past',j<k);});
  if(resetTimer){stopSay();timerSet(s.min*60);}
  const before=c.steps.slice(0,k).reduce((a,x)=>a+x.min,0);
  const last=k===c.steps.length-1;
  $('#cstepbody').innerHTML='<div class="cstephead"><div><div class="cstepnum">Étape '+(k+1)+' / '+c.steps.length+' · de '+fmtMin(before)+' à '+fmtMin(before+s.min)+'</div><h1><span class="ar">'+s.ar+'</span>'+esc(s.t)+'</h1></div>'+
  '<div class="ctimer"><div id="ctime" class="ctime">'+fmtSec(CTIMER.left)+'</div><div><button class="btn-ghost" onclick="timerToggle()" id="ctbtn">'+(CTIMER.run?'⏸':'▶')+'</button> <button class="btn-ghost" onclick="timerSet('+s.min*60+')">↺</button></div></div></div>'+
  '<div class="cbody">'+s.h()+'</div>'+(s.note?cNote(s.note):'')+
  '<div class="exnav"><button class="btn-ghost" onclick="coursGo('+(k-1)+')" '+(k?'':'disabled')+'>← Étape précédente</button><button class="btn" onclick="'+(last?'go(\'home\')':'coursGo('+(k+1)+')')+'">'+(last?'Terminer la leçon':'Étape suivante : '+esc(c.steps[k+1].t)+' →')+'</button></div>';
  /* les notes de l'étape peuvent aussi être dans le corps (fonction note) */
}
const fmtMin=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
const fmtSec=s=>(s<0?'−':'')+Math.floor(Math.abs(s)/60)+':'+String(Math.abs(s)%60).padStart(2,'0');
function timerSet(sec){clearInterval(CTIMER.h);CTIMER={left:sec,run:false,h:null};timerShow();}
function timerToggle(){
  if(CTIMER.run){clearInterval(CTIMER.h);CTIMER.run=false;}
  else{CTIMER.run=true;CTIMER.h=setInterval(()=>{CTIMER.left--;timerShow();},1000);}
  timerShow();
}
function timerShow(){const t=$('#ctime');if(t){t.textContent=fmtSec(CTIMER.left);t.classList.toggle('over',CTIMER.left<=0);}const b=$('#ctbtn');if(b)b.textContent=CTIMER.run?'⏸':'▶';}
document.addEventListener('keydown',e=>{
  if(view.name!=='cours'||e.target.closest('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();coursGo(CL.step+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();coursGo(CL.step-1);}
});

/* {{L:id}} → lien « la leçon N » ; « leçon N » après une parenthèse ou une virgule */
function lessonRefs(h){
  return h.replace(/(\(|, )?\{\{L:(\w+)\}\}/g,(m,pre,id)=>{
    const k=GRAMMAR.findIndex(g=>g.id===id);
    return (pre||'')+'<a class="lref" href="#" onclick="go(\'lesson\','+k+');return false" title="'+esc(GRAMMAR[k].t)+'">'+(pre?'':'la ')+'leçon '+(k+1)+'</a>';
  });
}
/* entoure d'un span .ar les passages arabes d'une phrase française (consignes de QCM) */
function arSpans(s){return esc(s).replace(/[؀-ۿ][؀-ۿً-ْٰ ]*[؀-ۿً-ْٰ]|[؀-ۿ]/g,m=>'<span class="ar ari">'+m+'</span>');}
let LQ=null; // QCM de la leçon affichée (réponses conservées si on bascule les voyelles)
function lesson(i){
  setNav('grammar');
  const g=GRAMMAR[i];
  if(!LQ||LQ.i!==i)LQ={i,items:g.ex.map(q=>({q:q.q,note:q.note,kv:q.kv,opts:shuffle(q.opts.map((o,k)=>({t:o,ok:k===q.a})))}))};
  const prev=i>0?'<button class="tab" onclick="go(\'lesson\','+(i-1)+')">← Leçon '+i+'</button>':'';
  const next=i<GRAMMAR.length-1?'<button class="tab" onclick="go(\'lesson\','+(i+1)+')">Leçon '+(i+2)+' →</button>':'';
  const quiz=LQ.items.length?'<h2 class="gpart">Exercices</h2><p style="color:var(--ink2)">Vérifie que tu as compris la leçon.</p><div id="lquiz">'+lessonQuizHTML()+'</div>':'';
  stopSay();
  app.innerHTML='<div class="hero"><div class="eyebrow"><span class="kufi">'+esc(dv(g.ta,g.tav))+'</span> leçon '+(i+1)+' / '+GRAMMAR.length+'</div><h1>'+arSpans(g.t)+'</h1></div><div class="lesson">'+'<p class="hint">Touche un mot ou une phrase arabe de la leçon pour l\'entendre.</p>'+lessonRefs(g.h)+'</div>'+quiz+'<div class="tabs">'+prev+'<button class="tab" onclick="go(\'grammar\')">Toutes les leçons</button>'+next+'</div>';
  markSayable($('.lesson'));
}
/* mémorise la forme vocalisée de chaque passage arabe avant que le mode sans voyelles ne la retire */
function markSayable(root){root.querySelectorAll('.ar').forEach(e=>{const tx=e.textContent.split('—')[0].replace(/[A-Za-zÀ-ÿ'’;…]+/g,' ').replace(/\s+/g,' ').trim();if(!e.closest('.nov')&&!e.querySelector('.ar')&&/[\u0621-\u064A]{2}/.test(stripHarakat(tx).replace(/\u0640/g,''))){e.dataset.say=tx;e.classList.add('sayable');}});}
function lessonQuizHTML(){
  let right=0,done=0;
  const body=LQ.items.map((it,qi)=>{
    const answered=it.picked!==undefined;
    if(answered){done++;if(it.opts[it.picked].ok)right++;}
    const opts=it.opts.map((o,oi)=>{
      let cls='opt';if(answered){if(o.ok)cls+=' ok';else if(oi===it.picked)cls+=' ko';}
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="ansLesson('+qi+','+oi+')">'+arSpans(o.t)+'</button>';
    }).join('');
    const fb=answered?'<div class="fb '+(it.opts[it.picked].ok?'ok':'ko')+'">'+(it.opts[it.picked].ok?'✓ Correct':'✗ La bonne réponse est en vert.')+' <span style="color:var(--ink2);font-weight:400">— '+arSpans(it.note)+'</span></div>':'';
    return '<div class="q'+(it.kv?' keepv':'')+'"><div class="prompt">'+arSpans(it.q)+'</div><div class="opts">'+opts+'</div>'+fb+'</div>';
  }).join('');
  return body+(done===LQ.items.length?'<div class="score">Score : '+right+' / '+LQ.items.length+'</div>':'');
}
function ansLesson(qi,oi){
  const it=LQ.items[qi];if(it.picked!==undefined)return;
  it.picked=oi;
  const box=$('#lquiz');box.innerHTML=lessonQuizHTML();applyVocalDOM(box);
  if(LQ.items.every(x=>x.picked!==undefined)){const d=store.get('gdone',{});d[GRAMMAR[LQ.i].id]=true;store.set('gdone',d);}
}

function srcOf(t){

/* navigation entre les 5 exercices : répéter l'exercice courant / passer au suivant (le dernier mène au texte suivant) */
function updateExNav(){
  const b=$('#exnext');if(!b)return;
  const last=EX.cur>=4,next=TEXTS.find(x=>x.id===EX.t.id+1);
  b.textContent=!last?'Exo suivant →':next?'Texte suivant →':'Tous les textes';
}
function nextEx(){
  if(EX.cur<4){showEx(EX.cur+1);window.scrollTo({top:$('#extabs').offsetTop-70,behavior:'smooth'});return;}
  const next=TEXTS.find(x=>x.id===EX.t.id+1);
  if(next)go('text',next.id);else go('texts');
}
function retryEx(){
  const D=EX.data,i=EX.cur;
  const redo=items=>items.forEach(it=>{delete it.picked;it.opts=shuffle(it.opts);});
  if(i===0)redo(D.q1);
  else if(i===1){EX.matched.clear();D.mL=shuffle(D.mL);D.mR=shuffle(D.mR);}
  else if(i===2)redo(D.holes);
  else if(i===3){D.gq.splice(0,D.gq.length,...drawGrammarQ());}
  else if(i===4)D.tf.forEach(it=>delete it.picked);
  EX.scores[i]=null;
  showEx(i);window.scrollTo({top:$('#extabs').offsetTop-70,behavior:'smooth'});
}
function showEx(i){
  document.querySelectorAll('#extabs .tab').forEach((b,j)=>b.classList.toggle('active',i===j));
  EX.cur=i;
  updateExNav();
  $('#exbody').innerHTML=EX.render[i]();
  applyVocalDOM($('#exbody'));
}

/* ---------- construction des 5 exercices ---------- */
function frOf(w){const r=lookup(w);return r?r.e[0].split('/')[0].split('·')[0].trim():w;}
function vf(w){if(/\s/.test(w.trim()))return w.trim().split(/\s+/).map(vf).join(' ');const n=norm(w);return (typeof VBASE!=='undefined'&&VBASE[n])||(typeof VMAP!=='undefined'&&VMAP[n])||w;} /* forme vocalisée, indépendante du mode */
function dv(plain,voc){return vocalOn&&voc?voc:plain;} /* choix d'affichage selon le mode */
function splitSents(p){return p.split(/([^.؟!]+[.؟!]?)/).filter(x=>x.trim()).map(x=>x.trim());}
function drawGrammarQ(){return shuffle(GRAMMAR_POOL).slice(0,5).map(g=>({fr:g.q,note:g.note,kv:g.kv,opts:shuffle(g.opts.map((o,i)=>({t:g.kv?o:stripHarakat(o),tv:o,ok:i===g.a})))}));}
function buildExercises(t){
  const VP=(typeof VOCAL!=='undefined'&&VOCAL[t.id])||null;
  const vocab=t.v.map(w=>({ar:w,arv:vf(w),fr:frOf(w)}));
  const pool=[];TEXTS.forEach(x=>{if(x.id!==t.id)x.v.forEach(w=>pool.push(w));});
  /* ex1 : QCM ar→fr */
  const q1=shuffle(vocab).slice(0,5).map(v=>{
    const wrong=shuffle(pool.filter(w=>frOf(w)!==v.fr)).slice(0,2).map(frOf);
    return{ar:v.ar,arv:v.arv,opts:shuffle([{t:v.fr,ok:true},...wrong.map(w=>({t:w,ok:false}))])};
  });
  /* ex2 : association — ordres tirés une seule fois */
  const pairs=shuffle(vocab).slice(0,6);
  const mL=shuffle(pairs.map((p,i)=>i)),mR=shuffle(pairs.map((p,i)=>i));
  /* ex3 : trous — phrases plate/vocalisée alignées token par token */
  const sentPairs=[];
  t.p.forEach((p,pi)=>{
    const a=splitSents(p),b=VP?splitSents(VP.p[pi]):a;
    a.forEach((x,si)=>sentPairs.push([x,b[si]||x]));
  });
  const holes=[];
  for(const v of shuffle(vocab)){
    if(holes.length>=5)break;
    for(const [sent,sentv] of sentPairs){
      const toks=sent.split(/\s+/),toksv=sentv.split(/\s+/);
      const idx=toks.findIndex(tk=>{const n=norm(tk),a=v.ar;return n===a||n==='ال'+a||n===a+'ة'||n===a+'ا'||n==='و'+a||n==='وال'+a||n==='بال'+a||n==='لل'+a.slice(a.startsWith('ا')?1:0);});
      if(idx>=0&&toks.length>=4){
        const wrong=shuffle(vocab.filter(x=>x.ar!==v.ar)).slice(0,2);
        holes.push({sent:toks.map((tk,i)=>i===idx?'____':tk).join(' '),sentv:toksv.map((tk,i)=>i===idx?'____':tk).join(' '),
          opts:shuffle([{t:toks[idx],tv:toksv[idx]||toks[idx],ok:true},...wrong.map(w=>({t:w.ar,tv:w.arv,ok:false}))])});
        break;
      }
    }
  }
  if(holes.length<5){
    const STOP=new Set(['في','من','على','إلى','مع','عن','أن','إن','لا','ما','لم','لن','هل','ثم','أو','كل','هذا','هذه','ذلك','هو','هي','هم','أنا','نحن','كان','كانت','عند','بعد','قبل','لأن','لكن','اسمه','اسمها','اسمي']);
    const used=new Set(holes.map(h=>norm(h.opts.find(o=>o.ok).t)));
    for(const [sent,sentv] of shuffle(sentPairs)){
      if(holes.length>=5)break;
      const toks=sent.split(/\s+/),toksv=sentv.split(/\s+/);if(toks.length<4)continue;
      const cands=toks.map((tk,i)=>({tk,i,n:norm(tk)})).filter(x=>x.n.length>=4&&!STOP.has(x.n)&&!used.has(x.n)&&lookup(x.tk));
      if(!cands.length)continue;
      const c=cands[Math.floor(Math.random()*cands.length)];used.add(c.n);
      const others=shuffle([...new Set(t.p.join(' ').split(/\s+/).map(norm))].filter(n=>n.length>=3&&n!==c.n&&!STOP.has(n))).slice(0,2);
      holes.push({sent:toks.map((tk,i)=>i===c.i?'____':tk).join(' '),sentv:toksv.map((tk,i)=>i===c.i?'____':tk).join(' '),
        opts:shuffle([{t:c.tk,tv:toksv[c.i]||c.tk,ok:true},...others.map(w=>({t:w,tv:vf(w),ok:false}))])});
    }
  }
  /* ex4 : grammaire — options mélangées une seule fois */
  const gq=drawGrammarQ();
  /* ex5 : vrai/faux */
  const tf=t.tf.map((x,i)=>({s:x[0],sv:VP?VP.tf[i]:x[0],v:x[1]}));
  const ex={cur:0,scores:[null,null,null,null,null],t,matched:new Set()};
  ex.data={q1,pairs,mL,mR,holes,gq,tf};
  ex.render=[
    ()=>exQCM(q1,0,'Choisis la traduction française de chaque mot.'),
    ()=>exMatch(),
    ()=>exQCM(holes,2,'Complète chaque phrase avec le bon mot.'),
    ()=>exQCM(gq,3,'Cinq questions de grammaire tirées des leçons.'),
    ()=>exTF(tf)
  ];
  return ex;
}

/* ---------- moteurs d'exercices (état persistant : le toggle voyelles ne change rien) ---------- */
/* texte mêlant français et arabe (traductions du dictionnaire, consignes) : vocalise les mots arabes nus en mode voyelles, retire les voyelles sinon */
const FRAG={'ـي':'ـِي','ـه':'ـهُ','ـها':'ـهَا','ـني':'ـنِي','ـنا':'ـنَا','ـك':'ـكَ','ـكم':'ـكُمْ','ـهم':'ـهُمْ','ـات':'ـَات','سـ':'سَـ','بـ':'بِـ'}; /* suffixes et préfixes isolés */
function vocMix(s){return vocalOn?s.replace(/[\u0621-\u064A\u0640\u064B-\u0652\u0670]+/g,w=>FRAG[w]||(HARAKAT_RE.test(w)||/\u0640/.test(w)?w:vf(w))):stripHarakat(s);}
function optLabel(o){const txt=dv(o.t,o.tv);return /[A-Za-zÀ-ÿ]/.test(txt)?arSpans(vocalOn?vocMix(txt):txt):/[\u0600-\u06FF]/.test(txt)?'<span class="ar kufi">'+esc(txt)+'</span>':esc(txt);}
function exQCM(items,slot,intro){
  window._qcm={items,slot};
  let done=0,right=0;
  const body=items.map((it,qi)=>{
    const prompt=it.fr!==undefined?arSpans(it.fr):'<span class="ar kufi" dir="rtl">'+esc(dv(it.sent!==undefined?it.sent:it.ar,it.sentv!==undefined?it.sentv:it.arv))+'</span>';
    const answered=it.picked!==undefined;
    if(answered){done++;if(it.opts[it.picked].ok)right++;}
    const opts=it.opts.map((o,oi)=>{
      let cls='opt';if(answered){if(o.ok)cls+=' ok';else if(oi===it.picked)cls+=' ko';}
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="ansQCM(this,'+qi+','+oi+')">'+optLabel(o)+'</button>';
    }).join('');
    let fb='';
    if(answered){
      const ok=it.opts[it.picked].ok;
      fb='<div class="fb '+(ok?'ok':'ko')+'">'+(ok?'✓ Correct':'✗ La bonne réponse est en vert.')+(it.note?' <span style="color:var(--ink2);font-weight:400">— '+arSpans(it.note)+'</span>':'')+'</div>';
    }else fb='<div class="fb"></div>';
    return '<div class="q'+(it.kv?' keepv':'')+'"'+(answered?' data-done="1"':'')+'><div class="prompt">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb+'</div>';
  }).join('');
  const scoreVis=done===items.length;
  if(scoreVis)EX.scores[slot]=right/items.length;
  return '<p style="color:var(--ink2)">'+intro+'</p>'+body+'<div class="score" id="qscore" style="display:'+(scoreVis?'block':'none')+'">'+(scoreVis?'Score : '+right+' / '+items.length:'')+'</div>';
}
function ansQCM(btn,qi,oi){
  const st=window._qcm,it=st.items[qi],q=btn.closest('.q');
  if(q.dataset.done)return;q.dataset.done=1;
  it.picked=oi;
  q.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(it.opts[i].ok)b.classList.add('ok');});
  const fb=q.querySelector('.fb');
  if(it.opts[oi].ok){fb.textContent='✓ Correct';fb.className='fb ok';}
  else{btn.classList.add('ko');fb.textContent='✗ La bonne réponse est en vert.';fb.className='fb ko';}
  if(it.note)fb.innerHTML+=' <span style="color:var(--ink2);font-weight:400">— '+arSpans(vocalOn||it.kv?it.note:stripHarakat(it.note))+'</span>';
  const done=st.items.filter(x=>x.picked!==undefined).length;
  if(done===st.items.length){
    const right=st.items.filter(x=>x.opts[x.picked].ok).length;
    const sc=$('#qscore');sc.style.display='block';sc.textContent='Score : '+right+' / '+st.items.length;
    EX.scores[st.slot]=right/st.items.length;
  }
}
function exMatch(){
  const D=EX.data,pairs=D.pairs;
  window._m={sel:null};
  const btn=(i,side)=>{
    const p=pairs[i],matched=EX.matched.has(i);
    const label=side==='l'?'<span class="ar kufi">'+esc(dv(p.ar,p.arv))+'</span>':arSpans(vocMix(p.fr));
    return '<button class="mbtn'+(matched?' ok':'')+'" data-i="'+i+'" data-side="'+side+'" onclick="pick(this)">'+label+'</button>';
  };
  const full=EX.matched.size===pairs.length;
  if(full)EX.scores[1]=1;
  return '<p style="color:var(--ink2)">Associe chaque mot arabe à sa traduction. Touche un mot puis sa paire.</p><div class="match">'+
  '<div style="display:grid;gap:8px">'+D.mL.map(i=>btn(i,'l')).join('')+'</div>'+
  '<div style="display:grid;gap:8px">'+D.mR.map(i=>btn(i,'r')).join('')+'</div>'+
  '</div><div class="score" id="mscore" style="display:'+(full?'block':'none')+'">Toutes les paires trouvées ✓</div>';
}
function pick(b){
  const st=window._m;
  if(b.classList.contains('ok'))return;
  if(!st.sel){st.sel=b;b.classList.add('sel');return;}
  if(st.sel===b){b.classList.remove('sel');st.sel=null;return;}
  if(st.sel.dataset.side===b.dataset.side){st.sel.classList.remove('sel');st.sel=b;b.classList.add('sel');return;}
  if(st.sel.dataset.i===b.dataset.i){
    st.sel.classList.remove('sel');st.sel.classList.add('ok');b.classList.add('ok');st.sel=null;
    EX.matched.add(+b.dataset.i);
    if(EX.matched.size===EX.data.pairs.length){$('#mscore').style.display='block';EX.scores[1]=1;}
  }
  else{const a=st.sel;a.classList.remove('sel');a.classList.add('ko');b.classList.add('ko');st.sel=null;setTimeout(()=>{a.classList.remove('ko');b.classList.remove('ko');},450);}
}
function exTF(items){
  window._tf={items};
  let done=0,right=0;
  const body=items.map((it,i)=>{
    const answered=it.picked!==undefined;
    if(answered){done++;if(it.picked===it.v)right++;}
    const bt=(val,lab)=>{
      let cls='opt';if(answered){if(val===it.v)cls+=' ok';else if(val===it.picked)cls+=' ko';}
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="ansTF(this,'+i+','+val+')">'+lab+'</button>';
    };
    const fb=answered?'<div class="fb '+(it.picked===it.v?'ok':'ko')+'">'+(it.picked===it.v?'✓ Correct':'✗ Relis le texte.')+'</div>':'<div class="fb"></div>';
    return '<div class="q"'+(answered?' data-done="1"':'')+'><div class="prompt"><span class="ar kufi" dir="rtl">'+renderAr(dv(it.s,it.sv))+'</span></div><div class="opts" style="grid-template-columns:1fr 1fr">'+bt(true,dv('صحيح','صَحِيح')+' — Vrai')+bt(false,dv('خطأ','خَطَأ')+' — Faux')+'</div>'+fb+'</div>';
  }).join('');
  const full=done===items.length;
  if(full)EX.scores[4]=right/items.length;
  return '<p style="color:var(--ink2)">D\'après le texte, chaque phrase est-elle vraie ou fausse ?</p>'+body+
  '<div class="score" id="tfscore" style="display:'+(full?'block':'none')+'">'+(full?'Score : '+right+' / '+items.length:'')+'</div>';
}
function ansTF(btn,i,val){
  const st=window._tf,it=st.items[i],q=btn.closest('.q');
  if(q.dataset.done)return;q.dataset.done=1;
  it.picked=val;
  q.querySelectorAll('.opt').forEach(b=>{b.disabled=true;});
  const fb=q.querySelector('.fb');
  const okBtn=q.querySelectorAll('.opt')[it.v?0:1];okBtn.classList.add('ok');
  if(val===it.v){fb.textContent='✓ Correct';fb.className='fb ok';}
  else{btn.classList.add('ko');fb.textContent='✗ Relis le texte.';fb.className='fb ko';}
  const done=st.items.filter(x=>x.picked!==undefined).length;
  if(done===st.items.length){
    const right=st.items.filter(x=>x.picked===x.v).length;
    const sc=$('#tfscore');sc.style.display='block';sc.textContent='Score : '+right+' / '+st.items.length;
    EX.scores[4]=right/st.items.length;
    const done2=store.get('done',{});done2[EX.t.id]=true;store.set('done',done2);
  }
}

/* ================= zoom & thème ================= */
let vocalOn=store.get('vocal',false);
function applyVocalBtn(){const b=$('#vocalBtn');if(b)b.classList.toggle('on',vocalOn);}
function toggleVocal(){vocalOn=!vocalOn;store.set('vocal',vocalOn);applyVocalBtn();render();}

let zoomLv=store.get('zoom',1);
function applyZoom(){document.documentElement.style.setProperty('--zoom',zoomLv);}
function zoom(d){zoomLv=Math.min(1.8,Math.max(0.8,Math.round((zoomLv+d*0.1)*10)/10));store.set('zoom',zoomLv);applyZoom();}
function toggleTheme(){const b=document.body;const dark=b.dataset.theme!=='dark';b.dataset.theme=dark?'dark':'light';store.set('theme',b.dataset.theme);}
function toggleFS(){
  try{
    const d=document;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);}
    else{const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  }catch(e){}
}
if(document.addEventListener)document.addEventListener('fullscreenchange',function(){const b=$('#fsBtn');if(b)b.classList.toggle('on',!!document.fullscreenElement);});
(function(){const th=store.get('theme',null);if(th)document.body.dataset.theme=th;applyZoom();applyVocalBtn();const nl=$('#nlessons');if(nl)nl.textContent=GRAMMAR.length;})();

render();
